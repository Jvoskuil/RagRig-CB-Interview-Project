# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time. This is a voluntary debrief reconstructing your decision-making on a specific fire support mission—not an evaluation for any board. You can decline any question. Good to proceed? Participant: Sure, happy to walk through it. Interviewer: Can you describe your role and the mission? Participant: I was the FSO attached to the company for a daylight clearing operation. We had an 82mm mortar team that had been harassing our forward positions, and intel flagged a possible staging compound near a village on the north edge of the objective. My job was coordinating mortars, then CAS, then artillery, to clear both threats before the company crossed the line of departure. Objective was simple enough on paper—suppress the mortar team, clear the compound, don't hit friendlies or the village. Interviewer: What made this mission nonroutine? Participant: We had a fairly generous window that day, about ninety minutes before the company needed to cross the line, so time wasn't the crunch it sometimes is. But ammo for the 81s was still limited from earlier use, comms between me and FSCC kept dropping intermittently, the compound was close enough to friendly squads to be danger-close, and the only real-time read on the compound came from a single ISR feed with no second source. Interviewer: Walk me through the sequence as it happened. Participant: First was the mortar mission against the mortar position. Adjustment round one landed short. Round two, also short. Section chief checked the gun-line data once, said no fault found. We still had most of the ninety minutes ahead of us at that point. Around the same time, I had two conflicting reports on the staging activity—battalion JTAC had one grid, the partner-force liaison next to us had a grid about three hundred meters off. Then CAS checked in for the compound piece, and last was the ISR cue on the compound right before the artillery mission. Interviewer: Let's take the mortar rounds first. What was the decision? Participant: Two rounds down, both short, section chief's one check came back clean. I had time to have them do a full re-lay from scratch—level, deflection, the works—or just fire the next adjustment round and see what happened. Interviewer: What did you decide? Participant: Fired again. Two shorts in a row, felt like we were due for one on target. Interviewer: You mentioned you had close to ninety minutes at that point. Did the time available factor into the call? Participant: Not really, if I'm honest. I had plenty of time to stop and have them recheck everything properly. I just didn't feel like it was necessary—the pattern read as random scatter that would correct itself. Interviewer: What happened with that third round? Participant: Also short. Turned out later there was a leveling error on the gun, unrelated to the first two misses. We caught it on a fourth check. Interviewer: If the section chief had reported a confirmed fault after the first miss, would your third-round call have changed? Participant: Yes, immediately—I'd have stopped for the recheck. Without a flagged fault, I read it as scatter that would sort itself out. Interviewer: Now the grid discrepancy. What did you have? Participant: Battalion JTAC, same battalion as me, called Grid A for the staging activity. Around the same time, the partner-force liaison called Grid B, roughly three hundred meters off, similar confidence in both reports. Nothing on paper that clearly outranked the other. Interviewer: How did you resolve it, given you had time to check both? Participant: I went with Grid A. It came through our own FSCC net, format I was used to, source I'd worked with the whole deployment. I did have the time to cross-check Grid B properly—there wasn't really anything stopping me—I just leaned toward our own channel. Interviewer: Did anything come of Grid B later? Participant: Follow-on recon picked up some indicators there too. Wasn't nothing. We just didn't chase it down at the time. Interviewer: If the partner-force liaison's report had come through your own channel instead, would you have weighted it the same as Grid A? Participant: Probably would've given it more credit. Hard to explain exactly why, but hearing it through your own net makes it feel more solid, even without a concrete reason the information itself was better. Interviewer: Let's cover the CAS run. What was the situation? Participant: Pilot on station, ready for a danger-close run near the compound. We'd run several strikes with this squadron over the deployment, all clean, standard margins. This time friendly-squad positioning put us tighter than usual, and we'd had comms dropouts with the lead squad in the minutes before. Interviewer: What were your options, given the window you had? Participant: I could've widened the margin or delayed for a stable comms check—we had plenty of time to do that without missing the assault—or cleared it with the tighter margin as-is. Interviewer: What did you choose? Participant: Cleared it hot with the tighter margin. This squadron had been reliable every time, so I expected the same result. Interviewer: What happened with comms during the final attack heading confirmation? Participant: Dropped again for about ten seconds. Came back before the pilot needed the call, so it worked out, but closer than I'd like looking back, especially since I had the time to just wait it out. Interviewer: If this had been the squadron's first-ever danger-close run with you, would you have set the same margin? Participant: No, I'd have wanted the wider margin and a cleaner comms check. The track record with them is what made the tighter margin feel acceptable. Interviewer: Last one—the artillery mission on the compound. Participant: Right before we committed the 155s, the ISR feed flagged one cue, 'possible enemy activity' at the compound. That sector had been quiet the whole deployment, mostly normal village pattern-of-life, and that sensor had a track record of throwing false hits in that terrain. Interviewer: What were the alternatives, given you had time to spare? Participant: Get a second source to confirm, since the area had been so quiet, or approve the mission off the one cue. We genuinely had time for the first option that day. Interviewer: What did you decide? Participant: I approved it off the single cue. It matched what we were looking for, so I went with it. Interviewer: What did the post-strike assessment show? Participant: Mixed—some indicators of prior enemy presence, some signs it might've been unoccupied by then. Inconclusive. Interviewer: If the sector had a recent history of confirmed enemy activity, would that one cue have been enough on its own? Participant: Probably would've felt about the same either way—I was focused on the cue itself more than the sector's overall track record. Interviewer: Across all four decisions, how did having that extra time affect your process? Participant: Honestly, less than I'd have expected. I used some of it—double-checked timing on the CAS brief, confirmed the 9-line details—but on the calls that mattered most, I don't think the extra time changed how I read the situation. Interviewer: Anything you'd do differently? Participant: Maybe push for that mortar recheck early since I clearly had the time for it, and get a second look at the compound cue rather than moving straight to the artillery mission. Given how much time we actually had, I probably could have afforded to slow down more than I did. Interviewer: Thanks for the detail—that's very helpful."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

