# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. This is for the after-action cognitive review, not attribution of blame—I just want to understand how the decisions actually got made. Okay with you? Participant: Sure, no problem. Interviewer: Can you start with your role and what the mission was? Participant: I'm the battalion S3 for the task force. Our mission was to secure and hold the Route BLUE crossing so brigade could push their main effort across within a 48-hour window. We had one Mobile Gap-Crossing Bridge, limited float capacity, and a weather forecast that was going to close our aerial ISR window at some point in that 48 hours. It mattered because if we didn't hold that crossing on schedule, brigade's synchronization slid. Interviewer: Walk me through how the incident unfolded, start to finish. Participant: About 48 hours out, S2 flagged enemy scout vehicles in a spot that didn't match what we'd been seeing—three months of pattern-of-life had them screening consistently off ridge NAI 12, and this sighting was lower, closer to the river. I sat down with S2 and we talked through whether that was just noise in the pattern or something worth checking. Given the ISR window was closing, we didn't want to burn the whole asset chasing one sighting, but we also didn't want to write it off, so we split it: kept the reconnaissance-in-force plan moving, but got a partial retasking in on that location before the window shut. It came back inconclusive—some thermal returns but nothing that confirmed intent either way. About six hours later, brigade S3 called and directed us to continue on Axis BLUE per the original order, citing the synchronization requirement. At that point our engineer had flagged a preliminary concern about the bridge's load capacity, no full classification yet. Rather than just noting it and moving on, I put it in writing to brigade and asked for an expedited classification survey to run in parallel with our movement, so we wouldn't have to choose between the timeline and the risk. Brigade agreed to that. Closer to execution, the engineer came back with the actual classification: overweight risk for our heaviest platforms. We had a planning session. One of the company commanders raised a concern about how we were sequencing the heavy vehicles across, and that turned into a real discussion—reroute to the alternate ford, keep the plan as is, or resequence and stagger the loads. We landed on resequencing, and flagged the ford as a documented branch option since it hadn't been reconned in current water conditions. On execution day we still had a bridge complication under one of the heavier platforms, and almost simultaneously took contact from dismounts near the crossing site. We executed the branch plan, secured the site, and finished the crossing over the alternate ford. Interviewer: Let's rebuild that timeline with what you knew at each point, not what you know now. Participant: At H-48 I had the sighting and the pattern, nothing confirmed. After the partial retasking, I had an inconclusive picture—better than nothing, still not definitive. At H-30 I had brigade's directive plus an unconfirmed engineer concern, and by the time we committed we also had brigade's agreement to run the classification in parallel. At H-24 I had a confirmed overweight number and an open discussion about sequencing. At H-hour I had the complication and the contact at the same time. Interviewer: Take me back to the scout sighting. What made you decide to get ISR eyes on it instead of just treating it as expected? Participant: The location didn't fit. Three months of consistent behavior is a strong baseline, but a scout element showing up closer to the crossing than the ridge is a meaningful enough deviation that I didn't want to assume it away. At the same time, one sighting against three months of pattern isn't automatically a new threat either, so full ISR diversion felt like overcorrecting. The partial retasking let us get some confirmation without giving up the window entirely. Interviewer: What would have made you commit the whole ISR effort to it instead of a partial look? Participant: A second independent report—ground or signals—pointing at the same location. One sighting alone, I wasn't going to reallocate the whole asset off brigade's main effort for it. Interviewer: When brigade directed continuation on Axis BLUE, what alternatives did you weigh? Participant: I could've just complied and left the bridge concern where it was, or asked for an outright delay, or done what we did—continue moving while pushing the concern up formally and asking for the survey to run in parallel. A flat delay request wasn't going to land well without more than an informal flag, and just dropping it risked committing heavy vehicles blind. The parallel-track option let us keep the timeline while still getting a real number before we had to cross. Interviewer: Did brigade push back on that at all? Participant: A little—there was some back-and-forth on how fast the survey could realistically run, but they agreed to it once I put it in writing with the engineer's rationale attached. Interviewer: Let's go to the planning session with the classification report. How did that discussion go? Participant: The engineer laid out the overweight risk, and the company commander who'd be sequencing the heavy platforms raised it immediately as a real problem, not just a note-and-move-on item. We went through the reroute option, the ford's unreconned water conditions, and a resequencing option that would stagger loads to stay under the classified threshold. Resequencing won out because it addressed the actual number without adding the ford's unknowns on top of a tight clock. We still wrote the ford up as a formal branch option in case the bridge situation changed. Interviewer: Was there any disagreement about that choice? Participant: Some. A couple of staff members wanted to at least get a quick recon of the ford in daylight before ruling it out as primary. We didn't have time to do that and still make the window, so we tabled it as a branch rather than dropping it outright. Interviewer: Now the crossing itself—what would have changed your decision at the planning session, looking back at what you knew then? Participant: Honestly, more time to actually recon the ford would have mattered. If we'd had it validated as a live option instead of theoretical, the sequencing-versus-reroute conversation might have gone differently. Interviewer: How do you assess the scout sighting now, knowing what happened at the crossing? Participant: It's consistent with the enemy orienting toward the crossing rather than the ridge, but I wouldn't say it made the contact obvious at the time. The partial ISR look didn't confirm intent, and the location alone isn't proof—it's one data point that lines up better in hindsight than it did in isolation. Interviewer: Last one—if the alternate ford had been reconned earlier, do you think the session goes differently? Participant: Probably, yes. With a validated ford sitting next to the bridge option, the reroute becomes a real contender instead of a branch we noted and moved past. As it was, resequencing was the option we could actually execute on time."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

