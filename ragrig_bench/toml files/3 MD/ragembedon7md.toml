# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this is a voluntary cognitive task analysis, not an evaluation of your conduct — I'm interested in how you actually thought through the decisions, not whether they were right. Can you tell me your role on this operation? Participant: Sure. I was the troop commander — overall lead for the assault force, responsible for the go/no-go call, movement decisions, and the breach plan. I had a partnered host-nation commando element attached for this one too. Interviewer: Good. Let's start broad — walk me through the mission from tasking to your final report. Participant: We got tasked against a facilitator, code name Zaytun, believed to be co-located with a weapons cache in a compound out in a valley we'd worked before. We had about six hours from tasking to launch, which is tight but not unusual. SIGINT had a phone associated with his network pinging inside the compound two nights before. We planned a foot infil from an offset LZ, about forty-five minutes in, breach, clear, exploit, exfil by helicopter. We'd hit that valley twice before with good results — both times we got confirmed HVTs with almost no collateral issues, so there was a comfort level with the terrain and the pattern. Interviewer: What information did you have going into the launch decision specifically? Participant: The SIGINT hit, which the analyst flagged as moderate confidence, not high — he was clear about that. We also had a note from our host-nation liaison that the compound was a known family residence, kids present during the day. That came in maybe two hours before the brief. And obviously the track record from the last two ops in that valley. Interviewer: How did you weigh the liaison's report against the SIGINT? Participant: Honestly, it didn't move the needle much for me. The SIGINT was the thing that put the target in that building, and the two prior ops had built a lot of confidence that when we get a hit like that in that valley, it pans out. The family-residence note felt like background texture rather than something that should change the plan — it wasn't tied to a specific threat, more of a general caution. I didn't feel like I needed a specific reason to set it aside, it just didn't carry the same weight as the geolocation. Interviewer: What other options did you consider at that point? Participant: Really it came down to launch or delay twenty-four hours for another collection pass. Delaying risked losing the target if he moved. There was technically a lower-signature surveillance-only option on paper — the host-nation element had eyes-capable personnel and our supporting ISR asset could have sustained a watch, so it wasn't off the table for lack of means. But that's not really how we use this troop — we're not built for that mission set, and when a tasking like this comes in, the room just defaults to figuring out how to assault it, so the surveillance option didn't get serious airtime. Interviewer: Let's move to the infiltration route. What were you working with? Participant: The route crossed a wadi that, for me personally, is loaded — we took a hard contact there about eight months earlier, sharp firefight, guys got hurt. There was a slower alternate route that avoided it. But we'd also had three straight quiet insertions through that general area over the past couple months. Interviewer: How did those two things — the old firefight and the recent quiet crossings — factor into your choice? Participant: Both were in my head, if I'm honest. The firefight sticks with you in a way that current reporting doesn't always match — when I pictured that wadi, I pictured tracer fire, not a calm crossing, even though nothing in the current threat picture pointed to that. At the same time, we'd had three clean runs through there recently, and there's a pull toward thinking the run continues, or conversely that we were 'due.' I went with the wadi route mostly on that combination rather than waiting on updated route-specific intel. Interviewer: Did you request anything to resolve that uncertainty before deciding? Participant: Not specifically for the route. Time was a factor — we were already tight against the assault window. Interviewer: What happened as a result? Participant: We crossed clean, no contact, but we came out about four minutes behind timeline, which compressed everything downstream. Interviewer: Let's go to the breach decision. What were the options there? Participant: Rear wall or front gate. Rear wall we'd rehearsed extensively in training — I could run that sequence in my head start to finish, exactly how the team would flow through. Because I could see every step of it, it felt less likely to go wrong than the front gate, even though I didn't actually have a current read showing the rear wall was any safer than the gate — that was just a feeling from how clearly I could picture it. Front gate was less rehearsed, though our engineer actually assessed it as structurally simpler to get through. The liaison flagged movement near the front gate suggesting people were awake there. Interviewer: What about the rear wall — was there any comparable read on activity? Participant: Team 1, my own guys, called the rear wall clean. The host-nation commandos, separately, reported ambiguous movement near that same wall. Two different reads on the same spot. Interviewer: How did you resolve that conflict? Participant: I went with Team 1's call. That's the read I trusted — they're my organic element, I know how they call things, I know their standards. The commandos' report was vaguer anyway, 'possible movement,' nothing concrete. Between that and being able to see exactly how the rear-wall entry would go from all the rehearsals, the front gate never really competed for my attention. Interviewer: If the commandos' report had carried the same level of specificity as Team 1's — same level of certainty, just from them instead — would you have weighted it the same way? Participant: Probably not, if I'm being straight about it. Even if it came in just as clean and specific, I think I'd still lean toward Team 1's version first, just because it's our own call. It's not that I'd ignore the commandos, but there's a trust that builds with your own guys that I don't have with an attached element yet, regardless of how the report reads. Interviewer: What happened at the breach? Participant: We went in the rear wall. Found a non-combatant right near the breach point, had to pause the whole assault element to sort that out. Wasn't dangerous, but it cost us time we didn't have a lot of. Interviewer: Last decision point — the extraction. What was the situation? Participant: One of my guys took a leg injury during that pause. Medic called it stable but said we needed to get him out within the window. Primary LZ was a twenty-minute movement through ground where our ISR coverage had gaps — the UAS had been intermittent all night because of weather. The casevac bird had a narrow fuel window. Interviewer: What made you choose the primary LZ over the alternatives? Participant: We'd used that exact exfil sequence successfully the last two times we'd operated in that valley — same LZ, same general flow. It had worked clean both times, so I had a lot of confidence going into it. There was a closer casevac point off the approved list, and we could've held for a dedicated casevac asset instead of the standard bird, but both of those added complexity or delay I didn't think we needed given how smoothly things had gone before. Interviewer: Did the casualty or the ISR gaps change your risk calculus at all? Participant: Not as much as maybe they should have, looking back. I was leaning heavily on 'this has worked twice,' and I don't think I fully re-weighted for the fact that this time we had a man down and less coverage than we'd had before. Interviewer: What actually happened? Participant: We made it to the primary LZ without incident, but we landed right at the edge of the bird's fuel window, so the load was rushed. It worked out, but it was tighter than it needed to be. Interviewer: If the family-residence report had come in with a specific time window and independent corroboration instead of a general caveat, would that have changed your launch decision? Participant: Probably, yeah. If it had pinned down that people would definitely be inside during the assault window, and it wasn't just a single uncorroborated note, I think that gets weighed a lot more seriously against the SIGINT. It was the vagueness and lack of a second source that let me set it aside as easily as I did. Interviewer: If you hadn't had that earlier firefight in the wadi, do you think you'd have picked the same route? Participant: Maybe. Without that memory pulling at me, I might have given the alternate route a fairer look on its own merits instead of it competing against a gut feeling either way. Interviewer: Looking back, what would you tell a junior team leader about reading a sequence like this — quiet, then contested, then quiet again? Participant: I'd say don't let a streak, in either direction, do your thinking for you, and don't assume today's team call is more solid than someone else's just because it's your own guys. Weigh the actual report, not who it came from."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

