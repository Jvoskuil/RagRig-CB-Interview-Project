# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for sitting down with me. This is just a debrief for training purposes — we're looking at how you worked through the call, not grading the outcome. Okay to go ahead? Participant: Yeah, that's fine. Interviewer: Can you tell me your role and set the scene for that evening? Participant: I'm a signal maintainer covering the territory that includes the Marlow interlocking, out on the secondary main line. I got paged out in the evening after a track crew reported the signal dropping to a more restrictive aspect twice during their shift, then clearing back to normal on its own both times. It had rained earlier that day, so everything out there was still damp. My job was to figure out what was going on and get the signal back to reliable automatic operation before the next scheduled train movement, without stringing the possession out longer than it needed to be. Interviewer: Walk me through what you found and what you did first. Participant: When I got to the cabinet, there was no fault code logged at the interlocking — nothing tripped that would point me straight at a component. No history of this signal giving trouble before, either, so it wasn't a repeat offender. I did a visual first: no obvious damage, no standing water in the case, gasket looked a little worn but nothing dramatic. At that point I had two ways I could go. I could sit and watch the signal through another cycle or two to see if the drop repeated in a way I could actually observe, or I could go straight into bench testing the track circuit and relay to start ruling things in or out. Interviewer: Which way did you go? Participant: I went straight into testing. Waiting around for it to happen again felt like it could burn time I didn't have if the next train was going to need a clear signal, and testing gets me actual numbers instead of just watching and hoping it repeats on a schedule that suits me. Interviewer: How confident were you that testing first was the better call? Participant: Fairly confident, but I'll be honest, it wasn't a slam dunk either way. Watching it might've told me more about the actual pattern — whether it was tied to a specific type of train movement, say. But testing gets me hard numbers right away, and with the clock running, I leaned that way. Interviewer: What did the testing show? Participant: That's where it got murkier. I ran three insulation resistance cycles. Two came back within normal tolerance, one came back marginally low — not a fail, just lower than I'd like to see. No single component gave me a clean, readable fault. So now I've got a relay and wiring that's original to a fifteen-year-old installation, and one reading out of three that's a little off. Interviewer: What were you weighing at that point? Participant: Whether to just replace the relay and that wiring segment right there, using the marginal reading as my justification, or hold off and run more cycles to see if a real pattern showed up before committing to a replacement. Interviewer: What did you decide? Participant: I ran more cycles instead of replacing on the spot. One marginal reading against two normal ones didn't feel like enough to hang a full replacement on — it could've been the wiring starting to go, or it could've been a temporary moisture effect given the damp conditions. I gave it a fourth cycle after some extra drying time, and that one came back normal. Interviewer: Did that resolve it for you? Participant: Not entirely. It made the moisture explanation more plausible, but it didn't rule out the wiring either — a marginal insulation reading can come and go for more than one reason, so I still didn't have a clean answer. Interviewer: That brings us to the next call — what were the options once you had that pattern of readings? Participant: The gasket on the cabinet was showing some wear, and the marginal reading lined up with timing not long after that earlier rain. So I had a lower-cost option: dry everything out, clean the connections, reseal the case, and monitor. Or I could go straight to a full replacement of the wiring segment, which would take a lot longer and eat into overtime I'd need approval to extend. Interviewer: What tipped it for you? Participant: The timing with the rain was a real data point, not just a guess — it's a known failure mode on older cabinets with worn gaskets. That gave me a specific, testable explanation I hadn't ruled out yet, so trying the cheaper fix first and watching the results made sense to me before committing the extra hours to a full swap. Interviewer: How did that play out? Participant: Readings stayed stable through two more monitored cycles after the drying and resealing. Which was encouraging, but two clean cycles after a marginal one doesn't fully prove the wiring's fine — it's consistent with the fix working, and it's also consistent with the marginal reading just being a one-off that would've cleared up on its own. Interviewer: Last decision — putting the signal back in service. Participant: Right, by that point I had two stable cycles, the next scheduled movement was coming up, and I still didn't have a confirmed root cause — could've been the moisture issue resolved, could've been a quiet wiring problem that just hadn't shown itself again yet. My options were to restore automatic service on the strength of those two stable readings, or keep it under manual block protection for the rest of the shift and take another look in daylight. Interviewer: What did you go with, and why? Participant: I restored it to automatic service. Two consecutive normal readings after the interim fix was enough for me to move forward, and keeping manual protection running all night has its own cost — it ties up a dispatcher's attention and slows things down for every movement through there. But I did flag it for a follow-up inspection rather than calling it closed, because I knew I hadn't actually nailed down which explanation was right. Interviewer: Did it hold up? Participant: Yeah, ran clean through the rest of the shift. But I want to be clear, that doesn't tell me for certain I got the diagnosis right — it just means nothing happened on my watch that night. Interviewer: If that fourth test cycle had come back marginal again instead of normal, would you have done something different? Participant: Almost certainly, yeah. Two marginal readings out of four would've pushed me toward the full replacement instead of the interim fix — that's a different pattern than what I actually saw. Interviewer: And if you'd had open-ended overtime approval that night? Participant: Honestly, I might have leaned toward the full wiring replacement regardless, just to close the loop completely instead of leaving it on an interim fix. The time and approval limits were part of what made the cheaper option attractive. Interviewer: Looking back, is there anything you'd want more information on, even now? Participant: I'd still like a cleaner way to separate a moisture-related reading from an early-stage wiring issue on that generation of cabinet. Right now both look the same on my meter, and that's the part of this call I'm least settled on."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

