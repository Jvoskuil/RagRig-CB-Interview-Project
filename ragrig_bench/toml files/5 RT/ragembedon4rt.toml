# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this conversation is being recorded for internal process review, and there's no evaluation of your performance attached to it — I'm strictly interested in how you thought through the situation. Sound okay? Participant: Yeah, that's fine. I figured this was coming after the milepost 214 write-up. Interviewer: Right. Can you start by telling me your role and roughly how long you've been in it? Participant: I'm the Division Superintendent for the subdivision, been in this seat about six years, twenty years total with the railroad, most of it on this same territory as a trainmaster and roadmaster before I moved up. Interviewer: Good. So walk me through what first came to your attention that morning regarding milepost 214. Participant: I got a call from our track inspector around 7 a.m. He'd run the ultrasonic test on the curve as part of the regular cycle, and it came back showing an internal transverse defect at 4 millimeters. That segment had a flaw logged three weeks earlier at 2 millimeters, so it had grown. He flagged it to me directly instead of just filing it because he wanted me aware before the day got going. Interviewer: What was your objective once that report came in? Participant: Keep the railroad safe, obviously, but also keep things moving. We had Q-119, one of our priority intermodal trains, scheduled through that same territory later that day, and there's a contractual on-time window — if we blow past two hours late, we eat a penalty. So I'm balancing the defect against keeping that train on schedule, and we've also got a cold snap coming that night, temperatures dropping about 25 degrees, which matters for rail integrity in continuous welded rail. Interviewer: What happened right after the ultrasonic results came in? Participant: I pulled the defect log for that curve. It's had small flaws before — bolted rail sections nearby had similar-sized readings that just sat there and never went anywhere. My first read was, this looks like the kind of thing we've seen. I told the inspector I wanted to keep it classified as monitor status, retest in two weeks, standard for a flaw in that size range. Interviewer: Did the inspector push back on that? Participant: He mentioned the growth was faster than what we'd typically seen — doubling in three weeks is quicker than the other cases in the log, which had been pretty flat over a couple months. I heard him on that, but doubling from 2 to 4 millimeters is still a small number in absolute terms. It didn't strike me as enough to change the call. We'd retest in two weeks like normal. Interviewer: What information did you have in front of you at the moment you made that classification? Participant: The two readings, the growth comparison the inspector gave me verbally, the historical log showing similar flaws stabilizing, and the fact the segment's rated for 60 miles an hour under our current track class. Nothing in front of me suggested immediate failure, just a number that had gone up. Interviewer: How certain were you about the growth rate at that point? Participant: Fairly certain — the inspector's numbers are reliable. I just didn't weigh the rate itself as the deciding factor. I was weighing it against 'we've handled dozens of these,' and none of them ever became anything. Interviewer: Let's move to later that morning. What led into the next decision? Participant: The inspector called back to make sure I'd registered that this stretch is continuous welded rail, laid about five years ago — different from most of the bolted-rail spots where we'd seen flaws stabilize before. He also mentioned tonnage on that curve is up about 15 percent year over year. I heard both points. Interviewer: What made you confident this flaw would behave like the earlier ones? Participant: I've personally been through this scenario more times than I can count. I can think of three specific cases off the top of my head — one back around 2019, another maybe two years ago — where we had a flaw that size, kept it under monitor status, and it never amounted to anything. That's twenty years of pattern on this same stretch. When you've watched the same thing play out that many times, you trust what you've seen. Interviewer: Did the CWR construction or the tonnage increase change your thinking? Participant: I registered it, but those three cases felt close enough to this one that it didn't move me off keeping the curve at track speed. We held off on any interim slow order and left it at the two-week retest. Interviewer: What alternatives did you consider? Participant: Putting in an interim slow order just through that curve, or restricting it only for certain train types until the retest. I thought about the interim order, but given how those other cases went, it felt like overkill for what looked like the same pattern I already knew. Interviewer: Let's go to the afternoon, the call about Q-119. What led up to that? Participant: As we got closer to Q-119's window, the chief dispatcher, the trainmaster, and the road foreman got on a short call with me to decide whether to run it through at track speed, put a temporary slow order on it, or reroute it around the adjoining subdivision. Customer service had already flagged that a reroute or hold risked blowing our two-hour window with the customer. Interviewer: What was everyone's position going into that call? Participant: The trainmaster had texted beforehand saying it was probably fine but he was a little nervous. The road foreman said he was leaning toward running it but wouldn't mind a slow order. So people had some reservations, nothing dramatic. Interviewer: How did the group's view change over the course of the call? Participant: It moved pretty quickly. Once we started talking, everybody's confidence built on everybody else's. By the end we'd landed on releasing Q-119 at full track speed, no slow order at all — more decisive than where any of us individually started. The whole call took maybe six minutes. Nobody raised an objection at the end. Interviewer: Does that six-minute timeframe feel fast for that kind of call, looking back? Participant: In the moment it felt efficient. We all had the same information, everyone seemed to be arriving at the same place, so there wasn't a sense we needed to slow down and hash it out further. Interviewer: After Q-119 went through, what happened? Participant: A following local crew radioed in they'd noticed an unusual sound at the wheel-rail interface passing that same stretch — no visible damage, nothing measurable, just an odd noise. That prompted us to get a debrief together before shift change. Interviewer: Who was in that debrief? Participant: Myself, the trainmaster, and the chief dispatcher. Our assistant engineer from track engineering asked to sit in — he wanted to raise concerns about how we'd classified the defect and handled the speed decision — but the meeting was scheduled tight, fifteen minutes before shift change, and he wasn't looped in beforehand, so he ended up not joining. Between the three of us, we also figured he'd come in and push on the CWR classification again like he had before, and nobody was especially eager to reopen that discussion this late in the shift. Interviewer: What was discussed, or not discussed, in that debrief? Participant: We went through the wheel-rail sound, agreed pretty quickly it was unrelated to the flaw — probably debris or a joint bar, nothing tied to milepost 214 specifically. We didn't get into re-examining the retest interval or walking back through the earlier classification call. It felt like we'd already covered that ground, so there wasn't much appetite to go back over it again. Interviewer: Was there any dissent in the room? Participant: No, everybody agreed it was a non-event. The minutes just note we concluded the process worked as intended. Interviewer: What alternatives did you weigh in that closing meeting? Participant: We could have pulled the assistant engineer in after the fact, or kicked it up to the chief engineer for an independent look at the classification. Given how it played out with the sound being unrelated, it didn't feel necessary to extend the meeting further. Interviewer: How much time pressure did you feel across these four moments — the morning classification, the track-speed call, the release decision, and the debrief? Participant: The debrief and the release call were the tightest, shift change and the two-hour window respectively. The morning classification had the least pressure — that was just me and the inspector working through the numbers. Interviewer: If the retest interval had been one week instead of two, would anything about your classification have changed? Participant: Possibly. A tighter retest window would have given us another data point sooner, which might have shifted how I read the growth rate. As it stood, two weeks felt like standard practice. Interviewer: If the assistant engineer had been on the original conference call about Q-119, do you think the release decision would have gone differently? Participant: Hard to say for certain. He tends to be more conservative about CWR segments specifically, so it's possible his voice in that room would have slowed us down or gotten someone to push back on going full speed. Interviewer: Looking back, is there a point where you'd have wanted a dissenting voice to speak up more forcefully? Participant: Probably the debrief. He was asking to be included for a reason, and we didn't make room for that given the schedule. Might've been worth five more minutes. Interviewer: Last one — if this same flaw had shown up on a curve you hadn't worked before, do you think your approach would have been different? Participant: Yeah, honestly, probably. On unfamiliar territory I'd likely lean more on the inspector's read of the growth rate itself rather than my own sense of how these things usually go, since I wouldn't have twenty years of watching that particular stretch to fall back on. Interviewer: That's helpful, thank you. I appreciate you walking through it in this much detail. Participant: No problem. It's useful to talk it through, honestly — you don't always get the chance to go back over the reasoning like this."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

