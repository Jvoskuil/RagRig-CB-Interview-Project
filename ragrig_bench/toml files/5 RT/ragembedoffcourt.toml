# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time. Before we start, I want to confirm you're okay with me recording this for internal process-improvement purposes, and that we can talk candidly about a project that didn't go entirely to plan. Participant: Sure, no problem. It's a good one to talk through. Interviewer: Can you describe your role and what the project was meant to accomplish? Participant: I'm the capital projects manager for a corridor interlocking replacement — swapping out an aging interlocking and signal system on one of our busiest commuter segments, integrating it with our PTC interface. Federal grant money covered a good chunk of it, so we had a fixed obligation deadline. Miss it, and part of that funding is at risk. Interviewer: What made this project different from others you'd run? Participant: Live revenue service running through the work zone, so limited possession windows at night and weekends. A fixed-price design-build contract, which makes change orders painful. And that federal clock running the whole time. Interviewer: Walk me through what happened, start to finish. Participant: We set a baseline schedule and budget up front. During early design we had a utility-survey question — the corridor's underground records were old — and we decided to commission an updated survey before locking the schedule. That survey came back mostly clean, but it flagged one segment where the position data had a stated tolerance, meaning the utility was there but not pinned down precisely. We handled that finding a certain way. Mid-construction, crews still hit a conduit conflict in that exact segment, and we had a shorter safety stand-down than you'd get from a totally unknown strike, but a stand-down all the same. Contractor followed with a risk report on the cost and schedule impact. Then near the end we had to decide how to run systems integration testing against the deadline. We got through commissioning, the system passed, and we hit the funding deadline, but it was tight. Interviewer: Let's start with the baseline schedule. What information did you have? Participant: The contractor's proposal assumed efficient crew productivity — their best-case numbers. We also had data from peer agencies that had done similar interlocking swaps, running 28 to 34 months typically. Leadership wanted visible progress against the grant, so there was pressure to commit to something aggressive. Interviewer: How did you weigh those two data points? Participant: I leaned harder on the contractor's numbers. The peer projects weren't identical — different vendors, different corridor layouts — so the comparison felt soft. We went with 24 months. Interviewer: Once the survey added three weeks up front, how did that affect the schedule? Participant: We didn't push the overall target out. We absorbed those three weeks by tightening later construction phases so the external date stayed at 24 months. Interviewer: Let's go to the survey itself. What did the results tell you, and what did you do with them? Participant: Utility maps had been over five years old, so we commissioned the updated survey — about $150,000 and three weeks. It came back solid overall, but one segment near the bore path came with a stated tolerance, something like two feet of uncertainty on exact position, because the underlying municipal records for that block were poor to begin with. Interviewer: What were your options once you saw that tolerance note? Participant: We could fund extra contingency time and budget specifically for that segment, or rely on our normal process — weekly risk reviews plus the field crew's verification work during excavation — to handle it as it came up. Interviewer: Which way did you go, and why? Participant: We didn't add contingency. Field crews verify positions as a matter of course before they dig in any segment, so it felt like that tolerance note was already covered by standard practice. I knew that verification would really only confirm the actual position once we were mobilized inside that possession window — so if something was off, we'd find out on the clock, not ahead of it — but that still felt like enough to keep the segment on plan. Two feet isn't a huge miss, and I didn't see it as something that needed separate budget. Interviewer: What happened once construction reached that segment? Participant: Crews still caught a conduit edge that was outside where the drawing showed it, inside that same flagged area. Shorter stand-down than a full unknown-utility strike would cause — a few days, not weeks — but it did stop work on that segment. Interviewer: Looking back on that now, how foreseeable does it feel? Participant: Honestly, the survey told us that segment was uncertain. So in hindsight, of course something was going to be slightly off there — it's almost obvious once you say it that way. Interviewer: At the time, though, how was that segment actually rated? Participant: Our risk register logged it as low residual risk once the survey came back. We treated the tolerance note as basically resolved by process, not as an open risk. Interviewer: Let's move to the contractor's risk report. What did that process look like? Participant: It came in projecting around a 6 percent cost overrun and about four weeks of schedule impact from the segment conflict. Those numbers weren't something I wanted to sit with heading into board season, honestly — reviewing and pushing that forward before the next monitoring cycle gave us anything better felt premature. I had five business days to sign off, and that same week I was buried in quarterly board prep. Interviewer: How did you handle the review given that? Participant: I read the executive summary, delegated the detailed analysis to one of my leads without asking for a real readout on what it actually showed, and told the team to keep monitoring. I didn't escalate to the grant administrator during that window. Interviewer: Did the picture change in the following weeks? Participant: It crept up a bit before we brought it into focus and eventually asked the grant side for a smaller schedule accommodation than we would have needed with a full unmapped strike. Interviewer: Now the testing decision near the end. What was the situation? Participant: Six weeks left before the grant deadline. Standard systems integration testing runs eight weeks. Our engineering lead wanted the full eight, no shortcuts. Grants officer was clear that missing the milestone risked about $4 million of funding we already had secured. Interviewer: What alternatives did you weigh? Participant: Request a formal extension and keep the full eight weeks, or compress to five weeks, trimming some redundant verification cycles, to hit the date. Interviewer: How did you land on compressing it? Participant: We couldn't afford to lose $4 million that was already ours. That was the deciding factor, even though the engineering lead's case for the full protocol was solid. Interviewer: If that $4 million had instead been potential new funding you could gain by finishing on time, rather than money you already had, would the call have gone differently? Participant: Probably, yeah. If it were more like a bonus on the table instead of something already secured, I think we hold the full eight weeks. Losing money we already had in hand felt different from missing out on the same amount. Interviewer: How did testing play out? Participant: Finished in the compressed window, system passed, we hit the deadline and kept the funding. Whether the trimmed verification cycles matter down the line, I honestly don't know yet. Interviewer: What additional information about that tolerance zone would have changed your decision not to add contingency? Participant: If the survey firm had given us a tighter confidence range, or flagged that segment as a priority-verify area rather than routine, I think we'd have budgeted differently. Interviewer: Looking back, was the conflict something the team could have anticipated? Participant: The information was there. We just read the tolerance note as already handled rather than as a live risk. Interviewer: What would you tell a peer facing a similar project? Participant: Get your survey done early, but don't stop there — treat any flagged uncertainty as an open item with its own budget line, not something your normal process automatically covers. And build real slack against the funding clock before you're forced into testing-scope decisions at the end."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

