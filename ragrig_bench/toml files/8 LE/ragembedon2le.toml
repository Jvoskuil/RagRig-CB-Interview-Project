# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, I just want to confirm—this is a routine case-review interview, we're reconstructing your reasoning on a specific case, and it's fine to speak candidly since this isn't a disciplinary review. Sound good? Participant: Sure, that's fine. I've done these debriefs before. Interviewer: Great. Can you tell me a bit about your role and how this case landed on your desk? Participant: I'm a latent print examiner, been doing casework about nine years. This one came through as a burglary submission—pry bar recovered from a residential break-in, latent lifted off the metal surface, plus a known print card for a suspect already booked. Standard comparison request, but they wanted it fast, ahead of a bail hearing. Interviewer: Walk me through how the case actually came in—what did you know before you looked at the print itself? Participant: The detective dropped the evidence off personally, which doesn't always happen. He mentioned, kind of in passing, that the suspect had already confessed and had two prior burglary convictions. I remember thinking, okay, that's helpful context, but my job is still to look at the ridges. I logged it in, noted his comments in the file, and got started. We don't have a strict blind-review setup here—some labs do, we don't—so it's normal for that kind of information to come with the evidence. Interviewer: Did you consider handling the intake differently, given what he told you? Participant: I thought about it for a second. I could've asked someone else to look at it fresh, or flagged it to my supervisor since he'd shared outcome information. But honestly, with the turnaround we had, that would've meant a delay we didn't have room for, and it's not like the confession changes what's on the pry bar. I proceeded normally. Interviewer: Let's reconstruct the timeline. What was the physical state of the latent when you got into the analysis? Participant: Partial print, fair amount of smudging, and there was a distorted region around the periphery—looked like it picked up texture from the tool grip itself, which throws off the ridge flow. The core area, though, was clean. Ten minutiae in that clear zone, no question about it. Interviewer: And after you drafted your preliminary read? Participant: I wrote it up, sent it to verification. Then the verifying examiner came back with a flag on that same peripheral area—didn't see it the way I did. That's when I had to reconcile things before the report went out. Interviewer: Let's slow down on the comparison itself. When you got to that distorted peripheral region, what were you actually looking at, and how did you land on your read? Participant: The ten minutiae in the clear zone were enough on their own, honestly—textbook sufficiency. The peripheral area was rougher, ridge flow was broken up by the distortion. I went back and forth on it. But when I lined it up against the known card, the flow direction seemed to pick back up in a way that fit the suspect's print. I remember thinking, given everything else pointing his way—he'd already admitted to it—this piece just confirmed what was already lining up. So I folded it into the individualization call as consistent rather than calling it indeterminate. Interviewer: What alternatives were on the table at that point? Participant: I could've treated that region as indeterminate and rested the conclusion purely on the ten clear minutiae—which honestly would've been sufficient by itself. Or I could've called for better imaging before committing either way. Those were both live options. Interviewer: What would you say tipped you toward reading it as consistent rather than going with one of those? Participant: The pattern looked plausible to me. I won't pretend the case context wasn't in my head at that point—it's hard to fully compartmentalize once you've heard something like that. But I also want to be clear, the ridge flow genuinely looked continuous to me in that section. Interviewer: Moving to the verification step—what did you send over, and did you weigh other options? Participant: I sent the full worksheet with my conclusion attached, along with the images. I could've sent just the images without my determination, let the verifier come in blind. We only had one other qualified examiner available that day, and with the clock running on the bail hearing, I went with the standard route—full packet, conclusion included. Interviewer: Any hesitation there? Participant: A little. Blind verification is theoretically cleaner, I know that. But it's not our default practice, and slowing things down to arrange it felt like more friction than the situation called for. Interviewer: Let's talk about the discrepancy. The verifying examiner flagged that same peripheral region differently than you did. What went through your mind? Participant: My first reaction was, okay, this is the distorted area, that's exactly the kind of spot where two examiners can read things differently. The ten core minutiae weren't in dispute—she agreed on those. So I looked at the discrepancy again and thought about what could explain it without it actually being a mismatch. Tool-surface texture causing pressure variance in that specific region made sense to me, and it's a documented thing that happens with textured surfaces like pry bars. I wrote that into the file as the explanation and kept the individualization conclusion standing. Interviewer: Did you consider downgrading the conclusion instead? Participant: I thought about calling it inconclusive until we could get a better lift or additional processing. That was on the table. But the ten minutiae were solid regardless, the deadline was same-day, and the distortion explanation accounted for what she was seeing without requiring me to throw out the whole determination. Interviewer: What else, besides distortion, could have explained what she saw? Participant: Could've genuinely been a non-matching area—maybe that region just doesn't belong to the same source. I didn't rule that out entirely, but it felt less likely to me once I had the distortion explanation in hand. Interviewer: How confident were you in that peripheral read, if you had to put a number on it? Participant: Maybe a six or seven out of ten on its own. But paired with the ten minutiae, I felt solid on the overall call. Interviewer: Has this kind of distortion situation come up before in your casework? Participant: Yeah, textured tool surfaces are a known headache. Usually if the core detail's strong, we don't let a rough edge area derail things. Interviewer: Last few questions. If the detective had never mentioned the confession or the priors, do you think your read of that ambiguous region would've gone differently? Participant: Possibly. I'd like to think I'd have called it the same way, but I can't say for certain the extra confidence wasn't doing some work there. Interviewer: If the verifier's discrepancy had come up before you drafted your conclusion instead of after, would things have gone differently? Participant: Maybe. Seeing it flagged first might've made me treat that region as indeterminate from the start rather than reconciling it after the fact. Interviewer: What would you change if you had this case again with no deadline? Participant: I'd probably request a fresh lift or enhanced imaging on that peripheral area before committing to anything, and maybe ask for a blind second look. Not because I think the outcome was wrong, but because that region deserved more room than we gave it that day. Interviewer: Appreciate the candor. That's everything I need."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

