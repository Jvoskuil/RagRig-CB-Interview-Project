# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time. Just to confirm, this conversation is voluntary and for internal review of decision-making, not a formal chart audit. Okay to proceed? Participant: Yeah, that's fine. Interviewer: Can you set the scene—what was going on in the department that evening? Participant: It was a Thursday night, pretty rough. We had four boarders in hallway beds waiting on inpatient rooms, so our effective capacity was well below normal. I was covering two other acute patients—a possible stroke and a kid with a fracture—when this chest pain patient came in. My second-year resident saw him first and then brought me in. Interviewer: What was your first impression once you got involved? Participant: 52-year-old man, generally healthy, pleuritic chest pain that was worse with deep breaths. Vitals were reassuring, sat 97%, heart rate 88. On exam I found reproducible tenderness over the chest wall, which does suggest something musculoskeletal, and he told me he'd been moving furniture two days earlier. That's a coherent story by itself. But he also mentioned, almost in passing, a 10-hour flight home from a trip about a week before, and a mild calf ache nobody had actually examined yet. Interviewer: How did you weigh those pieces against each other? Participant: The chest wall tenderness was a legitimate finding, so I wasn't going to dismiss it, but the flight and the calf comment gave me pause. Immobility plus a leg symptom is exactly the combination you don't want to explain away just because there's a tidier story sitting right in front of you. So I told the resident we'd hold off on a final impression until we actually looked at the leg directly. Interviewer: What happened after that? Participant: About twenty minutes later, the nurse rechecked him and confirmed mild swelling in the left calf, matching what he'd described. Around the same time, the resident came back with the D-dimer result—it had already been sent per our chest pain protocol—and it was mildly elevated, just above the assay cutoff. Interviewer: Walk me through your thinking once you had that result. Participant: A borderline D-dimer doesn't mean much on its own; it depends on the pretest probability going in. With the calf swelling now confirmed, I sat with the resident and we recalculated the Wells score properly, incorporating the leg finding this time rather than just the original picture. That pushed him into a range where imaging felt genuinely warranted, not just a reaction to one number. Interviewer: How much did the scanner queue or bed pressure factor into that? Participant: It was there in the background—40-minute queue behind trauma, charge nurse pushing to free up beds—but I didn't let that skip the reassessment step. I wanted the score redone first. Once that supported imaging, the practical pressure just meant asking radiology to prioritize him within their existing queue. Interviewer: Tell me about the conversation regarding Dr. B's earlier patient. Participant: While we were waiting on the CTPA, the charge nurse mentioned Dr. B had a similar-looking patient the week before—same kind of pleuritic pain—and discharged him without imaging. She said the patient did fine afterward. Interviewer: What was your reaction to hearing that? Participant: Honestly, my first thought was that I didn't know enough to judge it either way. Did he do a formal Wells score? Was it PERC-negative? A good outcome doesn't tell you whether the underlying reasoning was sound—some borderline calls work out fine by chance. I asked the resident to pull the chart before forming any real opinion. Interviewer: What did you find? Participant: Dr. B had documented a formal low-risk Wells score and a negative PERC before discharging that patient. So there was actual structure behind the decision, not just a guess that happened to land well. Interviewer: Did that change your view? Participant: It confirmed what I suspected—that it was a reasonable, defensible call given what he knew. If it had gone badly instead, with the same documented workup, I'd still call it reasonable. The outcome doesn't really tell you much about the quality of the reasoning behind it. Interviewer: Let's get to the end of your shift. What was the situation with your patient by then? Participant: PE was ruled out on the CTPA, though it picked up a small lung nodule needing outpatient follow-up, and he'd had a mild contrast reaction that took about 45 minutes to settle. By the time all that resolved, he was stable, but the visit had gotten more complicated than expected. The hospitalist I called wasn't eager to admit someone with a negative PE workup, and the patient and his wife were anxious to leave. Handoff was closing in. Interviewer: How did you decide between admitting and discharging? Participant: I genuinely went back and forth. Part of the pull toward admission was that the visit had been eventful—the reaction, the nodule—but eventful isn't the same as unsafe. Clinically, admission wouldn't have changed anything overnight; the nodule needed outpatient pulmonology, not inpatient care. I discharged him with a follow-up scheduled within the week and clear return precautions, but I told the resident honestly it could have gone either way. Interviewer: What tipped it toward discharge in the end? Participant: Mostly that nothing about his overnight risk profile had changed, and we had a real follow-up plan arranged quickly. The boarding pressure was present in the background, but I don't think it drove the decision. If anything, I spent more time on that disposition than I'd have liked given how busy we were. Interviewer: What information, if it had been available earlier, would have changed how you handled the D-dimer result? Participant: If the calf swelling had been documented at triage instead of found later, I probably would have gone straight to a formal risk score without the intermediate step of waiting on the nurse's recheck. It would have saved some time, though I don't think it would have changed the ultimate decision to image him. Interviewer: If the department had been quiet that night, would you have handled things differently? Participant: Not fundamentally—I still would have wanted the leg exam and the recalculated score before deciding on imaging. Busy or not, that step felt necessary once the calf came into the picture. Interviewer: And if you'd learned about Dr. B's Wells score at the same time as the outcome, rather than afterward, would your reaction have been different? Participant: No, I think I'd have asked the same question regardless of order—what did he actually know when he made the call. The outcome was almost beside the point for me. Interviewer: Looking back, is there a moment you'd have handled differently? Participant: Maybe I could have pushed radiology harder given how backed up we were. But on the clinical reasoning itself, I wouldn't change much. The disposition at the end is probably where I sat longest and still feel least certain—it was a genuinely close call, not an obvious one."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

