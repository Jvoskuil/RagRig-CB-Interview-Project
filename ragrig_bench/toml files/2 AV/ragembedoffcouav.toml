# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just so you know, I'll ask you to walk through a specific turnaround and explain your thinking as it unfolded, not just what ended up happening. Can you tell me your role and a bit about your background? Participant: Sure. I've been a load controller about nine years, mostly narrow-body combi work. Normally I build the load sheet, issue the loading instruction to the ramp, check weight and balance against structural limits, and finalize the NOTOC for the captain. This one wasn't a normal turn, though—the inbound aircraft came in late, so instead of our usual 45 minutes on the ground, we were looking at more like 30 before the slot. Interviewer: How did that change things going in? Participant: Right away I knew I'd be compressing steps I'd normally spread out a bit more. Nothing about the flight itself was unusual—same route, same aircraft type—it was just less time to work with. Interviewer: Walk me through what happened. Participant: I got the cargo manifest with about 30 minutes left. Mixed load—regular bags, some mail, and one item that stood out: a piece of machinery, irregular shape, heavier than what typically goes through, not palletized. Our load-control software generates an automatic load instruction, and it put that machinery item into hold 3. That system's been reliable for this fleet for as long as I've used it, and with the clock already working against us, I issued the ALI to the ramp basically as generated so they could start loading immediately. About fifteen minutes later, the ramp called and said the aircraft was sitting slightly tail-heavy—not out of limits, just aft of where you'd expect. Interviewer: What did you do with that? Participant: Logged it and kept going, because right then an LMC came in—about 380 kilos of mail plus six late bags that missed the original manifest. That mail got assigned to hold 5, our aft bulk hold. With the time we had left, I looked at the total weight, saw it was in line with the LMCs we'd been getting all week on this route—three similar ones, same range, none of those needed redistribution—and cleared it on that basis so I could move to the trim sheet. Interviewer: And the trim sheet itself? Participant: I pulled the dispatch log for a quick check, given the tail-heavy call from the ramp. Saw the previous two flights on this same rotation—different tails, one to a different destination—had both needed aft trim corrections. With barely any time left before I had to finalize, that plus the ramp's report was enough for me to treat the rotation as running tail-heavy that day, so I shifted some cargo forward beyond what my own index actually required. Interviewer: Let's go through each of those moments in more detail. Starting with the ALI and the machinery item—what specifically told you it was fine to run with as generated? Participant: Mostly the system's history—it's been solid on this fleet for months. I did notice the item was irregular, not on a pallet, heavier than usual. That registered. But with only 30 minutes and the ramp already waiting, stopping to hand-verify felt like it would eat time I didn't have, so I went with what the system gave me. Interviewer: Was there a manual chart you could have checked against for that kind of cargo? Participant: There is, for exactly that situation. I know where it is. I just didn't reach for it that day. Interviewer: What would have made you stop and pull it? Participant: If we'd had the full 45, probably. Or if the system itself had thrown some kind of flag saying this needs manual sign-off. Neither of those happened, so I treated it like any other ALI. Interviewer: On the LMC—what exactly did you compare when the mail and bags came in? Participant: Total weight against what we'd seen from this week's other LMCs. That was the number I had on hand and could check fastest. Interviewer: Did you look at where hold 5 sits relative to where those earlier LMCs went? Participant: No, not specifically. The earlier ones went forward, into hold 2 I believe. This one went aft, into 5. I didn't run the index shift for that particular placement—the weight matched what I'd seen before, and with the time squeeze, that's what I used to clear it. Interviewer: What would it have taken to run that calculation directly? Participant: A few extra minutes at the trim computer. It wasn't unavailable to me. I just didn't think it was worth the time against the schedule we were on. Interviewer: On the trim sheet redistribution—how did you connect the two previous flights to this one? Participant: They were on the same rotation, back to back, and both needed aft correction. Two in a row felt like it meant something about how the rotation was running that day, so I built in a forward shift before signing off, and honestly, with the time we had left, I didn't feel like there was room to dig into it further. Interviewer: What did your own calculated index for this flight show on its own? Participant: It was fine—within the normal forward range with margin. The redistribution wasn't because my numbers were bad. It was more that seeing two prior aft trims made me not fully trust it, and I didn't have the minutes to sit with that discomfort. Interviewer: Did you find out afterward why those two flights ran tail-heavy? Participant: Yeah—one was a fuel imbalance, the other had extra catering loaded late. Different tails, unrelated causes. Nothing tying them to each other or to this flight. Interviewer: Last one—the final sign-off. What was the situation? Participant: Closeout figures looked clean, within limits. But the ramp tally was one bag short of the NOTOC and manifest. Small discrepancy, and the slot was closing faster than a normal turn would allow. Interviewer: What did you decide, and what were you weighing? Participant: I signed and released with the figures as they stood. I weighed the delay risk against a one-bag discrepancy that's usually just a miscount, not a safety concern by itself. It turned out to be a manifest correction afterward—the weight and balance conclusion didn't change. I can see someone holding a couple minutes to chase it down instead. Neither call feels obviously wrong to me. Interviewer: How confident were you in each of these at the time, versus now? Participant: The ALI and the LMC, fairly confident in the moment, more than I'd be now looking back. The trim redistribution, less sure even then—it felt like caution more than certainty. The sign-off, I'm still not positive I made the better call, but I don't think it was unreasonable given the time. Interviewer: If you'd had the full 45 minutes instead of 30, would you have handled the machinery cargo differently? Participant: Probably, yes. I think I'd have pulled the manual chart. The shorter window is what pushed me to just trust the system's history instead. Interviewer: If the mail had gone to the usual forward hold instead of hold 5? Participant: Then the weight comparison would've actually held up fine, since placement wouldn't have mattered as much. It was the aft location that made that comparison misleading, not the comparison itself. Interviewer: If you'd known upfront the two prior tail-heavy events were unrelated, would you have redistributed the same way? Participant: No. I'd have trusted my own numbers for this flight instead of layering in a correction based on two other tails. Interviewer: Anything you'd do differently facing this same sequence again, under the same shortened window? Participant: Pull the manual chart for anything irregular no matter how tight the clock is, and keep this flight's numbers separate from what happened on previous ones unless I actually know there's a shared cause. The LMC piece I'd still have to think through—weight alone wasn't the full story that day, and less time made that easier to miss, not harder."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

