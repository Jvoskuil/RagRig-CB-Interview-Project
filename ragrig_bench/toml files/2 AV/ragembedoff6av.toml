# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, just to confirm — this is a routine debrief for our operational learning file, not a disciplinary review, and you're free to skip anything you'd rather not detail. Can you tell me your role and how long you've been dispatching? Participant: Sure, no problem. I'm a Flight Operations Officer, licensed dispatcher, coming up on nine years now, mostly widebody long-haul. I hold joint responsibility with the captain for the flight release, so I'm in it from planning through landing. Interviewer: Good. Let's start broad — walk me through the flight and what your objective was going in. Participant: This was an overnight JFK to Lisbon rotation, widebody twin. My job was to build a release that was compliant and reasonably efficient — right fuel, right alternate, nothing wasteful, but enough margin to cover the weather picture. Going into the shift I already knew the aircraft had an APU write-up, deferred under the MEL, so anywhere we might divert needed ground power support, not just a runway. That constraint shaped everything downstream. Interviewer: What was the weather picture at that point? Participant: The 0300Z TAF for Lisbon showed some morning visibility restriction, fairly typical coastal fog, but forecast to lift comfortably before our arrival window. Porto looked like the natural alternate — good runway, and their ground power unit was listed as available until 0500 local, which covered our arrival plus buffer. I built the release off that TAF: standard alternate fuel, contingency, reserve. It matched policy, so I didn't see a reason to load extra gas or chase a second alternate. I remember thinking the numbers were clean and moving on to the next release in the queue — it was a busy overnight bank. Interviewer: Once the flight departed, how did things unfold? Participant: Fairly normal until a few hours in. An amended TAF came through showing the fog setting in about two hours earlier than the original forecast had it. I pulled up the model guidance to sanity-check it. One run still showed the improving trend consistent with what I'd already briefed the crew. Another run, plus a PIREP from an aircraft that had landed there not long before, pointed to a slower burn-off, worse than forecast. Then later, closer to descent, the crew asked me directly for a fresh read on continue-versus-divert risk, and I answered that using the fuel picture. Finally at top of descent, with visibility sitting right at minima and the Porto GPU window closing, I gave a continue recommendation. There was a short hold near the bottom before it worked out, but we landed at Lisbon without further incident. Interviewer: Let's rebuild that chronologically. What information did you have at each stage, in order? Participant: Release time: early TAF, MEL constraint, alternate fuel policy. A couple hours later: amended TAF plus two competing model runs and a PIREP. Later still, maybe ninety minutes from arrival: extended satellite imagery, more METARs from stations around Lisbon, current fuel state, and updated word on the Porto GPU cutoff. Then at top of descent: live visibility trend, the closing GPU window, and the crew wanting a straight answer. Interviewer: Let's take the first decision — building the release. What alternatives did you weigh? Participant: Really it was between releasing on the minimum required fuel and alternate per the early TAF, or padding it — extra fuel, maybe a second alternate with round-the-clock power, given there was a fog signature in the picture at all. Interviewer: What made you go with the minimum? Participant: The TAF I had in front of me supported it, and Porto's GPU window comfortably covered our ETA. Once that release was built, honestly, that became my working number for the rest of the watch — the later checks I did were more about confirming that figure still held rather than starting over and asking whether a completely different fuel or alternate plan made more sense from scratch. Interviewer: When the amended TAF and the conflicting model/PIREP data came in, how did you handle that? Participant: I looked at both. The model that lined up with the trend I'd already briefed felt more current and more consistent with what we'd been seeing on other flights that shift, so I leaned on that one. The PIREP was useful, but a single pilot report felt like one data point against a fuller model picture, so I passed the update to the crew framed around the improving trend, noting the other read existed but wasn't the lead story. Interviewer: Did you consider weighting the PIREP and the slower-recovery model more heavily? Participant: I considered it, yeah. It just didn't feel like enough on its own to justify walking back guidance I'd already given the crew. Interviewer: Move to the point where the crew asked for a fresh risk read. What did you do with the imagery and extra METARs? Participant: I went through the extended satellite loop pretty carefully, plus the nearby METARs, spent real time on it. It gave me a fuller picture and I felt more settled afterward. Looking back, I think I was treating the sheer amount of data as if working through more of it would settle the call on its own — but the extra loop and those additional METARs were really just repeating the same broad trend I already had, and there wasn't a specific reading in any of them that was ever going to flip the recommendation one way or the other. Interviewer: And how did you answer their risk question specifically? Participant: They'd asked something broader — basically, is continuing to Lisbon versus setting up for Porto still the right call given the MEL and the visibility trend. I answered mostly with the fuel numbers — we had healthy reserves, well above minimums, comfortable margin to hold if needed. That's a real and necessary part of the answer. Whether I fully separated out the visibility-and-GPU-window piece as its own question, distinct from just 'do we have gas,' I'm less sure about now. Interviewer: Last decision — top of descent, visibility near minima, GPU window closing. What tipped you to continue rather than divert? Participant: The remaining fuel and time margin still looked workable, and the plan all along had been Lisbon with Porto as backup if things really fell apart. Diverting felt like abandoning a plan that had held up reasonably well to that point, and the numbers on paper still supported continuing. I recommended continue. Interviewer: How confident were you at that moment? Participant: Genuinely, moderately confident, not fully. There was real uncertainty in that visibility trend. Interviewer: How did that get reflected afterward, say in the operations log? Participant: I wrote it up fairly cleanly — noted that conditions supported continuing to Lisbon and that the fuel plan held throughout. Reading it back now, it reads a bit more settled than it actually felt in the moment. Interviewer: If the PIREP and slower model had arrived before you finalized the release, would anything have changed? Participant: Possibly the alternate fuel load, yes. Hard to say for certain. Interviewer: If the GPU cutoff had been flagged an hour earlier than it was, what would you have done differently at top of descent? Participant: That probably shifts the divert case earlier — that window was really the tightest constraint in the whole picture. Interviewer: Anything you'd tell a newer dispatcher about a night like this? Participant: Keep re-asking the actual question being asked, not just the easiest piece of it, and don't let your first number quietly become the only number you're checking against."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

