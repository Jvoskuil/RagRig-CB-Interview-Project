# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this conversation is being recorded for an internal reliability-process review, not a safety investigation into you personally — we're trying to understand how these calls actually get made in practice. That okay with you? Participant: Yeah, that's fine. Happy to walk through it. Interviewer: Great. Can you start by telling me your role and how this particular case landed on your desk? Participant: Sure. I'm a reliability engineer in Maintenance Control. Part of my job is watching for repetitive write-ups across the fleet and deciding when something crosses from 'normal noise' into something that needs a formal corrective action. This one came up because tail 738 logged a third APU bleed air valve write-up inside 45 flight days. Two earlier ones had been closed out as operational check normal, no parts changed, which is pretty typical — a lot of these clear on the bench. Interviewer: Walk me through the incident from the beginning, in your own words. Participant: So the third write-up on 738 is what actually got my attention, because three in that short a window is unusual even though our fleet-wide removal rate for that valve was still sitting inside the OEM's published MTBUR. Nothing screamed 'fleet problem' yet — it looked like it could just be a stubborn individual aircraft. I opened a focused review on that tail rather than calling it a fleet issue outright, and I put a flag on it so I'd get pinged if anything similar showed up elsewhere. Two days later it did — tail 712 logged a lower-severity version of basically the same complaint. That's when line maintenance told me the valve is genuinely hard to bench-test, which raised the possibility we had an intermittent fault that ground checks weren't catching. At that point I pulled the two tails' component histories together and found they shared the same valve batch lot number. That felt like a real thread to pull. Interviewer: What did you do with that lot-number connection? Participant: Company policy is we don't like repeated MEL carryover on the same defect — dispatching with the APU inoperative under MEL is allowed, but doing it leg after leg on the same fault is a flag in itself. Neither aircraft had had an actual in-flight consequence; both faults were caught on the ground. So grounding both outright felt like more than the evidence supported at that point. I put an interim restriction on — one leg of MEL carryover maximum, then it has to be addressed — on both tails, and opened a formal root-cause investigation tied to that lot number. Interviewer: What came back from that investigation? Participant: The vendor quality engineer confirmed that lot had a documented seal-material change about six months earlier. That's a real, traceable cause — not a guess. And our in-house teardown of the valve we'd pulled off 738 showed seal degradation that was consistent with exactly that material change. So by that point I had two independent lines — vendor documentation and physical teardown — pointing at the same thing. Interviewer: Let's slow down on that moment, because I want to understand what happened next. What were you weighing? Participant: Right, so this is the part before I finalized anything for the Reliability Control Board. I had ten days to the RCB deadline. The vendor's lot documentation and our own teardown already lined up on the seal material as the cause, and honestly I'd already decided in my own head that the corrective action was going to be a lot-bounded replacement — that part felt settled. But there was still an option to send the valve out to an external metallurgical lab for an independent composition assay, on top of what I already had. Interviewer: And what did you decide? Participant: I sent it out anyway. I'd basically landed on the lot-based replacement regardless of what came back — I wasn't holding the recommendation open pending that result. I think I just wanted a third, fully independent source in the file alongside the vendor's own account of their material, so the package read as more thorough when it went to the board. I knew the lab's turnaround was about three weeks, which meant we'd blow through the RCB deadline before that data came back, and I sent it anyway. Interviewer: At the time you sent it out, was there anything the assay could tell you that would have changed which corrective action you recommended? Participant: Not really, no. The recommendation was already written in my head — vendor records and physical teardown agreed, and that's what the corrective action request was going to be built on either way. I think I was after the reassurance of having one more test in the folder more than anything that would've moved the decision itself. Interviewer: What happened with the deadline? Participant: We missed presenting a finalized recommendation at that RCB cycle. It slipped to submit-pending-lab-results, even though the recommendation itself wasn't really pending on anything. When the assay results did eventually land, they confirmed the same seal-material change the vendor had already told us about — nothing new in it. Interviewer: Let's move to the final decision — what you actually recommended once everything was in. Participant: Once the root cause was locked down, the OEM tech rep raised the idea of a broader design review of the valve seal spec generally, as a longer-term option. But that's a slow, separate track. What I had in front of me was a specific, bounded problem: one vendor lot, identifiable serial ranges. I wrote the corrective action request to replace valves from that lot specifically, not a fleet-wide swap of every valve regardless of lot, and not just deferring to wait on the OEM's broader review. Interviewer: Why bounded to the lot rather than fleet-wide? Participant: Because a fleet-wide replacement would have pulled serviceable, unaffected valves for no reason — that's cost and downtime with no reliability benefit. The evidence pointed specifically at that lot, so that's what I scoped the action to. Interviewer: What happened after you submitted it? Participant: RCB approved the lot-based campaign. Both tails got their valves replaced, and there haven't been further events on either aircraft since. The OEM's broader design review got pushed into a separate long-term study, which is still open as far as I know. Interviewer: Looking back at the whole sequence — is there a point where, with hindsight, you'd handle it differently? Participant: The one thing I go back and forth on is the external lab. I already knew the recommendation wasn't going to move based on what it found — I'd have submitted the same lot-based request either way. Knowing that now, I probably should have just submitted on the original ten-day timeline using the vendor and teardown evidence and let the RCB approve on that, rather than holding the whole submission for a test that was only ever going to restate what I already had. Interviewer: If the assay had come back showing something different from the vendor's account — a different degradation mechanism, say — what would you have done? Participant: I'd have flagged it and opened a separate follow-up investigation into whether the lot-based campaign needed a second look. But that would've come after the fact — I wasn't planning to hold up this submission on that possibility, since I'd already committed to the lot-based recommendation before the assay went out. Interviewer: And if this exact pattern showed up again on a different fleet type — same lot-based signature, same timeline pressure — would you send it out for independent lab work again? Participant: Probably not on the same timeline, honestly. I think I'd ask myself earlier on whether the extra data was likely to change the recommendation I'd already reached or just make the file look better, and weigh that against the deadline more explicitly than I did this time. Interviewer: That's a good place to stop. Thanks for the detail — this is exactly the kind of reconstruction we needed. Participant: No problem. Happy to follow up if anything else comes to mind."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

