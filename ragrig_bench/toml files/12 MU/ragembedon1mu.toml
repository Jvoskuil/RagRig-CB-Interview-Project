# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this is a voluntary debrief for our operational learning file, not a disciplinary review — you can decline any question. Can you state your role and how long you've been in it? Participant: Sure. I'm shift captain on nights, been supervising underground crews about nine years, this site for four. Before that I was a ground control tech, so I came up through that side. Interviewer: Good. Let's start broad — walk me through what you knew at the start of the shift, before anything unusual happened. Participant: Standard handover. Day shift left a note that there'd been a small seismic event overnight near Panel 3, magnitude around 1.1, logged as minor, within normal range for that ground. They also flagged some wet ground near the access drift — more seepage than usual, nothing alarming on its own. Production schedule had us blasting Panel 3 within the first couple hours, and mucking and haulage after that. That was the plan. Interviewer: What was the main objective for the night? Participant: Keep Panel 3 on schedule. We were behind for the week, so there was some pressure from the surface to not lose another shift. Safety first, obviously, but the blast cycle was already tight. Interviewer: Take me through the incident itself, in order. Participant: Okay. First couple hours were the blast — I authorized it after the ground control tech did a visual pass, no visible loose rock, so we went ahead as scheduled. Didn't call for an instrumented convergence check, just a visual scaling look, because the seismic event had been small and logged as normal range. Blast went fine, mucking started. A while after that, microseismic monitoring started showing a cluster of small events near the panel next to our old mined-out area — not bigger events, just more of them, more frequent. Haul trucks run a road that passes under part of that adjacent panel, so I had to decide whether to keep hauling that route. Ventilation was reading normal across the circuit, no gas issues reported, so I let haulage continue as-is. About fifteen minutes after trucks started moving again, a methane sensor near that haul intersection logged a brief spike, then went back to baseline. Ventilation officer logged it as transient, no recurrence, didn't think much of it at the time — that kind of blip happens. Then we got the fall of ground. Small one, near the haul intersection, damaged a section of mesh, no injuries, but it needed re-support before we could keep running trucks through there. Interviewer: When that happened, what did you think was going on? Participant: Honestly, by that point it felt pretty clear. You had the seismic event overnight, the wet ground, then the seismic cluster building up near the old workings, plus the blast vibration from our own cycle — it all lined up. Stress transfer off the old mined-out panel, aggravated by the water getting into the joints and then our blast adding vibration on top. Once you saw it laid out like that, it made sense — it was almost the story you'd expect given that ground history. Interviewer: And the methane spike from earlier? Participant: That I set aside. It didn't fit with a ground stability event — different system, different sensor, and it hadn't recurred. Ventilation had already called it transient. I didn't loop back on it specifically once we had a ground explanation that accounted for everything else. Interviewer: Let's go back through each decision point one at a time. Starting with the blast authorization — what alternatives did you weigh? Participant: Three options really. Go ahead with just the visual check, delay and call for an instrumented geotech inspection, or go ahead but scale back charge size and add scaling time as a buffer. I went with the first. The seismic event was classified minor, the tech didn't see loose rock, and we were already behind schedule. Interviewer: What cues mattered most there? Participant: The classification on the seismic log, mostly. 'Minor, within normal range' carries weight — that's the geotech team's own threshold, not something I'm second-guessing casually. Interviewer: Any uncertainty at that point? Participant: Some. The wet ground note nagged at me a little, but on its own it's common enough that shift. Interviewer: Second decision — continuing haulage under the adjacent panel despite the seismic cluster. Participant: I considered rerouting the trucks, or halting until the geotech engineer looked at the cluster. But it was frequency increasing, not magnitude — that pattern is something I've seen before near old workings settling out. Ventilation was clean. Given the schedule pressure, I let it continue. Interviewer: Whose input did you lean on there, and whose didn't you seek? Participant: Leaned on the ventilation officer's readings. Didn't call the on-call geotech engineer — he's not on-site overnight, and I judged the cluster wasn't urgent enough to wake him for. Interviewer: Third — the fall of ground and the remediation decision. What alternatives existed? Participant: I could've treated the cause as undetermined and ordered an instrumented investigation of both the ground and the gas anomaly before deciding on re-support. Or gotten the geotech engineer's real-time input before committing to any explanation. Instead I went with the stress-transfer account and had the crew re-support directly on that basis. Interviewer: What made that explanation feel solid enough to act on without waiting for engineering input? Participant: It tied together everything we'd seen that night in one line — the timing worked, the location worked, the mechanism was one I understood from my ground control days. When it clicks together that cleanly, you don't feel like you're guessing anymore. Interviewer: Did anything not fit that account? Participant: The methane spike, technically. But it was a single blip, different monitoring system, already logged as transient. It didn't feel like it belonged in the same picture as a ground support issue. Interviewer: Fourth decision — resuming production after re-support. Participant: Re-support was done, no new seismic or gas readings since the FOG, and we were losing more schedule the longer we sat. I could've resumed limited production with continued monitoring, or suspended the panel until formal sign-off. I resumed full production. The explanation held together and the repair was solid, so I didn't see a reason to hold back further. Interviewer: How confident were you in the cause at that point, on reflection? Participant: Pretty confident in the moment. Looking back, I'll admit the geotech engineer wanted the raw seismic and gas data before he'd sign off on it as the definitive cause — he mentioned it could also be a localized joint failure or even sensor drift, unrelated to the stress-transfer idea entirely. Interviewer: What information, if you'd had it earlier, might have changed your read? Participant: Probably the engineer's data review itself, before we committed to re-support. If that had flagged the methane sensor as a calibration issue right away, or ruled out joint failure, I'd have felt more sure. Without it, I was working off what fit together in front of me. Interviewer: If the methane spike had recurred a second time that night, would that have changed anything? Participant: Yeah, I think so. A repeat would've been harder to wave off as unrelated. One blip is easy to set aside; two starts looking like its own problem. Interviewer: Looking back, what part of your explanation are you least sure about now? Participant: Whether the stress transfer story was really the whole cause, or just the part that was easiest to see. The pieces fit together well enough that I didn't push hard on what didn't fit. Interviewer: What would you tell a newer supervisor facing a similar sequence? Participant: That a clean-sounding explanation isn't the same as a confirmed one — get the data checked even when the story already feels complete."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

