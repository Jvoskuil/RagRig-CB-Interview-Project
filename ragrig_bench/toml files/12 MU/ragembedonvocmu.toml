# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "**Interviewer:** Thanks for making time for this. Just to confirm, this is a voluntary debrief for our internal learning review, not a disciplinary process — anything you share helps us understand decision-making under uncertainty, not to assign blame. Can you start by telling me your role and what you were responsible for during this incident? **Participant:** Sure. I'm the ground control specialist for the site — geotech engineer by training. I cover support design, monitoring interpretation, and sign-off on ground conditions for active headings. During this shift I was working from the surface office but on call for anything flagged at the 4200 development face and the adjacent bolted heading next to it. **Interviewer:** Good. Before we get into specifics, can you give me a general account of what happened, start to finish? **Participant:** It started with a call from the shift boss — minor rib spalling near the 4200 face, right after a blast, with a bit of dust puffing off the wall. Nobody was hurt, the crew paused on their own. Our extensometer near that face had been down for about two days — the bolting rig had knocked the cable loose — so I didn't have fresh convergence numbers for that specific spot. That gap mattered to me; I flagged it as something we'd need to close before I could really trust any read on that area. I also had the 3800 panel in the back of my mind — a similar-looking spalling event about six months earlier that we'd traced to aggressive undercutting by the operator at the time. But I didn't want to lean on that too hard, since one analogy from a different crew and a different round doesn't tell you much about stress conditions here. I authorized continued mucking with a visual check, treating both the operator-technique angle and the possibility of something geological as open questions. A bit later the scaling crew called in bigger slabs than first described, plus a hairline fracture pattern we hadn't logged. We're roughly fifteen to twenty meters from a mapped fault splay there, though the exact position is fuzzy. I ran our convergence model using the nearest working stations, which weren't right at the face. It came back with a low displacement forecast, but the technician reminded me the model's calibration came from a different rock mass domain, so I didn't take the number at face value — I discounted it and tied continuing the round to a specific follow-up scaling check afterward. After the round, spalling showed up in the adjacent bolted heading too. The shift boss asked about mesh and bolts before the next rotation, and the mine manager flagged the schedule hit. I treated the second location as new information rather than just an extension of what I already believed, so I ordered spot bolts at the fracture and a targeted scaling check instead of either a full upgrade or a full deferral. A couple hours later a crack opened along a bolt row. The technician wanted immediate evacuation. I authorized a restricted, technician-accompanied entry instead of routine access, since I didn't think the crack could just be read as more of the same. Not long after, we had a larger fall in that section. No one was hurt — an unrelated alarm cleared people out just before it happened — but it could have gone differently. **Interviewer:** Let's reconstruct the timeline a bit more precisely. What exactly did you know at the moment of that first call? **Participant:** Just the spalling, the dust, no injuries, crew stopped on their own. And that our monitoring near that face was blind because of the extensometer outage — that was very much on my mind, not something I set aside. **Interviewer:** And after the scaling crew's second report? **Participant:** That's when the picture got more complicated — bigger slabs, a fracture pattern, and the fault splay proximity became more relevant. It pushed me to actually run the model rather than rely on judgment alone. **Interviewer:** When did you first pull up the convergence model output, and what did you do with it? **Participant:** Right after that second report. I wanted a second line of evidence, but I went in already expecting to have to adjust for the domain mismatch. **Interviewer:** Walk me through the gap between finishing the round and the evacuation call. **Participant:** Round finished, spalling in the adjacent heading came up, I ordered the spot check rather than closing the question either way, then the crack appeared maybe two hours later, and the technician pushed for evacuation almost immediately after that. **Interviewer:** Let's go through the first decision — authorizing continued mucking. What alternatives did you weigh? **Participant:** Stopping everything for a full inspection, or restricting a buffer zone and resequencing the round. I went with the visual-check option, but I didn't treat it as a closed case. **Interviewer:** How did you weigh the 3800 comparison against the missing extensometer data? **Participant:** I tried to hold both at once. The 3800 case gave me one plausible read, but the missing monitoring meant I genuinely didn't know what the ground was doing locally, and I didn't want that gap to just disappear because I had a tidier story available. I made a point of telling the shift boss I wanted that extensometer back online as soon as the rig work allowed. **Interviewer:** Second decision — using the convergence model output to justify finishing the round. How did you decide how much weight to give it? **Participant:** Given the domain mismatch the technician flagged, I didn't treat the low-displacement number as decisive on its own — more as one data point that shifted my confidence somewhat, conditional on a scaling check afterward. If that check had come back worse, I'd have stopped regardless of what the model said. **Interviewer:** What was the technician's concern, specifically, and how did you incorporate it? **Participant:** She said the model's calibration came from a different rock mass domain and might not transfer well this close to the fault splay. I built that into how much I let the forecast move my decision — I leaned on it less than I would have on a panel where I trusted the calibration fit. **Interviewer:** Third decision — the adjacent heading. What led you to the spot-check option rather than a full upgrade or a full deferral? **Participant:** The new location mattered to me — it wasn't just the same spalling showing up again, it was a second area behaving in a way the earlier forecast hadn't covered. A full deferral felt like ignoring that; a full upgrade felt premature without more specific data on where the fracture actually was. The spot bolts and scaling check were a way to act on the new information without overcommitting either direction. **Interviewer:** What would have changed that decision? **Participant:** Fresh convergence readings right at that heading, or if the crack had shown up before I made the call instead of after. **Interviewer:** Fourth decision — allowing entry after the crack appeared. What was your reasoning? **Participant:** The model hadn't been rerun with the crack data, so I didn't extend the earlier forecast to cover it — that felt like a different question. I authorized a restricted entry with the technician present rather than routine access, treating the crack as something we still needed to understand rather than something already explained by what we'd seen at the face. **Interviewer:** How much did time pressure factor into that specific call? **Participant:** A fair amount. The next crew was due within the hour, and a full lockout would have meant a second schedule hit in one shift. That pressure was real, but it's why I restricted the entry rather than just clearing it outright. **Interviewer:** Looking back, if the extensometer had been working the entire time, do you think your decisions would have gone differently? **Participant:** Probably at the first and third points especially. Real numbers instead of partial analogies and adjusted model output would have given me something firmer to act on earlier. **Interviewer:** And if the 3800 investigation had reached a different conclusion — say it had been traced to stress redistribution near a geological structure instead of operator technique — do you think you'd have read this situation differently? **Participant:** Maybe somewhat, but I'd hope I'd still have tried to treat it as one data point rather than the deciding factor, given how different the local conditions were here. **Interviewer:** Last one — what would you do differently if a similar sequence came in again? **Participant:** Push even harder to get monitoring restored before any round decision, and probably formalize the follow-up conditions I attach to model output, rather than keeping them informal in my own head. **Interviewer:** That's really helpful detail. Thanks for walking through it so openly."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

