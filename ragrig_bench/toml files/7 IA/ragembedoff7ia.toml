# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, I want to confirm you're comfortable walking through the procurement network reporting incident from earlier this year in detail, including your own decision-making, and that this is for internal process review rather than any kind of performance evaluation. Participant: Yeah, that's fine. I figured we'd get to that one eventually. Interviewer: Can you give me your role and a quick sense of what this incident was? Participant: I'm a reports officer, I also handle collection management for our part of the station. This case was a walk-in who showed up claiming to know about a shipment tied to a procurement network we'd been chasing for months. It turned into a pretty compressed reporting cycle because we had a policy briefing coming up fast. Interviewer: Let's start with the incident itself. Walk me through how it began. Participant: So this network had been frustrating us for a while — lots of partial reporting, nothing that let us really nail down how they were moving material. Then out of nowhere, a walk-in comes into the local office claiming direct knowledge of an imminent shipment. He had a handwritten fragment that looked like part of a manifest, and a photo of a shipping container. Honestly, my first reaction was that this looked like exactly the pattern we'd been building toward — the container markings, the paper trail, it all lined up with what we expected this network's shipments to look like. I remember telling my deputy it was almost a textbook match. Interviewer: What did the documents actually show, as best you recall? Participant: The manifest fragment was partial — some numbers, an abbreviated destination code, nothing complete. The photo was a standard container, generic markings, could've been thousands of containers at that port. But given everything we'd already built on this target, it read to me as clearly consistent. I didn't really entertain that it could just as easily be a routine shipment. Interviewer: How did you feel at that point, beyond the analytical read? Participant: If I'm honest, there was relief. We'd put months into this with basically nothing to show, and here's someone walking in with exactly the kind of specificity we'd been missing. I remember thinking, finally, this is the break. That colored how quickly I moved to request expedited document validation instead of sitting with the uncertainty a bit longer. Interviewer: Let's reconstruct the timeline from there. What happened after the walk-in session? Participant: I drafted debrief notes describing him as consistent with the network hypothesis and pushed for expedited validation. Around the same time, we had a coordination call with technical collection folks, and that's when a colleague flagged that their data showed activity at a different port than the one the walk-in named. Then I spent the next stretch drafting the report itself, and the final hours before the briefing were spent finalizing language and setting up follow-on tasking. Interviewer: Let's go back to that first decision — accepting the walk-in's material as consistent with the network hypothesis versus treating him as fully unvetted. What were your alternatives? Participant: Technically I had three options: treat him as an unvetted contact needing full standard validation before any tasking, treat the material as a strong match and move to tasking right away, or defer any assessment twenty-four hours for basic authentication. I went with the middle path, more or less. Interviewer: What made the middle path more compelling than waiting for authentication? Participant: The pattern fit was strong enough that I didn't feel authentication would tell me anything I didn't already believe. Looking back, that's probably generous — the physical evidence itself wasn't that specific. But it matched the shape of what we expected, and given how long we'd been at this, waiting felt like it was leaving value on the table. Interviewer: Second decision point — reconciling the walk-in's account with the technical collection discrepancy about the port. What did you weigh there? Participant: The walk-in claimed he'd had a prior logistics role, which would explain how he'd know shipment details. That struck me as the kind of detail a real insider would know, not something you'd fabricate. So I leaned toward treating his account as substantially credible on that basis. Honestly, the claim on its own didn't prove he knew anything about this particular shipment — it just made the story fit together the way I already expected it to, so I let it stand as enough. If that same claimed logistics background had come attached to an account that pointed away from the network we'd been building the case on, I probably would have wanted a lot more before accepting it. Meanwhile the port discrepancy from technical collection was sitting there, and my colleague raised it directly on the call. Interviewer: How did that discrepancy factor into the draft? Participant: It went into a footnote. The corroborating sub-source reporting and the walk-in's account got the bulk of the narrative treatment. I didn't have a strong evidentiary reason to downgrade the technical flag — if anything it deserved more scrutiny — but it just didn't get the same space in my head at that point. Interviewer: What was driving that imbalance in attention, would you say? Participant: Partly deadline pressure. Partly that the corroborating material fit the story we were already building, so it took less effort to write up. The port discrepancy would have required unwinding something, and I didn't have time to unwind it properly. Interviewer: Third decision point — how you described the uncertainty in the report itself, and how you scheduled the follow-on work. Walk me through that. Participant: The shipment timing estimate had real uncertainty in it. I could have written it either way — emphasizing what we didn't know and what might undercut the assessment, or emphasizing the probability that the network would move soon. I went with language that stressed the chance of imminent action. It read as more useful for a policy audience with fourteen hours to go. Interviewer: Just to pin that down — was the actual underlying estimate any different depending on which way you phrased it, or was it the same number either way? Participant: Same number, same underlying picture. Nothing in the estimate itself changed. But writing it as 'likely to move soon' instead of 'not confirmed to move imminently' made the whole thing feel more actionable to me as I was drafting it — like it justified moving forward with fewer qualifiers than I probably would have used if I'd framed it the other way. Interviewer: And the follow-on tasking timeline? Participant: I set meetings and validation steps assuming everything would line up — interpreter availability, safehouse access, sub-source cooperation, all on a fast track. We'd run similar validation sequences before and they'd almost always taken longer than planned, but I didn't build that history into the schedule this time. The deadline was right there, so I planned for the version where things went smoothly. Interviewer: Fourth decision point — the branch chief's push to disseminate. What happened? Participant: My chief reviewed the draft and wanted it out the door as-is, minimal additional caveats, given the deadline. The port discrepancy was still unresolved at that point. I'd seen him make calls like this before in ambiguous situations, and he'd usually been right. So I didn't push back or request the extra caveat language I probably could have asked for. Interviewer: What was the deciding factor in not pushing back? Participant: Honestly, his track record and seniority carried a lot of weight for me in that moment. I didn't go back and independently re-examine the discrepancy myself before agreeing — I mostly deferred to his read of the situation. Interviewer: What happened after dissemination? Participant: The product went out largely as he wanted. Afterward, the observed shipment activity didn't line up with the timing we'd put in the report. Interviewer: If the port discrepancy had surfaced earlier, before your first read of the walk-in, do you think your draft would have looked different? Participant: Maybe. I'd like to think I'd have weighed it more evenly from the start rather than treating it as something to explain away later. Interviewer: If your chief hadn't expressed a preference on dissemination, would you have handled the caveats differently? Participant: Possibly stronger caveats, or at least a harder look at the discrepancy before signing off. Hard to say for certain. Interviewer: Looking back, is there a point where you'd have wanted more time, regardless of the deadline? Participant: The very first read of the documents. I moved to expedited validation pretty fast instead of sitting with the ambiguity. Interviewer: Last one — if this kind of walk-in situation happened again, what would you want in place beforehand? Participant: Probably a standing rule to get an independent second read on ambiguous physical evidence before it shapes the rest of the reporting cycle, and more discipline about building historical timelines into follow-on scheduling instead of assuming best case. Interviewer: That's really helpful context. Thank you for walking through it in this much detail."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

