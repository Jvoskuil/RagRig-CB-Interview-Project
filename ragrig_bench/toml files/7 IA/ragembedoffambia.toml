# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for taking the time. This is being recorded for internal case-review purposes only, and you can skip anything you'd rather not go into. Can you start by telling me your role and background? Participant: Sure. I'm a financial crime intelligence analyst on the FIU team, been in this specific role about six years, mostly trade finance and sanctions typologies before that. Interviewer: I want to walk through a specific case — the Halcyon Freight matter. Can you tell me how it came to your attention and what you were trying to achieve? Participant: It came in as part of a batch alert — four counterparties flagged together. Halcyon Freight Partners was one of them, along with a commodities trader, a small logistics subcontractor, and a shipping agent. My objective was the usual one: figure out whether there was enough here to warrant an escalation to compliance and possibly law enforcement, and do it within the ten-day filing window. Interviewer: What did the batch actually show you? Participant: Halcyon had one indicator that stood out — an invoice value gap, meaning the declared value didn't match what we'd expect for the goods described. No beneficial-ownership overlap with anything I'd seen before, so it wasn't ringing any specific bells. The commodities trader had a minor documentation gap, but nothing typologically interesting. It was a fairly normal week workload-wise, nothing especially heavy. Interviewer: Walk me through what you did once you had that picture. Participant: I prioritized Halcyon first, since the invoice gap was the clearest indicator I had to work with, and documented a plan to get through the other three that same week. I didn't ignore them — I just sequenced based on which indicator looked most substantive on its face. Interviewer: What made you order it that way rather than, say, splitting time evenly or going by transaction size? Participant: Honestly, either of those would have been defensible too. I went with indicator strength because that's usually a decent proxy for where the real risk sits, but I'll admit transaction size might have surfaced something different. I made a note of the reasoning in case anyone asked. Interviewer: Did anyone ask? Participant: Yeah, my team lead did, later. Wanted to know why I'd sequenced it that way. I walked her through the invoice-gap rationale and she was fine with it — it wasn't the only reasonable choice, but it wasn't unreasonable either. Interviewer: What came out of the other three once you got to them? Participant: The shipping agent turned out to have an administrative filing delay — paperwork lag, not a risk issue at all. Nothing on the logistics subcontractor either. So the sequencing didn't really cost us anything in the end, though I can't say for certain it wouldn't have mattered in a different case. Interviewer: Let's move to the vendor report. What happened there? Participant: A few days in, our OSINT vendor sent a report saying Halcyon's ownership structure was 'plausibly consistent' with a known layering pattern. Importantly, they flagged it as moderate confidence themselves and noted one registry link hadn't been independently verified yet. Interviewer: How did you decide how much weight to give that? Participant: A colleague suggested we get a second data pull to firm up that specific link before leaning on the report too heavily. I thought that was reasonable, so I treated the report as partial corroboration — enough to keep building the file, not enough to treat as settled — while the second pull was requested in parallel. Interviewer: Was there a version of this where you'd have leaned harder on the report, or set it aside entirely? Participant: Sure, both were on the table. If it had come in with high confidence and no caveats, I probably would have moved faster. If a colleague hadn't raised the registry-link point, I might have just taken it at face value. Setting it aside completely felt like it would slow us down without much benefit, since the report was self-aware about its own gap. Interviewer: What did the second data pull show? Participant: It confirmed the registry link, actually. Compliance counsel later said treating it as partial rather than definitive was the right call, though I don't think that outcome alone tells you the initial judgment was necessarily correct — it could've gone the other way too. Interviewer: Let's talk about the correspondent bank. What was that situation? Participant: We'd requested SWIFT records and hadn't heard back. This particular correspondent's turnaround history is all over the place — I've seen requests take anywhere from five to fourteen business days, no real pattern to it. We were six days out from the filing deadline, and the liaison had just logged it as 'standard priority,' no timeline attached either way. Interviewer: What did you decide to do while you waited? Participant: Kept building the file and wrote up a contingency note — basically, what we'd file if the records didn't show up in time. Given how mixed the history was on turnaround, I didn't feel like I had grounds to assume either a fast or slow outcome, so I planned for both. Interviewer: What actually happened? Participant: Partial records came back on day six. Enough to inform the file, not enough to close every gap. My team lead noted we'd at least had the contingency plan ready, which helped. Interviewer: Last stretch — the time estimate for remaining work. Participant: Reconciling two invoice sets, drafting the narrative, compliance sign-off. Comparable cases have run anywhere from four to eight days historically — a pretty wide band. I landed on four days, near the lower end, based on the specific tasks left and the fact that neither of my other two cases was at a critical point that week. Interviewer: What made you lean toward the lower end rather than the middle or upper end of that range? Participant: The task list itself looked manageable, and I didn't have anything else competing hard for my time. I did flag internally that if a reconciliation issue came up, that number could slip. Interviewer: How did it actually play out? Participant: Pretty close. One clarifying question came up during reconciliation that cost half a day, and sign-off took about as long as I'd have expected given the case's complexity. Nothing dramatic. Interviewer: Looking back across all four points, what were you least sure about at the time? Participant: Probably the correspondent bank timing — that one genuinely could have gone either way, and I don't think there was a way to know in advance. The vendor report's registry link was a close second. Interviewer: A few hypotheticals. If the shipping agent's delay had turned out to be substantive rather than administrative, what would you have done? Participant: I'd have reshuffled priorities immediately and probably pulled in a second analyst. Interviewer: If the vendor's report had come in high-confidence instead of moderate? Participant: I likely would have moved to drafting the escalation sooner rather than waiting on the second pull. Interviewer: If you'd known the records would land on day six rather than later? Participant: Honestly, not much would've changed — the contingency plan already assumed something like that. Interviewer: And if a colleague had reviewed your time estimate beforehand? Participant: They might have pushed me toward the midpoint just to be safe, but I think they'd have accepted four days as reasonable given the task list. Interviewer: That's really helpful, thank you."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

