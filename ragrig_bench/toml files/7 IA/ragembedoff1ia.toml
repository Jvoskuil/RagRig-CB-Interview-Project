# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, I want to confirm this is being recorded for internal analytic training purposes only, not for any evaluation of your performance. Is that alright with you? Participant: Yes, that's fine. I've done these debriefs before. Interviewer: Great. Can you tell me a bit about your role and your relationship to this particular account? Participant: I'm a strategic all-source analyst. I've owned the border garrison account for a little over three years now, alongside six other accounts. It's one of those long-running files where the judgment hasn't moved much — low activity, defensive posture, nothing indicating an offensive buildup. That's been the analytic line since before I inherited it. Interviewer: Let's start with a general account of the incident we're here to discuss. What happened? Participant: Over about two weeks, we started getting a handful of reports that didn't fit neatly into the existing picture. First was an imagery report — earth-moving equipment and some new foundation work near a motor pool that had been inactive for as long as anyone could remember. Then a SIGINT analyst flagged an intercept referencing something called 'phase two' in the garrison's comms, which nobody could immediately place. And then our liaison partner reported unusual convoy movement at night, three nights running. All of this came in while I was prepping for the quarterly warning board, where I'd need to either sustain or revise the standing assessment. Interviewer: What was your objective during this period? Participant: Get it right without overreacting. We've had cycles before where a single ambiguous report triggers a scramble, collection gets retasked away from higher-priority theaters, and it turns out to be nothing. I didn't want to cry wolf on an account that's been stable for three assessment cycles. At the same time, obviously, if something real was changing, I needed to catch it before the board, not after. Interviewer: What constraints were you working under? Participant: The usual ones — collection assets are shared across theaters that are ranked higher priority than this one, so tasking anything extra takes justification. I had my other six accounts competing for the same hours in the day. And the liaison service that reported the convoys has a mixed track record — historically maybe six in ten of their reports pan out. So I had to weigh all of that against a board deadline that was about ten days out. Interviewer: Let's reconstruct the timeline in order. What came in first? Participant: The imagery report came first, maybe twelve days before the board. Then the SIGINT intercept about five days after that. The liaison convoy reporting came in over the last three nights before the board prep really kicked into gear, so maybe four to six days out. Interviewer: How did each of those get logged or routed when they arrived? Participant: The imagery went into the case file as an update — it gets reviewed at the next scheduled cycle unless something flags it for early attention. The intercept got filed under the existing account entry. The convoy reporting got an annotation from me once I looked at it. None of them got kicked upstairs individually; they came to me first since I own the account. Interviewer: Let's go through the imagery report specifically. What stood out to you, and what did you decide to do? Participant: The equipment and foundation work were new, that's true — no anomalies like that in the imagery for at least eighteen months. But construction near a motor pool isn't inherently alarming; garrisons refurbish infrastructure for all kinds of reasons, maintenance, logistics upgrades. Given three straight years of assessments concluding no material change, I logged it as a routine update rather than flagging it as a deviation from baseline. I didn't task follow-on collection immediately — the next available window was about ten days out anyway. Interviewer: What alternatives did you consider at that point? Participant: I thought about pushing for immediate follow-on imagery, and I thought about flagging it to my branch chief right then for an out-of-cycle conversation. But collection is scarce, and a single unexplained construction indicator didn't feel like enough to justify jumping the queue ahead of higher-priority theaters. Interviewer: How confident were you in that call? Participant: Reasonably. Not fully — there's always some uncertainty with a single indicator. But nothing about it screamed urgent. Interviewer: Moving to the SIGINT intercept. Walk me through your reasoning there. Participant: The SIGINT analyst brought me the 'phase two' reference and asked whether it should be treated as a new indicator. I looked at the broader communications pattern, and outside that one phrase, everything else matched historical baselines — same frequency, same general traffic volume. So I characterized it as ambiguous, non-actionable language, consistent with how this garrison's comms have looked for years. Interviewer: Did you compare it against the imagery report from a few days earlier? Participant: Not directly, no. They came from different collection disciplines and different analysts brought them to me separately. At the time it didn't occur to me to sit them side by side — the intercept read as ambiguous on its own terms, so I treated it that way. Interviewer: What sources did you consult before making that call? Participant: Mainly the SIGINT analyst's write-up and the historical comms baseline in our database. I didn't pull the imagery file back up at that point. Interviewer: Let's talk about the convoy reporting. What was your process there? Participant: My branch chief asked for a preliminary read ahead of the board. I looked at the liaison's track record — about sixty percent corroboration historically — and given that base rate, I annotated the report as uncorroborated and consistent with the liaison's usual noise level. I didn't request independent verification from our own overhead assets against those specific nights. Interviewer: What alternatives were available to you there? Participant: I could have tasked an independent asset to check those nights specifically, or I could have flagged it as an open item requiring resolution before the board instead of discounting it outright. Given the timeline and the asset competition, I leaned on the liaison's reliability history as the main basis for how much weight to give it. Interviewer: Did you connect the convoy reporting with the imagery or the intercept at that stage? Participant: Not really — each one got assessed against its own history and its own source reliability. It wasn't until later, when I sat down to draft the board summary, that I had all three in front of me together. Interviewer: Tell me about that moment — pulling the recommendation together for the board. Participant: With about forty-eight hours left, I had the construction indicator, the intercept, and the convoy reporting all in the case file at once, which was actually the first time I'd looked at them side by side rather than one at a time. My recommendation was to sustain the existing steady-state judgment, with a caveat flagging the three items for continued monitoring. My reasoning was that we've had three consecutive years of stable assessments, and each of these three items, taken on its own, fell within the kind of noise this account has produced before. That track record carried a lot of weight in how much additional verification effort I felt was warranted before finalizing the call. Interviewer: Did you consider treating the three together as a potential pattern rather than as separate items? Participant: I noted them together in the write-up, but I didn't reframe the overall confidence level because of it. The account's history of stability was the anchor point for the recommendation. Interviewer: What happened after the board? Participant: The board accepted the sustained judgment with the caveats noted. About three weeks later, additional reporting came in that suggested the garrison's posture might actually have shifted, which triggered a retrospective look back at the quarterly call. That review is still ongoing, so I can't tell you definitively yet whether the original read was wrong or whether this new reporting is its own separate development. Interviewer: If the imagery report had come in on a brand-new account with no track record behind it, do you think you'd have handled it differently? Participant: Probably, yes. Without three years of stable assessments sitting behind it, I think a single unexplained construction indicator would have gotten more immediate scrutiny, maybe an earlier push for follow-on collection. Interviewer: What information, if it had arrived earlier, would have changed your recommendation at the board? Participant: If I'd had independent confirmation on the convoy nights, or if the SIGINT and imagery had been flagged together earlier instead of separately, that combination might have shifted my confidence level enough to recommend an upgrade rather than a caveat. Interviewer: Looking back, what would you tell a junior analyst handling a similar long-running low-threat account? Participant: I'd say don't let a good track record become the reason you stop cross-checking new reporting against everything else that's come in recently. It's easy to evaluate each report against its own history in isolation. I'd tell them to make a habit of pulling related indicators together sooner, not just when you're already sitting down to write the board summary."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

