# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this conversation is being recorded for internal process-improvement purposes only, and I'll be asking you to walk me through a specific incident in detail. Can you tell me your role and how long you've been in it? Participant: Sure. I'm a maintenance reliability engineer, been in this plant about eight years, and in reliability specifically for the last four. I cover rotating equipment mostly—pumps, compressors, some turbines. Interviewer: Great. I want to focus on the recent situation with feedwater pump P-204. Can you walk me through what first told you something was wrong? Participant: So this was the third bearing failure on P-204 in about five months. Each one roughly five to six weeks apart, which is not normal—this pump used to run a year or more between issues. I got the call from the control room that vibration alarms had tripped, and by the time I got out there the bearing housing was already running hot. We pulled the vibration spectrum and it showed both a thermal signature and some mechanical components, so it wasn't a clean single-cause picture right away. Interviewer: What was your goal walking into that? Participant: Get the pump back in service inside our outage window—we had 48 hours before production needed full output—and actually figure out why this keeps happening instead of just swapping the bearing again and hoping. Interviewer: Can you reconstruct the sequence of what happened next? Participant: First I pulled maintenance history on all three failures. Then I looked at who'd done the last PM—that was Marco, one of our newer techs, about six weeks before this failure. After that I looped in our vibration analyst to get a second opinion on the spectrum data. Once we had a working theory, I had to decide on an alignment approach, and in parallel we were sourcing a replacement bearing. Each of those steps fed into the next, and we were watching the clock the whole time. Interviewer: Let's start with the root cause piece. What information did you have when you were trying to explain this third failure? Participant: I had Marco's work order from the PM, and I noticed he'd used a slightly different locknut torque sequence than the guy who did the prior two PMs—not wrong exactly, just not identical to what I'd have done. I also knew our lubrication interval had been stretched from three months to four months a couple of quarters back, that was a corporate cost initiative. And I had the ambiguous vibration data. Interviewer: How did you weigh those pieces of information against each other? Participant: Honestly, the technique difference jumped out at me first. Marco's newer, he's still building his feel for these bigger pumps, and when I saw the different sequence I figured that was probably it—a slightly under- or over-torqued locknut can absolutely walk itself into a bearing failure over a few weeks. I flagged it in the RCFA as the primary contributing factor and had him redo that step with me watching next time. Interviewer: Did you weigh the lubrication interval change the same way? Participant: I noted it in the report, sure, but I didn't dig into it hard at that point. It felt like a secondary factor—we'd been running on that interval for a couple of quarters without an obvious spike in failures across the fleet, so my attention went to what was different about this specific failure, which was Marco's install. Interviewer: What would have made you look harder at the interval instead? Participant: If I'd pulled the records on the other two failures side by side right then, I'd have seen all three happened under that same extended interval, regardless of who did the install. I did eventually see that, just not at that first pass. Interviewer: Let's move to the next decision—whether to add any extra monitoring before the next run. What was on the table? Participant: Two options. Run it on the standard schedule, or add interim vibration checks partway through the run, maybe even shorten the run interval until we trusted the fix. The interim monitoring would've added a few hours to the outage. Interviewer: What tipped you toward the standard schedule? Participant: Time pressure was real—production wanted the pump back. But if I'm honest, part of my thinking was that we'd just had three failures in a row, and it felt like we were due for a clean run. Three bad ones back to back, statistically it seemed like the streak had to break at some point. Interviewer: Was there anything in the failure data that supported that expectation specifically? Participant: Not really, when you put it that way. Each failure had its own distinct cause—heat, then lubrication, then this install variance. They weren't linked to each other mechanically. I think I was reading the run of bad luck as meaning something about what came next, more than the data actually supported. Interviewer: How confident were you in that call at the time? Participant: Fairly confident, honestly. It felt intuitive in the moment. Interviewer: Third decision point—the alignment work. What were you weighing there? Participant: Our vibration analyst wanted a specialist in with the laser alignment rig, because we still weren't 100% sure if misalignment or thermal growth was the bigger driver. Problem was, the specialist and the laser tool weren't available for 24 hours, and that would've eaten deep into our window. Interviewer: What made you decide to do it yourself instead? Participant: I've done manual dial-indicator alignments on pumps like this dozens of times, going back years, generally with good results. I know how it should feel when the shaft's tracking right. So I told the team I'd handle it manually and we'd keep the outage on schedule. Interviewer: Did anything give you pause about that approach specifically for this pump? Participant: In hindsight, yes—the alignment tolerance standard for this bearing class has actually tightened since I first learned my manual method. My old technique was validated against a looser tolerance band. And we still didn't know for sure that misalignment was even the main driver versus thermal growth. But at the time I was pretty confident my hands-on feel would get it close enough. Interviewer: Last decision—the bearing part itself. What were the two options? Participant: Reorder the same legacy bearing we've always used, or install the OEM's newer sealed-bearing housing. The legacy part has a known pattern—it's not great, failures roughly every five to six weeks under current conditions, but at least we know exactly what we're dealing with. The OEM upgrade is supposedly more reliable, but their literature was vague—no actual failure-rate numbers for our application, just general claims. Interviewer: What drove your final choice? Participant: The lack of hard numbers on the OEM side bothered me. I didn't want to swap in something with an unclear track record during a tight outage when I at least understood the legacy part's behavior, even if it wasn't good behavior. So we reordered the same bearing. Interviewer: Looking back, how do you weigh that against the fact that the legacy part's known performance was already failing every five to six weeks? Participant: When you say it like that, it does sound strange to stick with something I know is inadequate over something that might be better just because I couldn't quantify the 'might.' I think not having a number to point to made it feel riskier than it maybe was. Interviewer: If the lubrication interval had never been extended, do you think this would have played out differently? Participant: Probably—less thermal stress, maybe none of the three failures happen the way they did. Hard to know for sure with the sample we have. Interviewer: If the OEM had given you a specific failure-rate figure, would that have changed your bearing decision? Participant: Possibly. If they'd said something like a documented multiple-of-improvement over our legacy MTBF, I think I'd have pushed harder to make the schedule work for the upgrade. Interviewer: Anything you'd do differently if this came up again? Participant: I'd probably pull the full failure history side by side earlier, before settling on a cause. And I'd think twice about doing the alignment myself if the tolerance standard has moved since I last checked my technique against it."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

