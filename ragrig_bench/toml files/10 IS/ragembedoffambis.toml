# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time. Before we start, do you consent to discussing this incident for the interview? Participant: Yes, go ahead. Interviewer: Could you describe your role and the situation we'll be talking through? Participant: I'm a Product Manager on the onboarding team at CollabHub. We're a B2B collaboration platform, mostly self-serve signups with some sales-assisted accounts that go through the same flow. About five weeks before a board review, we saw a jump in abandonment at account setup, and I had to figure out what to do about it without blowing up the sprint plan or the roadmap we'd already committed to. Interviewer: What first alerted you to it? Participant: Our weekly funnel dashboard. Drop-off at account setup increased 32% over three weeks, which was unusual because upstream traffic and acquisition numbers hadn't shifted. At that stage the dashboard only broke things down at a fairly coarse level, so I could see something had changed but not exactly where in the flow people were leaving. The VP of Product wanted an explanation fast because activation rate is one of the numbers the board tracks closely. Sales was also getting questions in a couple of active deals about whether we had more guided setup options, since that had come up in demos. Engineering had a full sprint already, mostly enterprise bug fixes. Interviewer: What was your objective at that point? Participant: Immediate goal was to understand the cause well enough to act. Longer term, protect activation rate and have something credible to show the board, without pulling engineering off commitments that mattered to existing customers. Interviewer: Walk me through what happened, roughly in order. Participant: First few days were spent figuring out whether the dashboard number was even reliable, then narrowing down where in the funnel people were dropping. Once we had a clearer signal, I had to decide how to respond — that's the piece that took the most judgment. After that came a staffing call, since the response required engineering time we didn't really have spare. Then, closer to the board date, there was a launch decision under time pressure with incomplete testing. Interviewer: Let's start with the first decision — how you investigated. Participant: Right. I had the 32% increase, no user feedback yet, and a note from our analyst that payment-step instrumentation was incomplete. Options were: commission proper interviews, which research said would take two weeks to get sessions running; do a fast internal analytics and heatmap pass; or scan what competitors were doing for quick context. I went with the analytics pass plus a light competitor scan, and deferred interviews. Five weeks isn't much runway once you add design, build, QA, and release, so waiting two weeks just for interviews to start felt like too much of the budget gone before we even had a direction. Interviewer: Any downside to skipping interviews at that stage? Participant: Sure — analytics tells you where people drop, not always why. I flagged that trade-off to the team and kept research on standby in case the data stayed ambiguous. Interviewer: What came out of that analysis? Participant: The sharper signal was abandonment right after the payment-detail field, concentrated in a newer account subgroup — about 140 users. Small, and the cohort had only existed a month, so I wasn't fully confident it was stable. The heatmaps showed some repeated field edits around payment, but because instrumentation there was incomplete, I couldn't tell if that was a validation error or people just backing out. Interviewer: That brings us to the second decision — choosing how to respond. Participant: This was the harder one. I had two things in front of me. On one side, the payment-field signal, real but statistically thin. On the other, our Sales director told me two active enterprise deals had specifically asked, during demos, whether we had a more guided setup experience — not a general market comment, two named accounts with real revenue attached. Around the same time I'd noticed a few competitors had shipped something similar, but that wasn't really what drove the call for me. Interviewer: What did drive it? Participant: Honestly, it was close. The deal-specific requests gave me something concrete to point to — an actual account, an actual objection in a sales cycle — whereas the internal cohort data, while suggestive, was small enough that I didn't want to bet three sprints on it alone. I decided to build the guided setup wizard, partly because of those two deals, partly because I wasn't confident the payment-field fix alone would move the number given how thin the sample was. I'll be honest, if I look back at it, I'm not entirely sure I weighted that correctly — it's possible a more targeted fix would have addressed the real problem faster, or it's possible the deal risk was the right thing to prioritize. I don't think the data gave a clean answer either way. Interviewer: Did you consider testing both directions before committing? Participant: Our analyst suggested a small controlled comparison — one version fixing payment fields, another adding limited guidance — before committing engineering time. I didn't go that route because it would have delayed a decision the deals needed answered, and because I felt the payment data alone wasn't strong enough to anchor the whole response. Interviewer: If those two deals hadn't come up, would you have decided differently? Participant: Probably, yes. Without that pressure I think I'd have leaned toward the payment-field fix first and treated broader onboarding changes as a separate, later initiative. Interviewer: Third decision — staffing. Participant: Building the wizard meant pulling two engineers off the bug backlog for three sprints. That backlog had real enterprise-reported defects sitting in it. Sales wanted the wizard ready to reference in the two deals. I chose full reallocation rather than splitting time or delaying, because a split effort usually means both things ship late and half-tested, in my experience. Interviewer: What followed? Participant: Two of those backlog tickets escalated in severity while the engineers were reassigned. Not an outage, but real friction for those customers. Wizard build stayed on schedule. Follow-up analytics also showed the payment-field friction hadn't changed, which wasn't surprising since we hadn't touched that code. Interviewer: Fourth decision — the launch itself. Participant: Four days before the board meeting, QA had only done partial regression testing, the canary group was too small to read cleanly, and payment abandonment was unchanged. Options were full launch, a longer 10% canary, or a one-week delay for better testing and instrumentation. I chose full launch. A longer canary wouldn't have given us clean results in time, and delaying meant showing up to the board with a plan instead of something shipped. Engineering and QA weren't thrilled, but agreed the risk was manageable with monitoring and a rollback ready. Interviewer: What were the results? Participant: No statistically meaningful change in activation rate versus the prior month, and support tickets kept mentioning the payment step. Not a disaster, but not the fix either. We shifted focus afterward to a proper look at the payment validation and getting the instrumentation gap closed. Interviewer: With two more weeks before the board review, what would you change? Participant: I'd have run that controlled comparison the analyst proposed, and probably gotten a handful of user sessions from the affected cohort before committing three sprints anywhere. Interviewer: What information would have made the second decision clearer at the time? Participant: A larger, stable sample showing payment friction was the dominant cause, or direct evidence from users about why they stopped there. Either would have given me more to weigh against the deal pressure. Interviewer: And if the payment-field data had come from a larger cohort? Participant: I think it would have carried more weight against the deal requests. Hard to say for certain — it's the kind of call where reasonable people could have gone either way with what we actually had."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

