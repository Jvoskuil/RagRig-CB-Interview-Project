# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for sitting down for this. This is a voluntary debrief for our operational learning file, not disciplinary. Can you tell me your role that shift and what the plan was? Participant: Sure. I was Control Room Supervisor on dayshift. We were about five days past a refueling outage, running a scheduled ascension from 45 up to a 75 percent hold point. Standard evolution — controlled rod withdrawals, watching secondary parameters track along. Management wanted us at the hold point that day for a grid commitment, so there was a schedule to keep, but nothing forcing anyone's hand. Turnover wasn't a factor — I was only a few hours into the shift, still had most of it ahead of me. Interviewer: What was your general read on plant status as the shift moved into the middle stretch? Participant: Pretty routine. Ascensions like this usually throw a couple small things at you — nothing alarming, just things worth tracking. That's what happened here. Interviewer: Walk me through the incident as it unfolded. Participant: About two hours in, the reactor operator flagged that feedwater pump 1B's discharge pressure had a slow upward oscillation — vibration monitor ticking up too, still well within the normal band, no alarm. I had him log it and bump up the monitoring interval rather than pulling in the system engineer right away, since nothing was abnormal enough yet to justify an operability call. About forty minutes later, during a rod withdrawal, we got a brief blip in steam generator B's narrow range level — auto control caught it in seconds. Small thing, but two developing items at once gets your attention. I called our on-call reactor engineer, walked him through it, and he said it looked consistent with known control response at that power level. Level stayed stable after that. Then, later in the shift, the pump vibration had crept up again — now sitting in the upper third of its normal band. Still no tech spec limit reached, no alarm. But it had been trending the same direction for a while, and I was pulling together materials for a surveillance test pre-brief due in about forty-five minutes, on top of the ascension schedule. I told the crew to keep it on the standard continue-and-monitor watch we use for that kind of trend, and we carried on toward the next hold point. During the pre-brief itself, the test coordinator asked an unrelated procedural question that happened to touch on the vibration item, and I mentioned it in passing without going into detail. About ninety minutes after that, the pump ended up on a formal close-monitoring action under a tech spec statement — the trend kept climbing. I pulled the historical comparison myself later that shift, once the pre-brief wrapped up. Interviewer: Let's go through that in order. First, the pump reading forty minutes in — what informed logging it and increasing monitoring instead of calling the engineer immediately? Participant: There wasn't much to react to yet — within the band, no real trend history to speak of. Calling the engineer for every early wobble creates noise. Tightening the interval was the right first move; escalate if it keeps climbing. Interviewer: And the level blip — what made you check with the on-call engineer rather than rely on your own read? Participant: Auto control handled it fine, so it wasn't urgent operationally. But two things trending at once during an ascension makes you want a second opinion, especially something with a control-system explanation I wanted verified rather than assumed. Interviewer: Now the point where vibration crossed into the upper third of the band while you were assembling pre-brief materials. What options did you weigh, and what pushed you toward the standard response? Participant: That's the one I've turned over the most. I had three things going — the pump, the pre-brief prep, and the ascension clock. The continue-and-monitor approach is what we've used for trends like this before, and it's worked, so that's the direction I went. Pulling the historical vibration comparison off the plant computer was something I could've done — the data was right there — but between the pre-brief materials and the schedule, it didn't feel necessary in that window. It wasn't that I decided the comparison was pointless, I just didn't work it in. Interviewer: Did you consider holding the ascension until the engineer completed a documented review? Participant: Briefly, but the trend hadn't broken any limit and the checklist response has covered similar-looking situations before. So I went with what I knew rather than stopping to build a fuller comparison right then. Interviewer: How much did the upcoming pre-brief shape that, compared to if nothing else had been due? Participant: Some. When you're building out pre-brief materials and tracking an ascension schedule at the same time, you lean on what's familiar instead of starting fresh on every item. If I'd had a totally open stretch, I probably would've poked at the historical data just out of curiosity. In hindsight, the rate of rise on that trend was a bit different from the earlier cases I was drawing on, but I didn't do the side-by-side to notice that at the time. Interviewer: During the pre-brief, what determined how much you said about the vibration trend? Participant: I mentioned it in passing when the coordinator's question happened to touch on it — kept it brief since it wasn't the topic of that meeting and it was already framed as a monitor-and-continue item in my head. I figured I'd circle back to it once we were done. Interviewer: You mentioned pulling the historical comparison yourself afterward. What prompted that, given there was no handoff forcing your hand? Participant: Once the pre-brief wrapped, it was one of the first things on my list — nobody was waiting on me to hand it off, but it had been nagging at me a bit. The comparison showed the rate of climb didn't quite match the earlier benign cases. Interviewer: If nothing else had been competing for your attention at that moment on the ascension, would you have handled the vibration trend differently? Participant: Probably would've pulled the comparison right then instead of after the pre-brief. Having one clear task instead of two changes what feels worth doing in the moment versus what can wait. Interviewer: If that comparison data had been sitting in front of you right when the trend crossed into the upper third of the band, do you think it would have changed your decision? Participant: Possibly. If it had shown the rate of rise was outside what we'd seen before, I'd have leaned toward holding rather than continuing. But at the time I was working off what had worked previously, not off that specific comparison. Interviewer: What would you tell a newer supervisor about handling a trending-but-not-alarming parameter when something else, even something unrelated, is pulling at your attention? Participant: That divided attention narrows what you actually look at, even without a handoff involved. The item that ends up mattering isn't always the one making noise — sometimes it's the one you've already decided you understand."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

