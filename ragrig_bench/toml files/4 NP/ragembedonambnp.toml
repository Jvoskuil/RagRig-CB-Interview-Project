# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for sitting down with me. This is a routine cognitive task analysis interview — I want to understand how you actually worked through the feedwater heater trend during the ascension test, not evaluate your performance. It'll be de-identified for training and procedure review. Okay with you? Participant: Sure, no problem. Interviewer: Let's start broad. Can you walk me through what you were doing when you first noticed the temperature trend? Participant: We were about three hours into the ascension test, sitting around 90 percent power, working toward a dispatch commitment at end of shift. I was doing my normal rounds on the trend recorders and caught that heater 1B outlet temperature had come up about three degrees over maybe twenty minutes. Train 1A was steady, no alarm, nothing outside our Tech Spec limit. My first thought was that it looked like the calibration deviation we'd had on that sensor last cycle — but I didn't want to just assume that, because I didn't actually remember the details of that event well enough to say it matched. Interviewer: What was going through your head in terms of goals and pressures? Participant: Getting to a hundred percent within the dispatch window, with about two hours of slack at that point. I wasn't rushed, but I was aware of the clock. At the same time, I didn't want to just label the drift and move on without checking whether it actually fit. Interviewer: Let's reconstruct the timeline before we get into the decisions. What happened after you noticed the drift? Participant: I pulled the closed-out fault report from last cycle to compare against what I was seeing. About fifteen minutes later the trend was still creeping, still shallow. Then, maybe forty minutes in total, a maintenance tech on an unrelated walkdown radioed that the 1B heater shell felt warmer than usual on his infrared scanner. I asked him to take a second reading. Shortly after that the trend recorder started flattening as we came up on the final ascension step. Interviewer: Okay, let's go through this decision by decision. First: when you noticed the drift, what alternatives did you actually weigh? Participant: Either treat it as the same calibration issue from last cycle, or treat it as an open question and get an independent check before assuming anything. I ended up somewhere in between — I pulled up the old fault log to see how closely the pattern matched. Interviewer: What did that comparison tell you? Participant: Honestly, it was partial. The timing and the size of the rise were similar. But the rate of onset — how fast it ramped at the very start — wasn't something the old log tracked consistently, so I couldn't really say whether that piece matched or not. I logged it as a probable but unconfirmed recurrence, which felt like the most honest way to write it up given what I had. Interviewer: Did that ambiguity bother you? Participant: A little. I would've liked a cleaner match one way or the other. But I didn't think it was worth pulling I&C off other work for a value that was still well inside limits. Interviewer: Second decision point. The trend kept climbing slightly, and you had a discretionary hold point available to brief the STA before continuing. What went into that call? Participant: That one I thought about for a bit. The STA was right there. Part of me thought, with the comparison being inconclusive, maybe I should just brief him now and let him weigh in. But I also didn't have much to brief him with yet — just an unconfirmed resemblance to an old fault. So I decided to keep trending for a defined stretch, I think I gave it another fifteen minutes in my head, with the idea that either the data would firm up enough to justify a briefing, or it would settle down and not need one. Interviewer: Was the schedule part of that? Participant: A bit, sure. But it wasn't the deciding factor — I genuinely thought waiting a short, bounded amount of time would give me better information either way. Interviewer: Right after that, the technician's infrared call came in. How did you weigh that against the trend recorder? Participant: That's the one where I felt most uncertain. His reading suggested localized heating, which could point to fouling, but it could also just be a warm spot from wherever that drifted sensor sits — I honestly wasn't sure which. The trend recorder showed a smooth rise, which didn't obviously rule either explanation in or out. Rather than pick one, I asked him to take a second reading and tell me what the scan conditions were, since I wanted something to compare against rather than deciding off one data point. Interviewer: What came back? Participant: A similar but not identical reading. He mentioned the scan angle and surface conditions weren't perfectly controlled either time, so even the comparison didn't fully resolve it. At that point I had two data sources that each pointed somewhere, but neither one closed the question. Interviewer: How did you feel about leaving it open like that? Participant: A little uneasy, if I'm honest. Usually you want a cleaner answer before you keep moving. But nothing in front of me demanded an immediate call, so I didn't force one. Interviewer: Last decision point. As you approached the final step to a hundred percent, the trend had started flattening. What led you to proceed? Participant: The flattening helped, but I didn't treat it as proof the earlier question was settled. I still had that inconclusive infrared comparison sitting unresolved. What I did was log it as an open item — wrote it up for the oncoming shift and put in a request for maintenance to follow up — and then proceeded with the step, since there wasn't a procedural or Tech Spec basis to hold at that point. Interviewer: Did you consider holding anyway, just to close out the comparison first? Participant: I did think about it. It came down to whether an unconfirmed field reading, with no limit approached, was enough reason to interrupt a scheduled step. I decided documenting it and handing it off was the more defensible path, but I won't pretend that was the only reasonable call. Interviewer: What single piece of information would have changed that decision? Participant: If the repeat scan had come back clean and consistent — clearly showing localized heating with good scan conditions both times — I think I would've held and gotten the STA involved before the final step. Interviewer: And if the trend had kept climbing instead of flattening? Participant: Then the flattening wouldn't have been there to lean on, and I think the open item alone would've been enough to justify a hold. Interviewer: Looking back, is there a point where you wish you'd had better information, even if the decision felt reasonable at the time? Participant: The infrared piece, definitely. I'd have liked a way to get a controlled comparison reading rather than two scans taken under different conditions. That's really where most of my uncertainty sat the whole time. Interviewer: One last thing for the record, unrelated to how you reasoned through it at the time — a maintenance work order filed after your shift ended found early-stage fouling on the 1B heater, separate from the old calibration issue. That wasn't information you had available during the ascension, so I'm just noting it for the file. Participant: Understood — that's good to have documented either way. Interviewer: That's really helpful, thank you."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
# deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

