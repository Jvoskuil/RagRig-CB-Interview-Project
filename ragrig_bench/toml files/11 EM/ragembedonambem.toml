# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for taking the time. Just to confirm, you're okay with this being recorded for after-action training purposes only, not for any personnel review? Participant: Yeah, that's fine. Interviewer: Can you describe your role and what you were responsible for when this incident began? Participant: I'm the Situation Unit Analyst for the county EOC. During an activation, I build and maintain the Common Operating Picture — pulling together field reports, gauge data, weather updates, whatever's coming in — and I turn that into something the Branch Directors can actually act on. That night I was covering the flood side while also keeping half an eye on the fire branch, since Ridge Fire was still active and was interfering with some of our sensor and repeater coverage. Interviewer: Walk me through how the incident began. Participant: Around 9 PM we got a notice from the Twin Forks Reservoir Authority about a release tied to the incoming storm cell. The wording was pretty standard operational language — not alarmist, but not something I'd call reassuring either. Our downstream gauges were showing a gradual rise at that point, nothing that clearly told you how big this was going to get. The duty hydrologist was tied up on another call for at least ninety minutes, so I didn't have a technical read to lean on. Our flood Branch Director looked at it and said the pattern looked similar to releases he'd seen before, but he also flagged that the rainfall forecast for this particular storm cell was less certain than in past events — he wasn't fully reassuring, just giving me his honest read on both sides of it. Interviewer: What did you do with that information? Participant: I went with a monitor-and-prepare advisory rather than an immediate warning. It wasn't really one factor — it was the gradual gauge trend, the Director's qualified take, and the fact that jumping straight to a warning without more to go on has its own costs, in terms of credibility and resource strain if it turns out to be nothing. I documented specific thresholds that would trigger an upgrade if the gauges moved past them, so it wasn't an open-ended wait. Interviewer: Did you consider seeking independent verification before finalizing that? Participant: I did think about it, but with the hydrologist unavailable, the choice was really between acting on the best synthesis I had or delaying any messaging at all, which carries its own risk. I weighed the Director's read alongside the actual gauge numbers rather than just taking his word for it. Interviewer: What happened next? Participant: About ninety minutes later, the gauges spiked much faster than the early trend had suggested. The release turned out to be larger than what the gradual rise had implied. Interviewer: Let's talk about the resource decision that followed. Participant: Our field liaison started getting scattered water-rescue calls in two sub-neighborhoods, but the call intervals were irregular — hard to say if that was tapering off or about to surge. Around the same time, the weather service bumped up their estimate of how long the storm cell would sit over us, and a neighboring jurisdiction let us know their swift-water assets were available on a limited-time mutual-aid hold. Interviewer: How did you decide what to request? Participant: I went with a staged tier-2 mobilization instead of matching the confirmed calls exactly or going straight to tier-3. Part of it was the call pattern being ambiguous, part of it was the extended storm estimate, and part of it was that mutual-aid window — if I waited and needed more later, those assets might not be there. None of those three things alone would've pushed me to tier-2, but together they did. Interviewer: Was there a specific past incident that shaped that call? Participant: Not really one specific case I was drawing on. It was more just weighing what was in front of me that shift. Interviewer: How did that play out? Participant: Calls plateaued at a level that, looking back, either tier-1 or tier-2 could've handled. Some of the mutual-aid assets got used, some stayed in reserve. Hard to say in hindsight whether tier-1 would've been enough or whether we got lucky with tier-2. Interviewer: Let's move to the evacuation decision. Participant: This was the hardest one. Six of eight gauges were down from repeater damage tied to the Ridge Fire smoke, so I only had two reporting, both rising sharply over about twenty minutes. We do have a contingency protocol for this — when network coverage drops below half, there's a default evacuation radius around any gauge that crosses threshold. Field spotters were also seeing street flooding near one of the two working gauges, though nothing yet from the other sub-zones. Interviewer: How did you apply that? Participant: I followed the protocol and expanded evacuation to the zones adjacent to those two gauges. I was explicit with the team that the radius is a policy compromise — it's not a claim that we know what's happening in the unmonitored zones, it's just the standard response when coverage is this degraded. I didn't feel like I had enough to justify going wider than the protocol called for, and I also didn't think it was responsible to wait for full confirmation given the rate of rise. Interviewer: Did you weigh expanding further than the protocol specified? Participant: I considered it, honestly. Two gauges isn't much of the network. But going beyond what the protocol lays out felt like it would've been guessing past the point where I had a documented basis for the call. Interviewer: What came out of that? Participant: When backup gauges came back later, the adjacent zones matched the protocol's assumptions in some spots and not others. So it's genuinely mixed — the protocol got some of it right and missed some of it. Interviewer: Let's talk about the hot-wash review of the initial advisory decision. Participant: We used our standard after-action template, which forces you to separate what was known at the time from what's known now. Going through it point by point, some parts of the original advisory call still look reasonable to me given the gradual trend and the Director's qualified comment. Other parts — like the uncertain storm-duration forecast — in hindsight, maybe should've pushed us toward an earlier tier upgrade. It's not a clean verdict either way. Interviewer: Do you think the outcome makes that decision look worse than it actually was? Participant: That's the tension the template is designed to catch. I try to ask what a reasonable person would've concluded with only the 9 PM information, not what's obvious now that we know the release was bigger than expected. Some of it holds up under that test, some of it doesn't. Interviewer: If the dam operator's notice had used clearly urgent language instead of standard language, would your initial call have changed? Participant: Possibly, but it wouldn't have been the only thing driving it — I'd still have been weighing the actual gauge trend and the Director's forecast concerns alongside it. Interviewer: And if all eight gauges had stayed online through the evacuation decision? Participant: I'd have had a fuller picture to work with, which might have let us tighten or widen the radius with more confidence either way. Hard to say which direction it would've gone. Interviewer: Looking back, how do you separate what was knowable in the moment from what only became clear afterward? Participant: I lean on the template for that specifically, because otherwise it's easy to let the outcome color your memory of how clear things actually were at 9 PM. Some calls hold up, some don't, and I try not to flatten that into a single before-and-after story either way. Interviewer: That's a good place to stop. Thanks for walking through this. Participant: No problem."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

