# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, I want to confirm this is a routine debrief on your reasoning process during the Copper Creek event, not a performance review. Nothing here affects your evaluation. Are you okay proceeding on that basis? Participant: Yeah, that's fine. I've done these debriefs before. Interviewer: Great. Can you start by describing your role on the desk that shift? Participant: I'm the meteorological hazard forecaster for the ESF-2/ESF-5 desk at the state EOC. My job is basically to translate NWS and SPC guidance into activation-level recommendations, warning products, and messaging calls for the counties in our basin. I coordinate with the WFO, the county EMs, and on multi-state events, with neighboring forecast desks. Interviewer: Walk me through this particular incident from the start. Participant: It started overnight with SPC flagging a marginal severe risk for the basin, low confidence, mostly because guidance was still sparse. By the 06Z cycle we only had four members of the convection-allowing ensemble finished — the rest were still running. Three of those four showed the cluster intensifying fast over the basin within about three hours. That got my attention because it lined up with what SPC's mesoscale discussion was hinting at. I made the call to push an early watch-to-warning upgrade based on that signal rather than wait for the fuller 09Z set. A couple hours later, radar showed a hook-shaped reflectivity signature that looked almost identical to an event I'd forecasted successfully a couple seasons back — same kind of setup, similar CAPE and shear profile. I was fairly confident about the track and timing at that point. Then flash flood guidance started trending up in two of our sub-watersheds, and I wanted to escalate the EOC activation level and get swift-water teams moving, since they need about 45 minutes lead time. But the regional director called and told the desk to hold pending review. Later, on the interstate coordination call, most of the neighboring jurisdictions said they were holding their alert levels too, so we ended up staying at the same level even though our local numbers kept climbing. Flooding started in one of our communities about fifty minutes after that call ended. Interviewer: Let's reconstruct the sequence a bit more precisely. What did you have in front of you at each stage, and what were you still waiting on? Participant: At the start, just the partial ensemble and the SPC discussion — no radar-observed rotation or flood-guidance exceedance yet. Then the radar signature came in, which added a qualitative cue on top of the model data. After that, the guidance numbers started climbing, which was the first hard hydrologic evidence. And finally, the coordination call added the social layer — what everyone else on the basin was doing. Interviewer: Let's go through the four moments where you had to make a call. First: the early upgrade decision. What were the alternatives you weighed? Participant: I could've upgraded early, held until the 09Z cycle with the bigger ensemble, or done a limited advisory just for the highest-confidence sub-area. I went with the early upgrade. Interviewer: What tipped it? Participant: Three of the four members agreeing was a strong signal to me. When you get that kind of consistency across model runs, it usually means something real is going on with the pattern. Interviewer: Did the size of that ensemble — four members — factor into how much weight you gave it? Participant: Not really, no. I mean, agreement is agreement. If three separate runs are telling you the same intensification story, that's meaningful regardless of how many total members happened to finish by that hour. Interviewer: And the SPC discussion's confidence language? Participant: They flagged it as low confidence given how limited the guidance still was, and that's part of why I kept an eye on the fuller ensemble coming in later at 09Z. But in the moment, the three-of-four agreement itself still read as a real signal to me. Interviewer: Second decision — the radar signature and the track call. What made you settle on one track over maintaining both possibilities? Participant: Honestly, the moment I saw that hook signature, it just clicked. I'd seen that exact shape develop the same way before, and it played out almost identically that time — same track, same timing window. I didn't feel like I needed to keep hedging between two tracks once I recognized the pattern. Interviewer: Did you check that recognition against anything, like requesting the WFO's independent read before committing? Participant: I didn't loop them in before committing, no. It felt clear enough on its own. Turned out the WFO desk was independently tracking a similar dual-track possibility, and the storm's actual path drifted a bit from what I'd called. Interviewer: How confident were you in the moment, on a scale of how sure you'd normally be? Participant: Pretty high, honestly — nine out of ten maybe. It looked so much like that prior case that I didn't see much reason to hedge. Interviewer: Third decision point — the activation-level call after the director's instruction. What was your read going in? Participant: My read was that guidance exceedance was climbing in two sub-watersheds and we should escalate and get swift-water teams moving given the lead time they need. Then the director called and said hold pending review, no new data attached to that, just a directive. Interviewer: What did you do? Participant: I held. He's the one with sign-off authority on activation level changes, so when he says hold, that's generally the end of the discussion on my end. Interviewer: Could you have presented the sub-watershed exceedance numbers to him and asked him to reconsider, or logged a formal escalation recommendation for the record? Participant: I could have — there's a process for flagging a disagreement or requesting reconsideration. I just didn't go that route. Once he'd made the call, it felt like his read of the situation was enough to settle it, so I didn't walk him through the trending numbers or push back on the hold. Interviewer: Was there a technical case for holding at that moment, independent of the instruction? Participant: Not that I put together myself, no. He asked afterward for a written justification for the hold, and I had to go back and construct one after the fact. Interviewer: Fourth decision — the coordination call and public messaging. Participant: Going into that call, my own numbers favored escalating messaging and issuing a WEA. But three of the four neighboring jurisdictions said they were holding steady, and it just felt safer to stay aligned with that rather than break from the group on my own. Interviewer: Even though your local guidance had worsened since the director's hold? Participant: Right, it had ticked up further. But when the majority of the desks on the call are holding, going a different direction on your own feels like it needs more justification than staying with the group does. Interviewer: What happened afterward? Participant: Flooding started in one of our towns about fifty minutes later. One of the neighboring jurisdictions ended up escalating on their own shortly after, citing their local data. Interviewer: If the fuller ensemble set had been available from the very start, do you think the early upgrade call would have gone differently? Participant: Maybe — if the signal had been muddier across more members I might have waited. But I don't think I would have weighted it much differently than I did. Interviewer: If the director's call hadn't come in at that third decision point, what would you have done? Participant: I probably would have pushed the escalation through myself. It was really his instruction that changed my course there. Interviewer: Looking back, with exactly the same information you had at each point, what would you do differently? Participant: I'd probably slow down at the radar-signature moment and get a second set of eyes before locking onto one track. And on the coordination call, I'd try to separate what our own numbers were saying from what everyone else on the call was doing before deciding. Interviewer: That's helpful. Thanks for walking through it in this much detail."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

