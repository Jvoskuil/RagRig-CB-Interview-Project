# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for sitting down with me. As discussed, this is for our post-incident learning review, not a disciplinary process — I want to understand how you saw and processed the situation as it developed. Anything you share stays within the review process. You good to start? Participant: Yeah, that's fine. Happy to walk through it. Interviewer: Great. Can you tell me your role and a bit about your background before we get into the incident itself? Participant: I'm the on-shift Incident Commander for the site brigade — I've been in this role about six years, twelve years on the brigade total. Mostly hydrocarbon and solvent handling areas, so tank farm fires aren't unfamiliar to me. Interviewer: Good. So walk me through what you saw and were told when you arrived on scene. Participant: Control room paged it as a flammable liquid tank fire in the solvent storage area, described as contained, dark smoke visible. When I pulled up, I had a heavy black column coming off one of the four tanks in the bunded area. Wind was light, shifting a bit, not pushing smoke hard in any one direction. Visually it looked almost identical to a fire we had three years back in the same general area — same kind of column, same rough intensity. That one we knocked down clean with an offensive foam attack, crews in with exposure lines, no real drama. So my first read was, this looks like that one. Interviewer: What was your main objective at that point? Participant: Get the fire knocked down before it could threaten the second tank or the production building next door, and do it without losing anybody. Standard priorities — life safety, then stabilize, then protect property. Interviewer: And the manifest — did you know exactly what was burning? Participant: Not confirmed yet, no. Four tanks in that bund, different products, and hazmat hadn't given me a firm ID. But the call came through as contained, and visually it read the same as the one I already knew how to fight, so I went with what I had. Honestly, hearing it called contained made it sound like it was staying inside the kind of tank fire we handle all the time — so getting the manifest nailed down didn't feel like something I had to sort out before we started moving lines in. Interviewer: Let's reconstruct the sequence phase by phase. What happened right after you made that initial call? Participant: I committed two crews in with foam lines and set exposure protection on the neighboring tank. Shortly after that, hazmat got on scene and told me the burning tank actually held a more volatile mix than the one from that earlier fire — different product entirely, just looked similar from the outside. By then the lines were already in and crews were positioned close, maybe fifteen meters off the shell. Interviewer: How did that change your read of the situation? Participant: It should have, and it registered, but we were already committed at that point. Pulling two charged lines and repositioning crews mid-attack isn't something you do lightly — there's real risk in that movement itself. So the plan stayed as it was; we didn't stop and rebuild the IAP around the new information, we just kept pushing the attack we'd already started. Interviewer: Let's stay on that moment. What options did you actually weigh once you had the shell temperature alarms rising? Participant: Either pull back to a defensive perimeter and go to unmanned monitors, or hold position and add a second foam line for more knockdown. We'd only really sat down and reviewed the plan once, right at the start. Nothing after that forced a formal stop-and-reassess — no single trigger big enough on its own — so we just kept executing what we'd already briefed. Looking back, the volatile-product call and the climbing temperature together probably should have been enough to warrant a fresh look, but since nobody formally called for a stop, we treated that as reason enough to keep running with the plan we already had. Interviewer: What told you to add the second line rather than withdraw? Participant: Partly the alarms themselves, wanting more suppression on the seat of the fire. But honestly, part of it was that we already had people and hose in position — pulling that back felt like giving up ground we'd already paid for in terms of setup time and risk getting in. Interviewer: Understood. Let's move to the next phase. What was happening on the radio and at your command post around this time? Participant: The mutual aid engine companies were on our shared channel, and a couple of their officers came on saying it looked like a standard tank fire, keep pushing the interior attack. Multiple voices, same read. At the post, our safety officer raised a concern about how close our crews were sitting relative to the second tank's exposure. We talked about it for maybe a minute. Interviewer: How was that concern handled? Participant: We acknowledged it, but the room moved fast — everybody sort of nodded that we were fine to continue, and we didn't really dig into it past that. It wasn't dismissed outright, it just didn't get a long conversation before we moved on. Interviewer: Once the group had nodded along, did anyone go back and test the safety officer's concern more directly? Participant: Not really. Nobody asked him to lay out specifically what he was seeing or walk us through why he thought the exposure risk was higher than we'd assessed. No one was assigned to argue the other side or double-check it. Once the room had settled on continuing, it just didn't come back up. Interviewer: Did the mutual aid officers' agreement factor into your decision? Participant: Yeah, some. When you've got multiple experienced officers on the net independently saying the same thing, that carries weight. It reinforced that we were reading the incident the way most people out there were reading it. Interviewer: What came in right after that? Participant: A relief crew came off shift and mentioned they thought they saw the second tank shell bulging slightly, maybe some vibration. Nothing measured, just an observation. Interviewer: Let's go to the final phase. What did the data look like as you approached the withdrawal decision? Participant: We'd had a shell temperature trend on that second tank climbing steadily for about twenty minutes, radioed in multiple times, consistent rise. Then right at the point where I was deciding whether to call full withdrawal, a spotter came on and said it looked stable now, based on a quick visual check. Interviewer: How did you weigh those two things against each other? Participant: The spotter's call was the most current thing I had in my ear at that exact moment, so it carried real weight in the decision. I held off on ordering the full pull-back a bit longer than the trend alone probably would have justified, because that last report suggested things had settled. Interviewer: How confident were you in that spotter's assessment versus the trend data? Participant: Reasonably — he's experienced, and a visual read from someone right there has value the instruments don't always capture. But looking back, that trend had been consistent for twenty minutes, and one quick look doesn't necessarily overturn that. Interviewer: What ended up happening? Participant: The tank vented on its own, no rupture, nobody hurt. Fire was knocked down maybe forty minutes after that. Could've gone worse; can't say for certain the timing of withdrawal is what mattered most. Interviewer: Looking back, if the hazmat report on tank contents had come in before you committed crews, would your first call have gone differently? Participant: Possibly — I might have held the lines back until we confirmed exactly what we were dealing with rather than moving straight to the offensive attack. Interviewer: And if the mutual aid officers on the net had been split or silent at that middle phase, do you think the outcome there changes? Participant: Maybe. Without that agreement, the safety officer's point might have gotten more airtime, and we might've paused longer before continuing. Interviewer: Last one — what single piece of information do you wish had carried more weight at the very end? Participant: The twenty-minute trend, honestly. It was right there the whole time. I let one fresh comment outweigh a much longer pattern that had already told a consistent story. Interviewer: Appreciate you walking through all of that in detail. Participant: No problem. It's useful to go back over it like this."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

