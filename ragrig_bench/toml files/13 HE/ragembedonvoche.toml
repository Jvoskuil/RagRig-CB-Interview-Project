# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for talking with me. This is for a plan-review case study, it's voluntary, and you can skip anything you'd rather not go into. Can you tell me about your role and how the Meridian Tower conversion came to you? Participant: Happy to. I'm a plan review official in the building and fire division—permitting and life-safety sign-off, mainly. Meridian Tower was an adaptive reuse, a 22-story former office tower going to mixed-use residential and retail. The complication was the atrium, a large central void running most of the building height. It didn't fit the prescriptive smoke control provisions in our code, so the design team came in with a performance-based alternative instead. Interviewer: What was your objective going in? Participant: Get the review done correctly within our statutory window. We had a 30-day clock, the department was short-staffed that quarter, and there was pressure from the city to keep housing projects moving. All of that mattered, but the core job was still making sure the building would actually perform the way the code intends if there's a fire. Interviewer: Walk me through what happened, from the start. Participant: The engineer of record was Halkirk & Vance, a regional firm with a lot of atrium experience—dozens of approved performance-based designs, and a neighboring jurisdiction had approved something similar from them the year before. They submitted a CFD-based smoke control model in place of the prescriptive system. We didn't have budget for an outside peer review that cycle, so I went through the documentation myself. One assumption stood out—how the model handled stack effect if a door were left partially open during an event—and I wasn't satisfied it was addressed clearly enough, so I sent that back to them in writing before finalizing anything. After that we moved into commissioning planning, where we had to choose between two verification protocols. Construction got underway, and about six weeks in, our inspector flagged fire-rated door deficiencies on three floors. Later, as we were approaching occupancy, the developer requested an early certificate before full integration testing was complete. Near the end of construction there was a small trash-chute fire—sprinklers handled it, no injuries—which led us to take another look at the atrium system, though it turned out to be a separate issue. Interviewer: Let's put the order together more precisely. What did you know before the first major decision, and what came in after? Participant: Before approving the design, I had the CFD report, the firm's general track record, and the neighboring jurisdiction's approval. After I sent back the question on the stack-effect assumption, they responded with additional documentation, and I approved based on that exchange. Then came the commissioning protocol decision. After that, construction started, and the door issue came up. The occupancy request was near the end, and the trash-chute fire happened after that decision was made, not before. Interviewer: Let's take the first decision—approving the performance-based design. What carried the most weight? Participant: The firm's documentation carried real weight, and so did the neighboring jurisdiction's approval—that told me the overall modeling approach had held up under scrutiny elsewhere. But I still went through the assumptions myself, and the stack-effect piece wasn't fully addressed for our specific geometry. I asked for a written clarification on that point specifically rather than taking the package at face value or sending the whole thing out for a full outside review, which would have added about three weeks. Interviewer: Was a full peer review ever seriously on the table? Participant: It was one of the options, yes. I decided a targeted clarification on the one assumption that mattered most for egress got me most of the benefit without the full delay. Interviewer: Second decision—the commissioning protocol. What were you weighing? Participant: Two options. Option A was a newer risk-informed test, better matched to this atrium's geometry according to the guidance, but its thresholds were only partly and qualitatively defined. Option B was the older prescriptive smoke test—clean binary pass-fail, but less sensitive to some of the failure modes this atrium could actually have. Interviewer: Which did you choose, and why? Participant: Option A, but not without addressing the enforcement problem. I built in defined interim checkpoints and documentation standards so the qualitative thresholds would still be auditable if anyone questioned the sign-off later. I didn't want to trade technical fit for administrative convenience, but I also didn't want a protocol I couldn't defend. Interviewer: Third decision—the door deficiencies. What did you see, and how did you respond? Participant: The inspector found bad fire-door installations on floors 8, 11, and 14. My first instinct was to wonder if we had a specific crew problem. But crews were rotated randomly across the building, and it was three deficiencies out of roughly 150 doors checked at that point—which is within the range you'd expect from ordinary variation on a project this size. So I kept the original random-sample inspection plan across all floors rather than concentrating just on those three. Interviewer: What did the rest of the inspection show? Participant: The building-wide sample came back with a defect rate consistent with what we'd already seen—nothing suggesting those three floors were actually worse than the rest. Interviewer: Fourth decision—the temporary occupancy request. What was your basis? Participant: The developer had a financing deadline, and full integration testing on the alarm and smoke systems was still about three weeks out. The contractor had a good record on other city jobs, and a colleague mentioned a nearby building that had gotten early partial occupancy without incident. But our own five-year data show something like a 15 percent rework rate on these atrium integration tests citywide, and that number is specific to the exact system we hadn't tested yet. So I granted occupancy only for the floors that didn't depend on the untested atrium system, and held back the rest until testing was done. Interviewer: What would have made you grant broader occupancy at that point? Participant: A completed, passed integration test, basically. Nothing short of that for the floors relying on that system. Interviewer: How much uncertainty did you feel across these decisions? Participant: Fairly consistent, honestly. The door situation had some ambiguity until the wider sample came back. The occupancy call had the most riding on it, which is part of why I drew the line where I did rather than treating the contractor's general history as settling the question. Interviewer: Looking back now, after the trash-chute fire, how do you view the original design approval? Participant: It held up fine, as it turned out—the fire was in the chute enclosure, unrelated to the atrium system. If anything, it reinforced that the clarification I'd asked for on the stack-effect assumption was worth pursuing at the time, though I wouldn't say the fire proved anything either way about that decision. Interviewer: If you had to make the temporary occupancy call again with the same information, would you do anything differently? Participant: No, I think I'd draw the same line. The rework rate was too specific to ignore just because of a good general track record elsewhere. Interviewer: Last question—what would you tell a newer reviewer facing a similar submittal? Participant: Don't let a strong firm's name stand in for checking the one assumption that actually matters for your building, and don't let a small pattern in early data override what a proper sample tells you."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

