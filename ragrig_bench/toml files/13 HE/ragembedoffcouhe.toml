# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for sitting down with me. As before, this is about understanding your reasoning process during the Stope 14-East event, not evaluating the outcome. Alright to continue? Participant: Yes, fine. Interviewer: Can you set the scene — your role, and what you were working toward that shift? Participant: I'm the Health and Safety Officer, dayshift. My job that day was mostly routine oversight of active headings, including Stope 14-East, a longhole stope. One thing that was a bit different from a typical week was that our tonnage target had just been reset to a weekly figure rather than a shift figure, so there wasn't the usual same-day scramble hanging over us. That gave us a bit more room to breathe on scheduling, in theory. Interviewer: Walk me through what happened when you first heard about the noise. Participant: Around 06:40 a miner radioed in saying he'd heard intermittent cracking, kind of a popping sound, in the back of 14-East. No alarm had tripped on the microseismic array at that point. Even with the weekly target giving us some slack, my first thought went straight to the rockburst at our sister operation two months back — that made the trade press, and it was still something everyone on site talked about. The conditions weren't identical, but same ore body region, and it was vivid enough that I treated the report as more likely to be heading toward something serious than the instruments alone would have suggested. Interviewer: What alternatives did you weigh at that point? Participant: Full evacuation and stop-work pending geotech, enhanced monitoring with limited access, or just getting the instrument tech to check readings first. I went with enhanced monitoring and limited access. The instruments weren't flagging anything, but that sister-mine memory carried a lot of weight for me regardless of what the schedule looked like that day. Interviewer: Let's move to the extensometer readings later that morning. Participant: The 05:00 baseline was 0.2mm, our normal quiet reading. By 09:40 it had moved to 0.6mm — three times the baseline in about three hours. I looked at that and thought, well, compared to this morning, it's still a small number. I didn't go back to the GCMP's rate-of-change table, which is actually how you're supposed to judge it — the plan cares about the speed of movement, not just where it sits against an earlier point. Looking back, I was using the wrong reference. Interviewer: What information, if you'd had it in front of you right then, would have changed that call? Participant: If the rate-of-change figure had been sitting right next to the raw number, I think I'd have caught it. As it was, all I had was two numbers from two different times, and comparing them felt natural. Interviewer: Did the weekly target play into that decision at all? Participant: Honestly, not much. There wasn't pressure to rush a call because production wasn't riding on that hour. It was more just how I read the two numbers side by side. Interviewer: Tell me about the conversation with your shift supervisor. Participant: About an hour later. He's got twenty-two years underground, most of it here. He mentioned hearing similar popping back in 2009 that came to nothing, and he was confident this was the same kind of thing. Around then the microseismic count for the shift had actually climbed to six events an hour, just over our flag threshold of five. I didn't really push on whether the 2009 case matched today's rock type or blast pattern. His track record carried a lot of weight for me in that moment. Interviewer: You also looked at a crack in that panel — can you describe that? Participant: There was a hairline crack, about a millimeter, photographed and logged the week before as insignificant. Today's crack looked about the same width to me, so I read it as consistent with what we already knew was fine. What I didn't do was connect it to the seismic count that had just crossed the threshold — I was judging the crack against the old photo instead of against the newer number. Interviewer: What alternatives did you consider before allowing continued access? Participant: Follow the seismic threshold strictly and hold the stope for engineer sign-off, reduce crew size as a middle path, or trust the supervisor's read and continue with limited crew. I went with limited access, mostly on his confidence and my own read of the crack photo. Interviewer: Given that production wasn't due until end of week, did that change how you approached this call? Participant: Not really — there wasn't an obvious reason to hurry one way or the other. It felt more like I was weighing the supervisor's experience and that photo comparison on their own terms. Interviewer: What happened after that? Participant: The engineer eventually called back wanting the full event log, and around the same time someone noticed a second, wider crack near the first. Then at 13:15 we had a minor spall — no injuries, some equipment damage. Shift change had happened about ninety minutes earlier. Interviewer: When you wrote the incident report, how did you land on the causes? Participant: Putting it together — the overnight temperature drop, the shift change not long before, and the blasting in the next panel the previous week — it read as a pretty clean explanation: cooling stress plus the handover timing plus residual vibration from that blast. That's what I put forward as the account, even though the engineer's later note said several factors were plausible and none could be confirmed as dominant. Interviewer: And how did you frame responsibility? Participant: I focused mainly on the miner who first reported the sounds and didn't flag it again once the popping continued — I felt if he'd called it in a second time, we might have caught it sooner. I did mention the missing engineer sign-off after the six-events flag, but it came across more as a process note than a central cause. Interviewer: If the sister-mine rockburst had never happened, would your first call have gone differently? Participant: Probably. Without that fresh in mind, I think I'd have waited on the instrument tech's check before doing anything. Interviewer: If a less experienced supervisor had said the same thing about 2009, would you have weighted it the same way? Participant: No, I don't think so. His years underground were a big part of why I trusted the read. Interviewer: Last one — how confident are you now that the causes in the report were the real ones? Participant: Less than when I wrote it. It felt like a complete picture at the time, but there were threads I didn't fully chase down."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

