# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. This is for our instructional practice research and will be kept confidential. Can you start by telling me your role and how the Bridge Literacy pilot came about? Participant: Sure. I'm the Curriculum Coordinator for K-5, and I also run our instructional coaching cycle across the elementary buildings. I brought Bridge Literacy in after seeing it presented at a state conference last spring. It's a structured literacy approach, more explicit phonics sequencing than what we'd been using. I pitched it to the superintendent, and we set it up as a trimester pilot in six classrooms across our two elementary schools. Interviewer: And what were you trying to accomplish with the checkpoint review you did partway through? Participant: The board needed a scale-up recommendation before the next budget cycle, so I had to look at the trimester oral reading fluency benchmark data, figure out if the pilot was working, and decide what to tell the finance committee. There's real competition for dollars — the math intervention team wants the same PD budget — so whatever I brought needed to hold up under questions. Interviewer: Walk me through what happened when the data actually came in. Participant: The literacy specialist sent me the classroom-level fluency results in early February. Three classrooms were clearly above the expected growth rate, three were flat or mixed. Before I drew any conclusions, I asked her to check something that had been bothering me — the two schools had administered the benchmark on different days because of a scheduling conflict, and I wanted to know whether that gap could be distorting results anywhere, not just in the classrooms that happened to come in flat. Interviewer: Why did you want it checked across all six rather than just the ones that looked off? Participant: Because the scheduling issue wasn't specific to any classroom — it applied to the testing window generally. If I only went looking for problems in the rooms with disappointing numbers, I'd have no way of knowing whether the same issue was quietly present in the rooms that looked fine. It seemed like the only fair way to trust the comparison. Interviewer: What did you learn afterward? Participant: The specialist came back about a week later and said testing conditions were actually pretty similar across all six classrooms — the day-to-day difference wasn't significant. Separately, she found that one flat classroom had unusually high absenteeism that same week, which probably explained more of that particular result than timing did. Interviewer: What alternatives did you weigh before deciding how to handle the review? Participant: I could have just accepted the gain classrooms and focused all my attention on explaining away the flat ones. Or waited entirely until a full audit was done before forming any impression. I went with checking everything at once instead, mostly because I didn't want to end up defending a number in front of the board that I hadn't actually stress-tested. Interviewer: Let's move to the board meeting prep. What did that involve? Participant: I had fifteen minutes on the agenda, and the math team was presenting right after me. I had the full six-classroom data set plus a walkthrough-observation log the specialist and I had been keeping. I decided to bring a highlights slide with the aggregate trend line rather than all six classrooms individually — mostly a time issue. Fifteen minutes isn't enough to walk through six separate data profiles and still leave room for questions. Interviewer: Any consequence from that choice? Participant: One board member asked for classroom-by-classroom detail I hadn't put on the slide. I had it on hand, just not formatted for presentation, so I was able to answer, but I was working from memory a bit more than I'd have liked. Interviewer: Around the same time, you had PD feedback to review. What did that look like? Participant: Five of six pilot teachers filled out a survey after the coaching session, rated it helpful or very helpful. One comment mentioned the pacing guide felt rushed for lower-performing students. It's a small sample and it was voluntary, so I noted that caveat when I summarized it — I didn't want to present five responses as if that settled anything about how teachers overall felt. Interviewer: Did you follow up on the teacher who didn't respond? Participant: Not immediately. The specialist later mentioned the one non-response was from a teacher in a flat classroom, which made me wonder whether we were hearing a slightly rosier picture than the full group would give. I flagged that as a limitation in the write-up rather than treating the survey as representative. Interviewer: Let's get to the recommendation memo. How did you explain the fluency gains? Participant: The aggregate number was a modest net gain across all six classrooms. I'd been doing biweekly coaching visits in four of the six rooms, and those classrooms also had new decodable-text materials and, in a couple of cases, smaller class sizes than our typical rosters. When I wrote the memo, I tried to lay out all of that together rather than pointing to one piece — coaching, materials, and class size were all present at the same time in the classrooms that improved most. Interviewer: What about the two classrooms that improved without your direct coaching visits? Participant: That was actually one of the more useful data points. Those two rooms had the new materials too, and one of them had a smaller roster, so it suggested the materials and class-size piece might be doing real work independent of coaching. I included that in the memo as a reason to be cautious about crediting coaching alone. Interviewer: A board member raised a related point, is that right? Participant: Right, someone asked directly how those two classrooms improved without my visits. I said that was exactly why I was recommending a staged approach — bring in the materials and coaching together in a next round, but track classrooms with and without direct coaching support separately so we can actually see what's carrying the result before committing to a full districtwide coaching build-out. Interviewer: What would have needed to be different for you to weight one factor more heavily than the others? Participant: Probably a design where coaching, materials, and class size weren't all bundled together in the same rooms. Right now they move together, so I don't think the data lets anyone single one out with confidence. I said as much in the memo. Interviewer: If someone else had gotten these same results without your involvement, how do you think they'd have explained the gains? Participant: Probably about the same way I did — pointing at materials, class size, and coaching together, since all three were present. I don't think my being the one running the coaching changes what the data can and can't support. Interviewer: And if the classrooms that struggled had been the ones you were personally coaching, do you think your review process would have looked any different? Participant: I don't think so. I'd still have wanted the testing conditions checked everywhere before drawing conclusions — that part wasn't really about which rooms I was in. Interviewer: Looking back, what would you do differently if you ran this checkpoint again? Participant: I'd try to get the specialist's testing-condition review done earlier, before the board deadline was quite so close, so I'm not doing that verification under quite as much time pressure. And if we run another round of the pilot, I'd try to stagger which classrooms get coaching versus materials only, so the next causal story isn't as tangled as this one. Interviewer: That's really helpful context. Thank you for walking through this in detail."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

