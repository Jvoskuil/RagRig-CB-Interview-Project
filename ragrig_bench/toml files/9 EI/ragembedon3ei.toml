# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Before we begin, do I have your consent to discuss a past case in a way that does not identify the student, family, school, or sending program? Participant: Yes, that is fine. Interviewer: Please describe your role at the time. Participant: I was the special education caseworker and IEP Coordinator for an elementary building. I carried about 42 active IEPs, coordinated meetings, drafted present levels of performance, tracked compliance timelines, and worked with the school psychologist and classroom teams when a student transferred in. This case involved a student who arrived mid-year from an out-of-district specialized program. We had ten school days to establish an interim placement and services. Interviewer: What was the main objective? Participant: We needed a legally compliant interim IEP that gave the student access to instruction right away, identified an appropriate least restrictive environment, and gave the classroom team enough structure to begin. The challenge was that the records came in pieces. The parent expected a real decision at the interim meeting, but we did not yet have a full picture. Interviewer: Walk me through what happened from the transfer notice to the meeting. Participant: The registrar notified us late on a Thursday that the student would start the following Monday. The transfer summary said the student came from a program serving students with significant emotional and behavioral needs. We had a short IEP excerpt, an eligibility category, and a reference to a functional behavior assessment and behavior intervention plan from about 18 months earlier. The full cumulative file had not arrived. On the first day, I met briefly with the parent, the classroom teacher, and the principal. The parent described the student as bright and said the previous year had gone much better. The classroom teacher was open to inclusion but was worried about bringing in a student with an unknown behavioral history during the middle of the year. The principal was focused on getting a schedule in place without repeatedly moving students or staff. I asked the sending program for records and contacted our school psychologist about testing. The old cognitive and academic assessments were already more than two years old. In the meantime, the student attended general education with support from an instructional paraprofessional during transitions and less structured periods. During the first week, most reports were fairly calm. Then the paraprofessional described an outburst during a transition from recess to writing. That became part of what I had to synthesize for the interim IEP. We held the meeting near the end of the ten-day window. By then we had more records, but not updated testing, and there were still limits on how much direct observation I had completed. Interviewer: At the beginning, what information did you have, and what arrived later? Participant: Initially, I had the transfer summary, the short IEP excerpt, the old FBA/BIP reference, and my conversations with the parent and school staff. Later, the fuller records showed that the BIP had been faded out in the sending setting and that the student had gone roughly nine months without a documented behavioral incident. That was important context, but it arrived after I had already started forming an interim placement view. Interviewer: Let’s go back to your first key decision. What did you decide before the full records arrived? Participant: I decided to prepare the team for a more supported interim placement rather than begin with full inclusion as the likely recommendation. I did not make a final placement decision that day, but I was leaning toward partial pull-out and more structured adult support. Interviewer: What cues stood out? Participant: The sending program stood out. In my experience, students transferring from that program often needed a fairly high level of behavioral structure when they first arrived. The reference to prior aggression and an FBA/BIP reinforced that. We had received several transfers from there over the years, and they generally did not transition smoothly into a fully general education schedule immediately. Interviewer: What alternatives did you consider? Participant: One option was to hold off on any placement lean until the full individualized file came through and simply use temporary supports. Another was to begin planning for a structured setting so we would not be caught unprepared at the meeting. I chose the second approach because the timeline was short, and it seemed safer to have that option built into the draft schedule. Interviewer: How confident were you? Participant: Moderately confident, not completely. I knew the summary was incomplete. But I felt that the program history told me something meaningful about the kind of supports we might need at the start. If the student had come from a less specialized setting, I think I would have been more comfortable starting with a full-inclusion assumption while we gathered data. Interviewer: What information would have changed that initial lean? Participant: Current behavior data, recent progress notes, evidence that the BIP was no longer active, and a detailed description of how the student handled general education classes. Once the fuller record showed the long incident-free period, I had to adjust my thinking. Still, by then the structured option was already the frame I had brought into our early planning conversations. Interviewer: What was the next decision point? Participant: The reevaluation question. The existing testing was stale, and the student’s prior goals did not give us a current academic profile. Our school psychologist was booked for about three weeks, which was beyond the interim timeline. Interviewer: What did you do? Participant: I wrote the interim plan using the old testing, existing goals, classroom information, and generic accommodations rather than trying to force an expedited assessment process. I deferred the full reevaluation discussion to the annual review period. Interviewer: What alternatives were available? Participant: I could have asked the psychologist to see whether there was an emergency opening, requested brief curriculum-based measures, or built a more explicit bridge plan with a reassessment date soon after the interim meeting. That would have meant coordinating another set of forms, getting teacher input quickly, and trying to rearrange a schedule that was already tight. Interviewer: Why did you choose to defer it? Participant: Frankly, I was trying to get a compliant interim IEP done without creating another moving part. We had ten days, I had a full caseload, and the psychologist had no visible opening. The old data were not ideal, but they were usable enough to put services in place. I told myself we could revisit testing at the annual review. Interviewer: Did you expect the old data might create a problem before then? Participant: Yes. I knew there was a good chance the accommodations would need adjustment once the teacher had more academic data. The student’s work samples already suggested the old profile might not fit perfectly. But requesting a special process immediately felt like it would slow everything down, and I wanted the team to leave the meeting with something settled. Interviewer: What happened afterward? Participant: A few weeks later, the classroom teacher said the accommodations were mismatched. The student was reading above grade level but struggled with some written-output demands that the old plan did not capture well. We ultimately needed updated testing anyway. In retrospect, an earlier bridge assessment might have made the interim plan more precise. Interviewer: Let’s move to the present levels. What information did you have at that point? Participant: I had two teacher check-ins saying the student was generally polite with peers and participated when prompted. I had reading work samples that were stronger than expected. I also had the paraprofessional’s report of the recess-to-writing transition. The student reportedly yelled, pushed materials off a desk, and needed about ten minutes with adult support before returning to class. I had only observed briefly myself, so that report was vivid because it was the most detailed account of a difficult moment. Interviewer: What did you decide when drafting the PLOP? Participant: I wrote that the student’s behavioral regulation could interfere with consistent classroom engagement and peer interactions, and I recommended transition support and check-ins. I also described the student as needing substantial adult prompting to remain productively engaged. Interviewer: What alternatives did you consider? Participant: I could have written a more separated description: strong reading performance, generally positive peer interactions based on teacher reports, and one transition incident requiring follow-up data. Or I could write a broader concern statement so the receiving team would understand that the student might be harder to support than the work samples alone suggested. Interviewer: What was your reasoning? Participant: That transition episode concerned me. When a student has an outburst during a routine shift in the day, it can affect more than the transition itself. I worried that the same difficulty would show up in group work, independent work, and peer situations, even though the teacher check-ins had been positive. I did not want the team to read 'above-grade-level reading' and underestimate the level of support the student might need. Interviewer: Did later information affect that view? Participant: Yes. We gathered more feedback, and it consistently showed that the student was engaged academically and got along with peers most of the time. The classroom team still wanted transition supports, which made sense, but my initial wording was broader than the later evidence supported. Interviewer: What was the final decision at the interim meeting? Participant: We had to determine service minutes and the LRE. I presented two options: full inclusion with consultative behavioral support, or partial pull-out for targeted support while the team collected more data. By that point, I reviewed the attendance information, classroom schedule, teacher input, parent input, work samples, the transition incident, and the records that had arrived. Interviewer: What did the team choose? Participant: We chose partial pull-out for a limited portion of the day, focused on writing organization and transition support, with general education for the rest of the schedule. The parent preferred keeping the student with peers as much as possible, and the teacher could support that schedule. The principal’s scheduling concern was real, but it was not the deciding factor. We documented why the service minutes were temporary and set a review point. Interviewer: What did you learn after that decision? Participant: The parent asked for a follow-up review in six weeks. That was appropriate. It gave us a chance to look at actual classroom data rather than treating the interim decision as permanent. Interviewer: If the psychologist had immediate testing availability, would you have approached the reassessment decision differently? Participant: Yes. I would have requested updated testing right away and probably written more individualized accommodations from the beginning. Interviewer: If the paraprofessional’s report had not come in, how might the PLOP have read differently? Participant: I likely would have emphasized the positive classroom information and the reading strengths more clearly, while noting that we still needed direct observations of transitions. Interviewer: And if the compliance timeline had been longer? Participant: I would have waited for the full records, gathered more observations, and convened with a more complete set of current data before making the interim placement recommendation."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

