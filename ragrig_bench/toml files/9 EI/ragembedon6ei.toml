# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, I want to confirm you're okay with me recording this conversation for internal research on how curriculum decisions get made, and that anything you share will be used in de-identified form. Is that all right? Participant: Yes, that's fine. Interviewer: Great. Can you tell me a bit about your role on the committee and what you were tasked with? Participant: I've been on the district's curriculum committee for about five years, mostly representing the middle school math teachers. Last fall, after our sixth-grade state test scores dropped eight points district-wide, the superintendent's office asked us to run a full adoption cycle for a new K-8 math curriculum. We had six weeks to land on a recommendation for the board, which is tight given everyone on the committee still has a full teaching or admin load. Interviewer: Walk me through how the process actually started. Participant: Three publishers submitted proposals — I'll just call them Curriculum A, B, and C. Each came with a standards alignment matrix, sample units, and vendor support materials. Normally we'd sit with all three for a couple of weeks before narrowing anything down. But right around the time proposals came in, two of our members went to a regional math conference, and a neighboring district's team was there presenting on their experience adopting Curriculum B the year before. They were genuinely excited about it — said it had turned around their pacing problems. Our folks came back energized, and honestly, that shaped how we opened our first working session. We spent most of that meeting digging into B's materials and gave A and C a lighter pass, more of a checklist review than a deep one. Interviewer: Was that split in attention a deliberate committee decision, or did it happen more organically? Participant: A little of both. Nobody said 'let's only look at B.' But once people were talking about what the neighboring district found, it became the natural center of gravity. We told ourselves we'd circle back to A and C in depth later. Interviewer: Did you? Participant: Somewhat. Later on, when we got into scoring, we did revisit Curriculum A's proposal, and it actually had a more detailed differentiated-instruction support plan than B's. But by then the conversation kept framing it as 'is this good enough to change our minds about B,' rather than just asking how strong A was on its own. It's a subtle thing, but I noticed it happening even in how I phrased my own notes. Interviewer: Let's move to the vendor stakeholder meeting. What happened there? Participant: That was about two and a half weeks in. Curriculum B's rep organized a session with committee members from other districts already using it. A couple of them told a really specific story about a struggling classroom that turned around within a semester — kids who'd been behind were suddenly hitting grade-level benchmarks. It was vivid, it was well told, and I remember it clearly even now. Somewhere in the same meeting, someone also mentioned there was a statistical pilot report from a comparable district, multiple schools, showing outcomes over a full year. I didn't retain much from that part at all. Interviewer: What made the classroom story stick with you more than the statistical report? Participant: Honestly, I think it's just more concrete. You can picture it — a teacher, specific kids, a specific unit. The report was a couple of sentences and some numbers I didn't have in front of me. I remember thinking, 'I should get a copy of that,' but it wasn't until weeks later, closer to our final scoring, that anyone actually pulled it up. When we did, it showed mixed results across schools, not a clean success story. But by then, my gut sense of B's promise was already pretty well formed. Interviewer: How did that gut sense affect the testimonials versus the report going forward? Participant: The testimonials felt like they confirmed what we already suspected from the conference buzz, so they didn't feel like they needed extra scrutiny. The statistical report, when it came up, felt more like something to double check later rather than something urgent to chase down immediately. Looking back, that's probably backwards in terms of which one deserved more weight. Interviewer: Let's talk about the pilot. What happened when concerns came up mid-pilot? Participant: We ran a three-week classroom pilot of Curriculum B in two schools. About halfway through, one of the pilot teachers flagged pacing problems in one of the units — said the lesson sequencing didn't match how her students were actually progressing. By that point, though, most of the committee had already spoken favorably about B in prior meetings, and we were coming up on a meeting where the chair wanted to move toward consensus so we wouldn't lose time before the board deadline. Interviewer: How was that concern handled in the meeting? Participant: It got mentioned, acknowledged, and then the conversation moved on fairly quickly toward agreement. Nobody shot it down exactly, but nobody dug into it either. We didn't send someone to observe the second pilot classroom, we didn't ask the teacher for more detail in writing. We just kind of nodded and kept going. I found out afterward, informally, that one of our members told a colleague they'd actually had some reservations that day but didn't say so out loud, given how the room felt. Interviewer: Did that pacing issue turn out to matter? Participant: Yes, actually. When we rolled out further, a second classroom hit the same pacing snag. So the concern was real. It just didn't get a real hearing in the moment. Interviewer: Last decision point — the final scoring. How did that work? Participant: Each of us submitted rubric scores across five criteria for all three curricula. When the chair compiled them, Curriculum A had a strange split on the differentiated-instruction-support criterion — two of us scored it very high, two very low. B's scores were tighter across the board. The chair needed one composite number per curriculum for the board memo, so the scores just got averaged straight across, including that split on A. Once that single number came back looking like a solid, middling score for A, it read as settled — nobody asked what was underneath it or suggested pulling the individual ratings back apart before we moved on. Interviewer: Was the disagreement on Curriculum A discussed before the numbers were combined? Participant: Not really. It went into the spreadsheet like the rest, and the composite itself seemed to close the question rather than open it. It was only afterward, when someone asked why the differentiation score for A looked so middling despite that internal splitting, that we realized the two low scorers hadn't actually reviewed A's differentiation appendix, while the two high scorers had. So the average wasn't really representing consensus — it was masking a difference in how thoroughly people had reviewed the material. Interviewer: Did the board notice that? Participant: They asked about it, yeah. Why a criterion with that much internal disagreement was reported as one clean number. We didn't have a great answer beyond 'that's how we compile scores.' Interviewer: Stepping back — was there a point in this process where you felt uncertain whether the committee had the full picture? Participant: A few times, honestly. The pacing concern is the one that sits with me most. I don't think anyone was acting in bad faith. We were just moving fast, and B already felt like the likely outcome by the time real friction showed up. Interviewer: If the pilot teacher's pacing concern had surfaced earlier in the process, do you think the outcome would have changed? Participant: Possibly. If it had come up before the vendor meeting, before people's minds were as made up, I think it would've gotten a more serious look. Coming when it did, it was fighting a lot of momentum. Interviewer: And if the neighboring district hadn't mentioned Curriculum B at that conference at all? Participant: I've wondered that. I think we would have given A and C a more even start. B still might have won out — its materials were solid — but the early spotlight wouldn't have been there from day one. Interviewer: One last one — if you had the scoring step to do over, would you handle the split differently? Participant: Yes. I'd flag any criterion with a wide spread and ask why, before collapsing it into one number. In this case, the spread was actually telling us something useful, and averaging it just erased that signal."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

