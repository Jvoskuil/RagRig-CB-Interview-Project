# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, I want to confirm you're okay with this being used for an internal case study on incident decision-making — nothing you say will be attributed outside this review. Participant: That's fine, happy to walk through it. Interviewer: Great. Can you start with your role and what you're responsible for day to day? Participant: I'm CISO at NorthGate Financial. We're a payments company — card and ACH processing, about 450 employees. I own the security program end to end: SOC operations, vendor risk, incident response, board reporting, budget. Small team, six people in the SOC, so I'm hands-on more than I'd be at a bigger shop. Interviewer: Tell me about the incident you want to discuss, and what you were trying to accomplish overall. Participant: Sure. This was a stretch about ten days ago where an intrusion overlapped with our annual vendor renewal cycle, which was already a bad coincidence. The objective was straightforward in theory — detect and contain whatever was happening without taking payments processing offline, and get our vendor contracts and budget numbers finalized on schedule. In practice those two things kept colliding. Our SIEM flagged an anomalous login on a jump server one of our payments engineers uses — off-hours access, from a network range we hadn't seen for that account before. The SIEM auto-scored it Medium severity based on its default model. That model doesn't know the account is privileged, it just looks at pattern deviation. I remember looking at it and thinking, okay, Medium, that tracks with what I'm seeing, and we went from there. One analyst was handling triage that day — we were down a person on leave — so scope mattered. There'd also been a second alert nine minutes earlier on an adjacent auth server, lower priority, and it just didn't get opened at that point; the jump server was the concrete thing in front of us. Interviewer: What happened next? Participant: We had the analyst dig into the jump server specifically — process history, recent auth events, that kind of thing. A few hours in, once we circled back to close out the queue, we noticed the earlier auth-server alert shared the same source IP range. That's when it stopped looking like an isolated anomaly and started looking like lateral movement toward the payments database segment. Interviewer: Let's go through the sequence in order. What did you know, and when? Participant: At the start, just the jump-server alert and its Medium score. A couple hours later, the IP overlap with the auth-server alert. That afternoon, the vendor renewal deadline hit — we had five business days before our EDR and threat-intel contract auto-renewed, and that decision needed to happen regardless of the incident. That evening, once lateral movement was confirmed, my team wrote a monitoring script overnight to watch the compromised account, and I had a call with the CFO about containment options. Two days later, once things were stable, I had to submit a remediation budget number to the board. Interviewer: Let's slow down at that first decision — the triage call. What cues stood out, and was anything competing for your attention? Participant: The privileged nature of the account stood out to me, honestly, but the Medium score was already sitting there, and it's usually a decent starting point for how urgently we move. I didn't pull in the second alert as something to check in parallel — the analyst was already stretched, and the jump server was the concrete lead. Interviewer: What alternatives did you weigh, and what tipped it? Participant: Escalating both alerts jointly right away, or asking for a correlation sweep across that time window before locking in severity. I didn't do either. The score gave me a number to anchor the conversation around, and given we were short-staffed, narrowing the analyst's focus felt efficient rather than risky at the time. Interviewer: How confident were you in that assessment? Participant: Reasonably, but not fully — I knew the automated score doesn't factor in account privilege. I just didn't push past it that morning. Interviewer: Moving to the vendor decision — walk me through that one. Participant: We'd used this EDR and threat-intel vendor six years. My team built a lot of custom detection logic and dashboards on top of their platform. Procurement had actually flagged three other vendors as offering comparable bundles this cycle, but I didn't go through that list closely. A couple of peer CISOs mentioned they use either this vendor or one close competitor, so my real comparison ended up being just those two. Interviewer: What made you settle on renewing? Participant: Mostly the investment already sitting in our detection rules and dashboards — rebuilding that on a new platform is real time and real risk during a period we're trying to stay stable. I didn't formally validate that the incumbent still outperforms the alternatives; it was more that switching felt costly given what we'd already built. Honestly, having built all of that ourselves on top of their platform just made the incumbent feel like the stronger product outright, even though I didn't have a current benchmark or a comparable bid on file that actually backed that up. Interviewer: Did the live incident affect that judgment at all? Participant: Maybe implicitly — I wasn't eager to introduce a new tool mid-incident. But the underlying reasoning was really about the sunk integration work, not the incident timing. Interviewer: Third decision point — containment, once lateral movement was confirmed. Participant: This was the hardest one. The IR retainer firm recommended full segment isolation, pending forensics, because there wasn't confirmed proof isolation would fully stop the threat — just that it was the safer play. My team had put together an overnight monitoring script watching the compromised account specifically. The CFO's position was blunt: isolating payments meant a guaranteed same-day hit, about $180,000 in processing fees. That number was concrete and immediate. The security upside from isolating wasn't quantified the same way — it was framed more as 'reduces risk,' not a number. Given the script gave us visibility on that account, I went with the targeted lockout and monitoring instead of full isolation. Interviewer: What was decisive there? Participant: Honestly, the guaranteed dollar figure against an unquantified benefit made the isolation option feel like the more expensive one, dollar for dollar, even though I couldn't put a number on the other side. And I felt like the script had that account covered. Interviewer: At the time, how confident were you that the script and lockout actually covered the paths the intruder could take? Participant: Fairly confident, honestly. Once we had that account locked and the script watching for any reuse, I felt like we'd boxed the intrusion in. I didn't have the team specifically test whether it would catch token reuse from a different host or a parallel session somewhere else in the environment — I more or less assumed that shutting down that one account's avenues was enough to hold the line while forensics caught up. Interviewer: What happened afterward? Participant: About two hours later, the same compromised credentials touched a second internal system the script wasn't watching. Forensics later found a small amount of data had already been exfiltrated before we even had the script running. Interviewer: Last decision point — the board budget recommendation. Participant: We'd scoped a privileged-access segmentation project eighteen months ago at $240,000, never funded. This week, with the incident fresh, I gathered current vendor quotes for the same scope — they came back $310,000 to $340,000, partly inflation, partly expanded scope since cloud components were added. The board wanted one number. I went with something close to the original $240,000, nudged up a bit, rather than building the recommendation off this week's actual quotes. Interviewer: Why start from the old figure rather than the new quotes? Participant: It was already the reference point I had in my head from planning cycles past. Adjusting it felt like less friction than justifying a jump straight to $340,000 without more scoping work. Interviewer: If the SIEM hadn't pre-scored that first alert, do you think your response would have gone differently? Participant: Possibly — without a number already on the screen, I might have leaned harder on the account's privilege level from the start, and maybe caught the auth-server overlap sooner. Interviewer: What if the CFO's number hadn't been quantified? Participant: I think I'd have weighed the isolation call less as a straight cost comparison and spent more time pressing the IR firm on what 'reduces risk' actually meant in concrete terms. Interviewer: Looking back, anything you'd tell yourself facing that budget deadline again with a stale internal estimate on file? Participant: Get fresh numbers before you anchor on the old one — even under deadline pressure, a couple of quotes reframes the whole conversation."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

