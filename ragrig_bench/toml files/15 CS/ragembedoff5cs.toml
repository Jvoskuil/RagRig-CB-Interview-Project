# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this is a retrospective walkthrough of a specific vulnerability case you handled, purely for process review — nothing about individual performance evaluation. Can you tell me your role and how long you've been doing vulnerability management? Participant: Sure, no problem. I'm a Vulnerability Management Analyst, I've been in this seat about three years now, before that I did general SOC monitoring. Right now I own triage and remediation tracking for our internet-facing assets, so patch coordination, compensating controls, closing out tickets against our SLA. Interviewer: Great. Walk me through how this particular case started and what you were trying to accomplish. Participant: So this began when our threat intel feed flagged a new CVE, critical, 9.8 on CVSS, and it had confirmed exploitation already happening in the wild. It hit the web framework running underneath our legacy order-processing gateway — that's the system customers hit when they check out, so it's tagged Tier-1 criticality, internet-facing, revenue-generating. My objective was straightforward on paper: get this closed within our 30-day SLA without taking the gateway down during a peak sales stretch. The complication is that gateway is old, it needs vendor coordination to patch, and we had a partial change freeze coming up in about ten days, so the runway to actually get a maintenance window was shrinking fast. On top of that I had two other high-severity tickets open at the same time, so this wasn't the only thing on my plate. Interviewer: Given all that, how did the incident actually unfold, in order? Participant: Day one, the alert comes in, I do initial triage and decide to push for an emergency change board session instead of waiting for the normal 21-day cycle. That gets approved, but it's only a two-hour window, not enough for full regression testing. So around day three, we deploy a WAF rule as an interim compensating control instead of the real patch. While I'm watching the dashboard for that, I notice there's also some odd outbound DNS traffic from the same host, but it's not part of what I'm tracking for this ticket. About a week in, IT Ops points out there's now a vendor SIEM correlation rule available for this CVE family, versus the detection script I'd built myself months earlier, and I decide how to handle that overlap. Then by day 27, with the SLA clock running out and the actual patch still not deployed, I make the call on whether to close the ticket as mitigated. Interviewer: Let's slow down on the first one — the decision to escalate. What made you push for the emergency CAB slot instead of the standard cycle? Participant: Honestly, the exploit-in-the-wild status was the trigger, that's usually a hard line for us. But what really drove how I pitched it to my manager was framing what happens if we don't act — we're talking about a checkout system, so if this gets popped, we're looking at a breached customer-payment flow, contract penalties from at least one retail partner, and reputational fallout that's hard to walk back. I basically built the case around what we stood to lose if we sat on it for 21 days. Interviewer: Did you weigh that against the cost of disrupting the gateway with an emergency patch attempt? Participant: A little, but not as heavily. I mentioned the downtime risk in the ticket, but the loss side of the argument was what carried the conversation. I think it got the CAB slot faster because of that. Interviewer: Understood. Second decision point — once you had the WAF rule in place, how did you handle the DNS anomaly you mentioned? Participant: Yeah, so the dashboard was showing a clean match on the known exploit payload pattern, which is what the ticket was actually about, and I spent most of my time confirming that signature was blocked correctly. The DNS spike was sitting right there in the same view, but it didn't match anything in the CVE's known indicators, so I logged it as 'anomalous, monitor' and moved on. My focus was really on validating the compensating control against the threat we knew about. Interviewer: Was there a reason you didn't open a parallel look into the DNS traffic at that point? Participant: I considered it briefly, but I was heads-down on making sure the WAF rule actually caught the payload variant we had confirmed. Two days later a different analyst ended up escalating that DNS pattern separately as a possible unrelated compromise indicator, so it did turn out to be something. At the time, though, it just wasn't where my attention was. Interviewer: Third decision — the detection tooling. What happened there? Participant: Right, so I'd written a detection script for this six months back, tuned it myself against our traffic. When the vendor's SIEM correlation rule came out covering multiple payload variants, IT Ops suggested we just standardize on that instead. I kept my script as the primary and put the vendor rule in a secondary, lower-priority slot. Interviewer: What was the reasoning behind keeping yours in the lead role, given the vendor rule had broader coverage? Participant: I trust it. I built it, I know exactly how it behaves, I've already tuned out the false positives that used to bug us. The vendor rule is new to our environment, and switching primary detection mid-incident felt like it added risk of its own. I did acknowledge it covers more variants, that part's true, I just didn't want to hand over something I'd already gotten working well. Interviewer: Did that decision have downstream effects? Participant: About a week later a slightly different payload variant showed up that my script didn't flag, but the vendor rule would have caught it. We caught it another way eventually, but it was a gap. Interviewer: Last decision point — closing the ticket at day 27. Walk me through that. Participant: At that point we still didn't have the actual vendor patch deployed, just the WAF rule and my script running as compensating controls. The SLA clock was almost out. I closed it as adequately mitigated. Part of what pushed me there was that I'd personally configured both of those controls, and I was confident the exploit path was shut down because of that setup. There was also, I'll admit, a news story that week about a ransomware attack that hit another company pretty hard — that was all anyone on the team was talking about — and it added to the sense that this needed to be wrapped up decisively rather than left open. Interviewer: How much of that closure decision was based on the specific residual-risk data for this ticket versus that broader context? Participant: Looking back, probably more weight went to the general sense of urgency than to itemizing exactly what was still open — the DNS anomaly hadn't been fully resolved, and there was that detection gap from the script. I did note those in the ticket, but I don't think I treated them as blocking the closure the way I maybe should have. Interviewer: Was there uncertainty at that point about whether the controls were fully sufficient? Participant: Some, yeah. I wouldn't say I was certain, but I felt like the pieces I'd put in place had it covered. A post-incident audit about a month later found there was actually a narrow exposure window that never got closed, though nothing was ever exploited through it. Interviewer: If you'd had another week before the SLA deadline, would anything have gone differently? Participant: Probably would have chased down the DNS anomaly properly and maybe pushed harder for the actual vendor patch instead of leaning on compensating controls that long. Interviewer: If that ransomware story hadn't been in the news that week, do you think the closure decision changes? Participant: Possibly. I think I'd have sat with the open items longer instead of feeling like I needed to close it out right then. Interviewer: And if the vendor SIEM rule had existed from day one, would you have built your own script at all? Participant: Hard to say — probably still would have, honestly, just because I like understanding exactly what's under the hood. Though maybe I'd have made it secondary from the start instead of the other way around. Interviewer: Looking back across the whole case, is there a point where you think you gave one piece of evidence more weight than it really deserved? Participant: Probably the closure call. Between my own confidence in the controls I'd built and everything going on in the news that week, I think I leaned on those more than the actual open items on the ticket. Interviewer: That's really helpful, thank you for walking through it in this much detail."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

