# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, I want to confirm this is being recorded for internal research purposes only, and you can pause or skip anything. Is that alright? Participant: Yep, that's fine. Interviewer: Great. Can you start by telling me your role and roughly how long you've been doing it? Participant: I'm a Security Architect. I've been at the company about five years, and for the last three I've owned most of our network segmentation architecture — design, implementation, the whole Zero Trust rollout. Interviewer: Let's talk through the incident we discussed scheduling this around. What triggered it? Participant: We had an external penetration test as part of prep for our annual audit cycle. The report came back with three findings. One was a segmentation gap allowing lateral movement between two zones we thought were isolated. Another was stale service-account credentials, and the third was incomplete log retention. Only the segmentation one was rated critical. Interviewer: What was your objective once you saw that report? Participant: Close the critical gap before the compliance window, without blowing up the rest of the Zero Trust program or causing outages. We had six weeks. Engineering bandwidth was tight — I basically had myself and one platform engineer who could help part-time. Any vendor spend needed budget sign-off, and leadership wanted an actual remediation plan, not just 'we found a problem.' Interviewer: Walk me through what happened first. Participant: First thing was triage. Three findings, limited hands, six weeks. I looked at severity and exploitability — the segmentation gap was the only one that let an attacker actually traverse between trust zones, so it was the obvious pick to go first. Credential rotation is scriptable and fast, log retention is a config change, neither needed the same urgency. So I told the CISO we'd tackle segmentation first and run the other two in parallel at lower priority, mostly automated. Interviewer: What information did you have at that point versus what you learned afterward? Participant: Initially I just had severity ratings. Once we dug in, we confirmed the lateral movement path was real — not just theoretical — between two zones that were supposed to be firewalled from each other. That's when platform engineering told me they genuinely didn't have spare capacity to fix all three at full depth simultaneously, which confirmed the sequencing call. Interviewer: Let's go deeper on that first decision. Any alternative you seriously considered? Participant: Running all three in parallel at reduced depth crossed my mind, but diluting effort across three findings when only one is critical felt like the wrong risk math. I ruled it out fairly quickly. Interviewer: Once segmentation was the priority, how did you approach fixing it? Participant: That's the part that took the most back-and-forth. The segmentation layer runs on a framework I built myself when we started the Zero Trust program. I know its internals cold — every policy enforcement point, every identity-aware proxy hook. The pentest vendor actually flagged that a vendor-managed ZTNA platform could close the same gap with less custom engineering, and there were some independent benchmarks suggesting similar coverage. Interviewer: What sources did you pull in to compare the two paths? Participant: I looked at our own effort estimates mostly. Patching the in-house framework was about four weeks of engineering time, with some uncertainty on edge-case coverage. The vendor path was quoted around three weeks including their security review, and they were offering coverage guarantees in writing. Interviewer: So the vendor path was faster and came with a written guarantee. What made you go with the in-house patch? Participant: Honestly, I trust what I built. I know exactly how it behaves under load, how it interacts with our CI/CD pipeline and identity provider. The vendor's guarantee sounds good on paper, but 'guarantee' from a sales engineer isn't the same as proof in our specific environment. I wanted to see their platform actually validated against our topology before I'd trust it the way I trust code I wrote and have watched in production for three years. Interviewer: Did you apply that same validation standard to the in-house patch — proving it against your topology before trusting it? Participant: Not really the same way, no. I mean, I've lived with that system for three years, so it's not like I needed to re-prove it from scratch. It's more that the vendor is the newer unknown. Interviewer: Had you evaluated ZTNA vendors before this incident? Participant: We'd looked at two platforms about a year earlier for a different project, and didn't move forward, mostly on cost. So there was some familiarity, but no deep hands-on testing. Interviewer: How did time pressure factor into that decision? Participant: There was pressure, but not extreme — six weeks was workable either way at that point. It wasnns't really the deadline pushing me toward the in-house option; it was more that I was confident I understood exactly what patching would take. Interviewer: What did you present to the CISO? Participant: I recommended patching and extending the existing framework, and that's what we went with. Afterward, platform engineering raised some integration concerns — mainly around a legacy service that didn't fit cleanly into the updated policy model — that hadn't been fully weighted when I made the original comparison. Interviewer: Let's move to rollout. Once the patch was ready, what were your options? Participant: Two real choices: a narrow pilot on one trust zone first, or roll out to all affected zones at once to save time, since we were now down to four weeks. There was also a middle option — stage it by risk tier over two weeks. Interviewer: What did you choose and why? Participant: Staged by risk tier. Full rollout all at once felt too risky if something broke — you'd have no isolated blast radius. A narrow pilot alone would've been safer but slower, and we didn't have four weeks to spare on a single-zone pilot before expanding. Staging let us validate against the highest-risk zones first while still making progress elsewhere. Interviewer: Did anything unexpected come up during that rollout? Participant: Yes — a legacy service ended up bypassing the new policy enforcement point entirely. It wasn't something we'd flagged as a risk going in. Platform engineering said fixing it properly would need more time than we had left. Interviewer: What information, if you'd had it earlier, would have changed that rollout decision? Participant: If we'd known about that legacy service's behavior beforehand, I probably would've included a targeted pilot on that specific service before staging everything else, rather than finding out mid-rollout. Interviewer: Final decision point — reporting to the audit committee with two weeks left and an unresolved edge case. What were your options? Participant: Report it as fully remediated, report as substantially remediated with a compensating control and a follow-up date, or ask for a deadline extension. Interviewer: What did you decide? Participant: Substantially remediated, with a documented compensating control on the legacy service and a committed date to close it out next sprint. Fully remediated would've been inaccurate given the open edge case, and I didn't think an extension was necessary since the core lateral-movement path was actually closed. Interviewer: How confident were you in that characterization? Participant: Reasonably confident. The committee accepted it with a follow-up item, which is roughly what I expected. Interviewer: Looking back — if a different engineer, someone no longer at the company, had originally built that segmentation framework instead of you, do you think the remediation choice at decision point two plays out the same way? Participant: That's a fair question. I'd like to think I'd have weighed the vendor option the same either way, but I'll admit — if it were someone else's code, someone I couldn't personally vouch for at 2 a.m. if something broke, I might have leaned harder on the vendor's written guarantees instead of my own confidence in the system. Interviewer: And if the vendor platform had been proposed to replace someone else's system rather than yours? Participant: I probably would've asked for the same proof-of-concept against our topology from both sides, rather than treating my own system as the trusted baseline by default. Interviewer: Last one — anything you'd do differently facing this same situation again? Participant: Maybe get an outside technical review of both options before I made the call, just to check my own read on the comparison. Overall the outcome was fine, but I can see how the sequence of judgments got there. Interviewer: That's really helpful — thank you for walking through it in this much detail."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

