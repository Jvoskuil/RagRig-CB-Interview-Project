# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for taking the time. This is for an internal review of decision-making during admissions, and I may ask follow-up questions as we go. Are you comfortable with that? Participant: Yes, that's fine. Interviewer: Can you tell me your role on the team during this admission? Participant: I was the attending on the general medicine service, with a resident rotating through. We picked this patient up on day one after she came in for an unrelated complaint and the monitor flagged something new. Interviewer: What was your overall goal for her care during the stay? Participant: To sort out the new finding properly and get her home with a plan that actually made sense given everything else going on with her, not just the one issue. Interviewer: Walk me through what happened, from the diagnosis to discharge. Participant: The admission ECG showed persistent atrial fibrillation, new to us. Her CHA2DS2-VASc came out to 4, so meaningful annual stroke risk if she goes untreated. HAS-BLED was 2 — moderate, not a contraindication on its own. Pharmacy checked for interactions with the DOAC we'd typically use and didn't find any, though they flagged her renal function was sitting at the low end of normal and wanted it monitored. The complicating piece was a fall about three weeks earlier. When we asked her about it directly, she said she tripped, but she also mentioned feeling briefly lightheaded right before — and that part had never been worked up anywhere. So we didn't actually know if this was a mechanical trip or something with a cardiac or orthostatic component that nobody had chased down. Given that gap, I asked for a fall-risk assessment and held off committing to a start date until we had more to go on. The formal assessment came back borderline — not clearly low, not clearly high. I also asked cardiology for a curbside opinion on timing anticoagulation after an unexplained pre-fall symptom, and their answer was honestly that the literature doesn't give a clean threshold for a case like this. On day two, one of the nurses mentioned that a patient down the hall had a bleeding complication on anticoagulation the month before. My patient's daughter had heard about it and asked me directly how similar the situations were. I didn't have the other patient's details memorized, so I asked the resident to pull what was available before I answered her — turned out that patient had notably worse renal clearance and was also on an antiplatelet, which changes the picture substantially. That took a day to sort out. By day three, we had that comparison clarified, but her own fall-risk score was still sitting in that borderline zone, and the CHA2DS2-VASc and HAS-BLED numbers hadn't moved — they still leaned toward treating. Discharge was set for the next morning. I asked for one more renal function check before finalizing a dose, since her creatinine had been borderline on admission and I wanted a same-admission number rather than working off something a few days old. On day four, right before discharge, she had a small bruise where blood had been drawn. She wasn't on anticoagulation yet, so it wasn't drug-related, but the renal result still hadn't come back. I finalized the discharge without starting treatment and arranged outpatient follow-up, which ended up being three weeks out rather than the two we'd hoped for. Interviewer: Let's go through each of those points in more detail. At the first one — right after diagnosis — what stood out most? Participant: The lightheadedness before the fall. If that fall had a cardiac cause we hadn't identified, starting anticoagulation without understanding it felt premature. But I'll be honest, it's a judgment call — plenty of people would say the stroke-risk numbers were clear enough to just start and monitor. Interviewer: What alternatives did you weigh? Participant: Start the DOAC right away given the score, defer until the lightheadedness was evaluated, or start a reduced empirical dose in the meantime. I went with deferring the start date, mainly because the history felt incomplete rather than because I thought waiting was inherently safer. Interviewer: At the second point, with the comparator patient — what were you trying to do there? Participant: Give the daughter an accurate answer instead of a reassuring guess. Without knowing the other patient's renal function or medications, I couldn't tell her anything meaningful, so I had the resident check before we talked further. Interviewer: How much time pressure did that add? Participant: Some — it pushed the conversation back a day, which mattered given discharge planning. But answering her with an unverified comparison seemed worse than the delay. Interviewer: At the third point, after the comparison was clarified and fall risk was still borderline — what was the reasoning behind getting another renal check? Participant: Her creatinine on admission was borderline, and dosing a DOAC on stale numbers, especially this close to discharge, didn't sit right with me. Someone could reasonably argue the scores already justified starting and adjusting later if needed. I didn't feel strongly that one path was clearly correct. Interviewer: Had a similar situation come up for you before? Participant: Something like it, yes — dosing decisions where the renal number is borderline. It usually comes down to how much runway you have before discharge, and here we had very little. Interviewer: At the fourth point, the bruise at discharge — how did that factor in? Participant: It didn't really change anything clinically since she wasn't on the drug yet. The bigger factor was still the pending renal result. We noted the bruise for the outpatient team and moved on. Interviewer: If the fall-risk assessment had come back clearly low instead of borderline, would you have decided differently? Participant: Probably, yes — a clear low score would have resolved a lot of the hesitation at the first decision point. Interviewer: If the comparator patient's chart details had been available immediately, do you think the outcome would have changed? Participant: Possibly the family conversation would have gone faster, but I don't think it would have changed the actual treatment timing much — the renal question was separate. Interviewer: Looking back, what would you tell a colleague facing something similar? Participant: Chase down unexplained symptoms before they get labeled as routine falls, and don't assume a story about another patient applies to yours without checking the details. Beyond that, I think reasonable people could have made different calls at almost every step here."
]

[[agents]]
label = "Sonar Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 16384          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_sonar.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
 [agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
 seed = 42


