# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
   "Interviewer: Thanks for making time for this. Before we start, I want to confirm you're okay with this being used for a internal case review on decision-making during admissions, and that I can ask follow-up questions as we go. Participant: Sure, that's fine. Happy to walk through it. Interviewer: Great. Can you tell me your role on the team during this admission? Participant: I was the attending on the general medicine service. I had a resident covering with me, and we picked up this patient on hospital day one after she came in for something unrelated and ended up with a new finding on her monitor. Interviewer: And what was your overall goal for her care during the stay? Participant: Mainly to get her diagnosis sorted out and make sure we sent her home with a safe, appropriate plan. She was 78, otherwise fairly independent, living with her daughter nearby. Interviewer: Can you walk me through what happened, from the diagnosis to discharge? Participant: She came in and the admission ECG showed she was in atrial fibrillation, which nobody had picked up before — persistent, not paroxysmal. That obviously changes the calculus for stroke prevention. Her CHA2DS2-VASc came out to 4, so her annual stroke risk if left untreated is meaningful. Her HAS-BLED was 2, which is moderate, not a red flag. Pharmacy checked and there were no interactions with the DOAC we'd typically use. But she'd had a fall about three weeks before admission — mechanical, tripped on a rug at home, no head strike, no fracture, fully worked up at the time. Still, when I saw 'fall' in the history, that gave me pause about starting a blood thinner right away. I told the team we'd hold off and get a formal fall-risk assessment first before committing to anything. Then on day two, one of the nurses mentioned, sort of in passing, that a patient two rooms down had died the previous month from a major GI bleed while on anticoagulation. Understandably, that got around the unit, and my patient's daughter had heard a version of it too. She was in the room a lot and got increasingly anxious every time anticoagulation came up. Clinically nothing had changed — no bleeding, no neuro symptoms — but I ended up ordering a head CT partly to have something concrete to reassure her with, even though it wasn't really indicated. That pushed our timeline back a day. By day three the CT was normal, and physical therapy had cleared her fall risk as low with a walker. So on paper the numbers were now clearly in favor of starting treatment. I remember standing at the nurses' station with the resident and just picturing what it would be like if we started her on this drug and then she had a major bleed — the conversation with the daughter, explaining that decision, how that would sit with all of us. It wasn't just that it would be bad; it felt like the kind of thing I'd still be replaying weeks later, something that would sit over the whole team and not really lift for a long time. That feeling seemed heavier to carry than just not starting it. I told the resident we'd let the outpatient team pick it up after discharge. Then on day four, right before discharge, she got a small bruise at her IV site — unrelated, since she wasn't even on anticoagulation yet. It didn't change anything about the plan; we finalized the discharge summary without a firm start plan, just a note to follow up as an outpatient. Interviewer: Let's slow down and go through each of those moments. At the first point, right after diagnosis — what stood out to you most? Participant: Honestly, the fall. Clinically I knew the scores favored treatment, but a recent fall in an older patient just registers as a flag. I didn't want to be the one who started a blood thinner and then she fell again and bled into her head. Interviewer: What alternatives did you consider there? Participant: We could have started the DOAC immediately since the scores supported it, or started a lower empirical dose. I chose to wait for a formal PT evaluation instead, even though the fall itself had already been worked up and looked mechanical. Interviewer: What was the main basis for waiting rather than starting treatment that day? Participant: I suppose not wanting to be the direct cause of a bad outcome. Withholding felt like the more conservative option, even though I recognized the resident had pointed out the stroke risk reduction was the bigger number. Interviewer: At the second point, with the daughter's anxiety and the CT — what were you trying to accomplish? Participant: Mostly to de-escalate the family's fear so we could have a productive conversation. In hindsight, I could have just walked through her individual numbers with the daughter instead of ordering imaging that wasn't clinically indicated. But it felt like having a normal scan in hand would make the conversation easier. Interviewer: How much time pressure did you feel making that call? Participant: Some — we were already tight on discharge planning, and adding a CT meant another day. But I felt like skipping that step would leave the family conversation unresolved. Interviewer: Move to the third point — after the CT came back normal and fall risk was cleared. What was going through your mind there? Participant: That's the one I keep coming back to. The data at that point was pretty clean — low fall risk, normal imaging, scores favoring treatment. But I remember describing to the resident, almost involuntarily, this scenario of her bleeding on a drug I'd started, and picturing it as something that wouldn't really fade — like it would color how the family saw us and how I thought about the case for a long stretch afterward. It wasn't really about the probability anymore. I decided to leave it for the outpatient team. Interviewer: What alternatives were on the table then? Participant: Starting it right there before discharge, starting a lower dose with a firm two-week follow-up, or deferring entirely, which is what I did. Interviewer: Had you handled a similar case before that shaped this decision? Participant: Not directly with this patient, but the ward story about the other patient's bleed was fresh in everyone's mind that week. Interviewer: At the fourth point, the bruise at discharge — how did that factor in? Participant: It didn't really change the clinical picture, since she wasn't even on the medication yet. We noted it and moved on. We sent her out with a follow-up appointment that ended up being three weeks out, later than the two-week window we'd wanted. Interviewer: If the fall-risk assessment had come back before your first decision instead of after, would you have decided differently? Participant: Probably, yes. If I'd had that clearance up front, I likely would have started treatment on day one instead of waiting. Interviewer: If the other patient's bleeding event had never come up on the ward, do you think this admission would have gone differently? Participant: It's hard to say for certain, but I think the family conversation would have been calmer. Interviewer: Looking back, what would you tell a colleague facing a similar case? Participant: I'd say make sure the fall workup happens early, not as an afterthought, and try to separate the family's emotional reaction from the actual numbers in front of you. It's easy to let the picture of a bad outcome sit with you well past the moment, even when the data has already shifted."
]

[[agents]]
label = "Sonar Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 16384          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_sonar.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
 [agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
 seed = 42


