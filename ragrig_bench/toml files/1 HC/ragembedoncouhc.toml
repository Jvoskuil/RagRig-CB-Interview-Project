# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this is a voluntary interview about your clinical decision-making, it's being recorded for research purposes only, and you can skip anything you'd rather not discuss. Can you tell me a bit about your role? Participant: Sure. I'm an outpatient physical therapist, mostly orthopedic caseload — a lot of post-surgical knees and shoulders. I've been doing this about nine years. Right now I see somewhere between eleven and fourteen patients a day. Interviewer: I'd like to focus on one case that stands out to you — something nonroutine, where you had to make some real judgment calls. Can you walk me through it? Participant: Yeah, there's one that's been on my mind. Adult patient, competitive amateur soccer player, hamstring autograft ACL reconstruction. She was highly motivated — wanted to be back for preseason. This was actually one of those cases where her insurer had approved an open-ended authorization, no fixed visit cap, no expiration date hanging over us, which honestly doesn't happen often. Around week eight, we did a strength check — quad index came out to 78% of the uninvolved side. Threshold for moving into plyometric loading is usually cited around 80 to 85%, so she was close but technically under. No pain, no swelling, moving well. I actually had a case a couple years back — different patient entirely, similar timeline — who progressed into plyometrics early and re-tore her graft. That one stuck with me. So at that checkpoint, I held her at the current loading level rather than bumping her into closed-chain, modified plyo work, even though her numbers were close and she was symptom-free. I told her we'd reassess in two weeks. Interviewer: Even with the open authorization, was there any urgency at that point? Participant: Not from the insurance side, no. Her own season timeline gave us some natural motivation to move at a reasonable pace, but nothing forcing my hand. Interviewer: What happened next? Participant: The surgeon's clearance for advanced loading came through a few days later, no structural concerns noted. She was frustrated — she'd been comparing notes with a teammate who'd had a faster progression somewhere else. Then over the next couple weeks she had three really clean sessions of single-leg hopping — pain-free, form was improving each time, no swelling afterward. We had the isokinetic dynamometer booked for a hop-symmetry test that week, since it's only in clinic two days a week and slots go fast regardless of authorization status. But I remember thinking, three good sessions in a row is unusual for this stage — felt like we were due for something to give, so I pushed the test back a week rather than run it as scheduled. Interviewer: And the week after? Participant: Fourth session, also fine. No setback. It cost us a dynamometer slot, but there wasn't any authorization clock ticking down because of it — just an inconvenience. Interviewer: Let's go back to that first checkpoint, week eight. What information did you have in front of you at that moment? Participant: The 78% index, no pain, no effusion, and clearance was pending but I fully expected it to come through. Objectively she was close to threshold and asymptomatic. Interviewer: What alternatives did you weigh? Participant: I could've progressed her into the modified plyo work right then, held her flat and reassessed in two weeks like I did, or split the difference with a reduced-intensity subset. I chose to hold. Interviewer: What was the deciding factor? Participant: Honestly, that prior patient's graft failure. I know it's a different case, different graft type technically, but it was vivid enough that it colored how I read this one. If I'm being fully honest, the current patient's actual numbers supported at least a partial progression. Interviewer: Given there was no visit cap here, did scheduling pressure factor into that call at all? Participant: Not really — I had all the time I needed to reassess her properly. That memory would've tipped me the same way even with a fixed deadline breathing down my neck. Interviewer: Moving to the hop-test delay — what was your reasoning in the moment? Participant: There was no clinical red flag — no fatigue report, no swelling, PROMs were stable. It was really just this sense that things had gone smoothly for long enough that a dip felt likely. In hindsight, each session doesn't really owe you anything based on what came before it. Interviewer: Was the delay about protecting the authorization window at all? Participant: No, that wasn't a factor here since there wasn't one to protect. It was purely that instinct about the streak. Interviewer: Let's move to the third checkpoint. What was happening there? Participant: Around week twelve, she'd hit about 85% of her interim milestones. Case manager reached out just for a routine check-in, not because anything was expiring, and asked for my recommendation — keep her in twice-weekly clinic visits or transition to a home program. Her numbers genuinely could've supported either path; it wasn't a clear-cut read. Interviewer: How did you present the options? Participant: I told the case manager and the patient that if we stopped clinic visits now, she'd risk losing the strength gains she'd built up. That's really the framing I led with. I didn't spend much time on the flip side — that a structured home program with check-ins could just as easily consolidate her progress and build her independence. Looking back, I leaned on the 'you'll lose what you've gained' language more than the actual data probably warranted, and that's largely what drove the recommendation to keep her in clinic. Interviewer: Did the open authorization make that recommendation easier to justify? Participant: If anything it removed any excuse tied to running out of visits, so it really was just about how I chose to frame it, not the insurance situation. Interviewer: Did the patient respond to that? Participant: She went along with it, but she mentioned afterward that the way I put it made her anxious about stopping, more than she felt the numbers alone would've justified. Interviewer: Let's talk about discharge, around week sixteen. What did the picture look like then? Participant: Strong. Hop symmetry index at 88%, quad index at 91%. Genuinely some of the best numbers I'd seen on my caseload that year. Surgeon wanted my recommendation on return-to-sport clearance. There was no pressure to rush this either — we had plenty of runway left on the authorization. Interviewer: What did you tell the patient? Participant: I told her she was very likely to get back to competitive play injury-free — I said it pretty directly, based on how strong her numbers were compared to other patients I'd worked with. Looking back, I took 'better than most patients I've seen' and turned it into 'very likely injury-free' more firmly than those two scores alone could really back up for someone returning to a cutting-and-pivoting sport. Interviewer: What alternatives did you consider at that point? Participant: Full clearance outright, clearance with a structured sport-specific reconditioning phase and closer monitoring, or delaying for another functional movement screen. I went with full clearance. Interviewer: She asked you something specific at that point, right? Participant: Yeah, she asked what her actual chances were of re-injuring it once she got back to playing. I answered in terms of her numbers — how strong her hop symmetry and quad index were relative to threshold. I didn't really bring in anything about how often athletes in general re-injure after this kind of surgery when they go back to cutting and pivoting sports. In hindsight, that's relevant information I have some familiarity with, and I didn't raise it, even though I had all the time I needed to give her a fuller answer. Interviewer: What would have needed to be different for you to answer that differently? Participant: If she'd asked more pointedly, 'compared to other patients in general,' I probably would've brought in more of that broader picture. But she asked about her chances, and I answered about her. Interviewer: Given the open-ended authorization here, is there anything you'd have done differently if there had instead been a hard visit cap? Participant: Honestly, I don't think the core calls would've changed much. Maybe I'd have felt more stressed about the dynamometer delay, but the reasoning behind these decisions wasn't really coming from the insurance clock either way. Interviewer: If this had been a recreational walker instead of a competitive athlete, would your discharge conversation have gone differently? Participant: Almost certainly softer, less urgency, and I think I'd have been more inclined to caveat the outcome rather than state it so plainly. Interviewer: Any final reflection you'd offer a colleague facing a similar case? Participant: Just to keep checking whether what's driving a call is the patient in front of you, or something you're carrying in from somewhere else — a past case, a good run of sessions, whatever it is. It's not always obvious in the moment which one it is, and having plenty of time on the clock doesn't automatically fix that."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

