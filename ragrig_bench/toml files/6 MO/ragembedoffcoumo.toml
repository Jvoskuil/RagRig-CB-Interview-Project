# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm — this is a routine debrief about a watchkeeping incident, not disciplinary, and it's fine to be candid about your reasoning. Can you tell me your role and roughly how long you've been standing bridge watches? Participant: Sure. I'm second officer, been standing OOW watches about four years now, mostly on container ships this size. That night I had the 0000 to 0400, on my own with one AB as lookout. We were transiting the strait — always busy, crossing traffic, fishing activity, and this time of year the squalls come through fast. Interviewer: Can you walk me through what happened, from the start of the watch? Participant: When I took over, ARPA had five targets acquired already, all comfortable CPAs. VHF chatter mentioned fishing boats working the area, and the forecast had squalls coming, visibility dropping under a mile at times. Passage plan had us holding course into the next TSS leg, so early on it was ordinary monitoring — checking the plot, doing a visual sweep every few minutes since I know some of these wooden hulls don't paint well on radar. That's how we caught the first one, actually — the lookout spotted a small boat visually at about three miles before ARPA ever held it. Dim light, flickering, hard to get a steady bearing. Interviewer: What did you do once that boat was sighted? Participant: Kept watching it. It was converging, but slowly, and ARPA still wasn't holding a firm track on it — weak return, in and out. I logged it as one to watch rather than urgent. Interviewer: Let's build out the timeline a bit more before we get into specifics. What came after that? Participant: The boat kept closing, down to about two miles. Around then we hit a squall band, visibility dropped, and radar showed a loose cluster of three or four more small contacts near the next waypoint. That spot stuck with me — a few months back I'd had a close call there myself, similar fog, fishing boats everywhere, never wrote it up formally, just one of those nights that sticks with you. On top of that, a bulk carrier showed up on the starboard bow, CPA tightening. So for a stretch I had three things going at once. Eventually the bulk carrier needed a real course adjustment, and the fishing cluster passed wider than I'd expected. Nothing hit, watch ended, I briefed the master and handed over. Interviewer: Let's go back to that first boat at three miles. What alternatives did you weigh? Participant: It was between letting the ARPA scan drive my attention since nothing was flagged, or doing extra manual sweeps myself. I split it — mostly trusting the target list but adding visual checks specifically because I've been caught before by small wooden hulls not showing up well. Standard practice for me in these waters. Interviewer: When the boat closed to two miles, still without ARPA elevating it — what happened at that point? Participant: That one I keep turning over. The lookout said the boat seemed to be zigzagging, not settling into anything you could plot cleanly, which normally would worry me. But ARPA's overall ranking still had nothing above the alarm threshold — none of the five original targets or this one had crossed into the alert zone. Two VHF calls got no answer. I decided to keep monitoring rather than take early avoiding action, mainly because the system wasn't telling me anything critical yet, and I didn't want to make an unnecessary alteration inside the TSS lane over a contact the system itself hadn't escalated. Interviewer: What would have changed that decision for you? Participant: If the ARPA alarm had actually tripped on it, I'd have gone straight to manual plotting and probably altered early. As it was, the numbers on the display weren't backing up what the lookout was describing, so I leaned on the display. Interviewer: How much time pressure did you feel at that point? Participant: Not extreme — maybe ten, fifteen minutes before it would've mattered. Enough room to keep watching, is how it felt. Interviewer: Let's move to the squall and the cluster near the waypoint. What drove your read of the danger there? Participant: That one hit me fast. Visibility dropped, this loose cluster showed up right at the spot where I'd had my own close call, and my first thought was, 'this feels exactly like that night.' That memory is pretty vivid for me — fog, boats everywhere, us barely clearing one. So I started orienting my planning toward the cluster, working out an evasive course for it, getting the lookout focused that direction. Interviewer: How did that compare with how you handled the bulk carrier at the same time? Participant: The bulk carrier actually had the tightening CPA on the numbers — inside a mile and closing. I noticed it, but for a bit my attention was more on the cluster because that scenario felt like the one about to go wrong again. It wasn't until a little later that I really focused back on the bulk carrier's plot and realized that was the one needing the firmer action. Interviewer: What was your sense of the cluster's actual plotted risk at the time, separate from that memory? Participant: Looking back, the spacing and drift on the cluster weren't actually showing a fast closing rate yet. It was more that the situation reminded me strongly of what I'd been through. Interviewer: If you'd never had that earlier close call at this waypoint, do you think you'd have split your attention differently? Participant: Probably, yeah. Without that in my head, I think the bulk carrier's numbers would've grabbed me first, since objectively that was the tighter CPA. Interviewer: Last decision point — after both situations resolved, you briefed the master. How did you decide what to recommend? Participant: Both contacts passed clear, no drama, so I could've just logged it as routine. But given how much fishing activity we'd seen, and one more area coming up with reported boats, I recommended posting an extra lookout for the rest of the transit. Felt like the sensible call based on what we'd actually observed that watch, not tied to any one incident. Interviewer: Had you told anyone about that earlier close call, or was it something you carried on your own? Participant: Just me, really. Never came up in a bulletin or briefing, it wasn't that kind of event — no damage, no report filed. Just something I remembered vividly whenever I passed that spot again. Interviewer: Looking back, what are you most uncertain about? Participant: Whether I gave the first boat too much benefit of the doubt because the system wasn't flagging it. And whether I'd have caught the bulk carrier sooner if that old memory hadn't been sitting in the back of my head. Interviewer: If you faced this same combination again, what would you do differently? Participant: I'd probably force myself to independently plot any contact the lookout flags as behaving oddly, regardless of what the ranking shows. And I'd try to rank contacts by their actual numbers first before letting any one of them feel more urgent just because it reminds me of something from my own experience. Interviewer: That's helpful, thank you. I think that covers what I needed."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

