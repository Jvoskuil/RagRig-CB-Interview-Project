# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for sitting down with me. Just to confirm, you're okay with this being recorded for training analysis, no names attached? Participant: Yes, that's fine. Interviewer: Could you give me a quick sense of your background? Participant: Sixteen years piloting on this river system, mostly deep-draft container and bulk carriers. I've taken vessels the size of the Kalliopi up to Berth 7 probably a hundred times. Interviewer: Let's talk through this particular transit. What did you know before boarding? Participant: It was a fully loaded container ship, about 300 meters, drawing 14.2 meters. Port control had sent the passage plan that morning built around the tide table, giving roughly 1.2 meters of under-keel clearance at our planned transit time. That's tight but workable for that stretch under normal conditions. We had a closing tidal window, maybe ninety minutes, two tugs assigned, and wind forecast around 15 knots picking up through the afternoon. Interviewer: What made this one feel nonroutine? Participant: A few things stacked up together. A barge was moored tighter to the bend than charted, one of our tugs got delayed at the pilot station, and the wind ended up running hotter than forecast. Individually those are manageable. Together, they meant I was reassessing constantly instead of just running the plan as written. Interviewer: Walk me through what happened after you boarded. Participant: I went up to the conning position, confirmed the plan with the master, checked the draft survey again, and we got underway close to schedule. Shortly after, an outbound pilot radioed a fresh echo sounder sweep from near kilometer four, reporting less water than expected, closer to 0.7 meters instead of the 1.2 we'd planned around. Around the same time, VTS mentioned the tide gauge was reading a slower rise than the table predicted. Interviewer: How did things develop from there? Participant: Approaching the bend, VTS told us the barge hadn't moved despite requests, so I adjusted our track. Then the wind picked up faster than forecast right as we were down to one tug made fast, with the second still twenty minutes out. Near the berth, a cross-current pushed us off line during final approach, and we corrected with the tugs we had by then. Interviewer: Let's take these one at a time. Starting with the clearance question after the outbound pilot's report — what were you actually weighing? Participant: I had the morning tide table figure, and now a fresh sounding plus a tide gauge trend running slower than predicted. I didn't want to just discount either one. I asked the master to run our own echo sounder sweep as we approached that stretch to see what we were actually reading under our own hull, since the outbound vessel's trim and draft weren't identical to ours. That came back closer to the outbound pilot's number than the original table, maybe 0.8 to 0.9 meters once I accounted for our squat at the speed we were making. Interviewer: So how did that change your plan? Participant: I cut speed to reduce squat and shifted our track toward the deeper water on the outer edge of that stretch. Combined, cutting speed and hugging the deeper line got our effective margin back to something I was comfortable with, without needing to blow the tidal window with a full delay. Interviewer: Did you consider just holding the original timing, or delaying instead? Participant: Both were on the table. Holding the original timing didn't sit right once we had two independent readings pointing the same direction. A full forty-minute delay was the safer extreme, but I judged that speed and track adjustment addressed the actual shortfall without sacrificing the window. It was closer than I like, honestly, maybe a six out of ten on confidence, but it was based on our own numbers, not just the forecast. Interviewer: Moving to the barge near the bend, what options did you weigh? Participant: Push VTS harder for an emergency move, slow down and favor the wider side, or hold position until it cleared. I went with slowing and shifting track because waiting would have eaten into the window we'd already tightened up, and pushing VTS wasn't going to move the barge fast enough anyway. Interviewer: How much time did you have to decide? Participant: A couple of minutes. Enough to make a deliberate call, not enough to sit and debate it. Interviewer: Next, the tug situation with rising wind. Participant: With only one tug fast and the second still well out, and gusts running above forecast, I didn't want to rely purely on the bow thruster given our draft. When I heard a harbor tug not originally assigned was nearby, I requested that one instead of waiting on our delayed second tug. Getting help sooner mattered more than sticking with the original assignment. Interviewer: Was waiting ever seriously on the table? Participant: Briefly, yes, but the wind was trending the wrong way, and bringing in help early felt like the safer bet. Interviewer: And the final approach, with the cross-current? Participant: By then both tugs were fast. I chose a graduated correction rather than aborting, applying tug and thruster power progressively and watching the response. If that hadn't taken hold quickly, I would have aborted and circled. It ended up tighter to the neighboring berth than I'd like, but within what the berth operator confirmed was workable. Interviewer: What made continuing feel safer than aborting? Participant: The initial response to tug power told me we had steerage and margin. That's really the deciding factor in the moment, how she responds to the first correction. Interviewer: Looking back, if the echo sounder report had reached you before you even left the pilot station, would your approach have changed? Participant: Possibly less improvisation involved. I'd have built the speed reduction and track shift into the plan from the start rather than adjusting mid-transit. The outcome likely would have been similar, just calculated earlier with more margin to plan around. Interviewer: If the second tug had arrived on schedule, would the bend or the berthing approach have gone differently? Participant: The bend, not much, that was about the barge and speed. The berthing correction might have felt less tight, since we'd have had both tugs from the start rather than bringing in a substitute. Interviewer: Anything you'd have wanted to know sooner? Participant: I'd have liked our own sounding data earlier rather than relying on someone else's reading first. That's really a sequencing issue, not a judgment one. Interviewer: What would you tell a less experienced pilot about a transit like this? Participant: Don't treat any single number, old or new, as final. Cross-check it against your own instruments when the margin is tight enough to matter, and build your track and speed decisions around what you can verify yourself."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

