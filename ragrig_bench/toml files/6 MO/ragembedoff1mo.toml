# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Before we start, I want to confirm you're comfortable having this conversation recorded and used for training analysis purposes only, no names attached to the write-up. Participant: Yeah, that's fine, I've done these debriefs before. Interviewer: Great. Can you tell me a bit about your background as a harbor pilot? Participant: Sixteen years piloting on this river system, mostly deep-draft container and bulk carriers. I've taken vessels the size of the Kalliopi up to Berth 7 probably a hundred times. Interviewer: Let's talk about this particular transit. Can you walk me through what you knew before you even boarded? Participant: Sure. It was a fully loaded container ship, about 300 meters, drawing 14.2 meters. Port control had sent over the passage plan that morning built around the tide table, which gave us roughly 1.2 meters of under-keel clearance at our planned transit time. That's tight, but it's within what we consider workable for that stretch. We had a closing tidal window, maybe ninety minutes to get up to the berth before the margin got too thin. Two tugs were assigned, wind was forecast around 15 knots picking up through the afternoon. Interviewer: What made this one feel nonroutine compared to a typical run up that channel? Participant: A few things stacked up. There was a barge moored tighter to the bend than charted, one of our tugs got delayed at the pilot station, and the wind ended up running a bit hotter than forecast. None of those alone would worry me much, but together they made it a transit where I was managing multiple moving pieces instead of just following the plan. Interviewer: Let's reconstruct the sequence. What happened right after you boarded? Participant: I went up to the conning position, confirmed the passage plan with the master, checked the draft survey again, and we started the transit close to the planned time. Not long after we got underway, an outbound pilot radioed in a fresh echo sounder sweep from near kilometer four, saying he was seeing less water than expected there, something closer to 0.7 meters of clearance instead of the 1.2 we'd planned around. Around the same time, VTS mentioned the tide gauge was reading a slightly slower rise than the table predicted. Interviewer: How did that develop as you continued? Participant: We kept going. Then approaching the bend, VTS told us the barge hadn't moved despite requests, so I had to adjust our track. After that, the wind picked up faster than forecast right as we were down to one tug made fast, with the second one still twenty minutes out. Near the berth, a cross-current pushed us off line during the final approach, and we had to correct with the tugs we had by then. Interviewer: Let's go through each of those in turn. Starting with the clearance question after the outbound pilot's report — what were you weighing at that moment? Participant: I had the morning tide table figure in hand, which I trust because it comes from the same source we use every day and it's usually solid. Then I had this one radio report from another pilot's sounding. My read was that a single sweep from someone else's vessel isn't necessarily apples to apples with our draft and trim, so I didn't see it as something that overrode the passage plan. The tide gauge lag was a few centimeters, not dramatic on its own. Interviewer: What alternatives did you actually consider there? Participant: Delaying about forty minutes to let the tide build more before we hit that stretch, or slowing down and shifting toward the deeper side of the channel. Both were on the table. I chose to hold our timing and proceed as planned, treating the 1.2 as still the number that mattered. Interviewer: What made you settle on that instead of recalculating with the new sounding and the slower tide rise together? Participant: Honestly, the original number felt like the anchor point for the whole plan, it had already been checked by port control, and one radio call didn't feel like enough to unwind that. In hindsight I probably could have asked for a second sounding or run our own check before committing, but at the time it felt like the tide table was the more reliable reference. Interviewer: How confident were you in that judgment in the moment? Participant: Reasonably confident, maybe seven out of ten. Not fully certain, but confident enough not to change course. Interviewer: Moving to the barge near the bend — what options did you weigh there? Participant: I could push VTS harder for an emergency move, slow down and favor the wider side, or hold position until it cleared. I went with slowing down and shifting track because waiting would have eaten into our tidal window, and pushing VTS wasn't going to get the barge moved fast enough anyway. Interviewer: How much time did you have to decide? Participant: A couple of minutes, maybe less. Enough to make a deliberate call but not to sit and debate it. Interviewer: Next, the tug situation with rising wind. What was going through your mind? Participant: With only one tug fast and the second still well out, and gusts running above forecast, I didn't like relying purely on the bow thruster given our draft. When I heard a harbor tug not originally assigned was nearby, I asked for that one instead of waiting on our delayed second tug. It came down to getting extra help sooner rather than sticking with the original assignment. Interviewer: Was there a moment you considered just waiting it out? Participant: Briefly, yes. But wind was trending the wrong direction, and I'd rather bring in help early than get caught short later. Interviewer: And the final approach, with the cross-current pushing you off line? Participant: By then we had both tugs fast. I chose a graduated correction rather than aborting, applying tug and thruster power progressively and watching how she responded. Aborting and circling was an option, but I judged we had enough room and control authority to correct in place. Interviewer: What made continuing feel safer than aborting? Participant: The response to the first pushes of tug power told me we had steerage and margin. If that correction hadn't taken hold quickly, I would have aborted. It ended up tighter to the neighboring berth than I'd like, but within what the berth operator confirmed was workable for mooring. Interviewer: Looking back at the whole transit, if the echo sounder report had reached you before you left the pilot station instead of mid-transit, would your timing decision have gone differently? Participant: Possibly. Getting it earlier, alongside the tide gauge lag, together rather than as two separate small inputs, might have pushed me toward the delay option. Mid-transit, each piece came in isolated and didn't feel like enough on its own to override a plan that was already running. Interviewer: If the second tug had arrived on schedule, would the bend or berthing approach have gone differently? Participant: The bend, not much, that was really about the barge and speed. The berthing correction might have felt less tight, since we'd have had both tugs earlier rather than picking up the harbor tug as a stand-in. Interviewer: Is there a point where, in retrospect, you might have weighted new information more heavily? Participant: Probably the clearance question early on. I leaned on the original figure because it had already been vetted, and I discounted the fresh sounding a bit more than I probably should have. Interviewer: What would you tell a less experienced pilot to watch for in a transit like this? Participant: Don't let the plan you walked in with carry more weight just because it came first. New readings, even partial ones, deserve a real second look, not just a quick mental check against what you already believe."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

