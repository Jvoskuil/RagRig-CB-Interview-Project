# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this is a voluntary debrief for our internal review process, not a disciplinary hearing — you can decline to answer anything. Can you start by telling me your role on this voyage? Participant: Sure. I'm master of the Kestrel Bay, bulk carrier, about 76,000 deadweight. This was the inbound leg to Rotterdam, Berth 7, with a grain cargo that had a fairly tight delivery clause attached to it. Interviewer: And before we get into the specifics — what did you know about the passage plan going in? Participant: The passage plan had been filed and approved before we sailed from the load port. Standard route through the Maasgeul into the Nieuwe Waterweg. Nothing unusual about it at that stage. Interviewer: Okay. Let's start with your account of what happened, in your own words, and then we'll go back through it in more detail. Participant: Right, so we were maybe three hours out from the tidal gate when NAVTEX came through with an update — a newly surveyed shoal patch near our filed track, reduced depth compared to the charted figure. There was an alternate channel that was deeper, but it would've added about forty minutes to the transit. Given our tidal window was already tight because of the charter penalty clause on the cargo, I decided to stick with the original plan. It had already been coordinated with the agent and the pilot station, and my read at the time was that the revision was probably minor — these shoal notices come through fairly often and a lot of them are conservative. Chief Officer flagged afterward that our under-keel clearance margin near that patch would be tighter than usual given the datum tide, and once you add squat effect at our transit speed, the margin gets thinner still. But by then we were committed to the route. We came into the approach channel around dusk, patchy fog rolling in, and a squall building further out. ECDIS had the countdown to the tidal gate running prominently on the display — that was the thing everyone kept glancing at, because if we missed it we'd be looking at hours of delay and tugs and pilot slots getting reshuffled. Radar showed a handful of contacts, small fishing vessels bunched near the edge of the fairway, plus one slower, ambiguous return that the OOW mentioned in passing near the deep-water part of the track. I told him to keep an eye on the deep water and let me know if anything closed in — my attention at that point was really on the gate timing and getting the berth logistics locked down with the agent. About twenty minutes later the Chief Engineer called up to report the main engine cooling water temperature was running above normal. He recommended dropping to half power for about twenty minutes to inspect it. I've had that alarm before — more than once in fifteen years — and it's almost always a sensor lag issue that resolves itself. So I told him I'd seen it before and we'd hold speed. He called back later saying the trend didn't look like the usual lag pattern, more sustained, but by then VTS had come through with a traffic advisory identifying that ambiguous contact as a drifting fishing vessel without power, closer to the centerline than we'd plotted. That's when things got busy. Interviewer: Let's walk through the sequence again, a bit slower this time. What information were you drawing on at each stage? Participant: NAVTEX for the shoal update, ECDIS for the route and the gate countdown, radar and ARPA for traffic, VTS for the broader picture, and engine room reports over the phone. Each one came in at a different point, so it wasn't like I had the full picture at any single moment — you're building it as you go. Interviewer: And what were you and the officers focused on as you entered the channel? Participant: Mostly the tide gate and the berth coordination. That was the pressure point. The OOW was watching traffic, I was managing timing and talking to the agent about tug availability. Interviewer: Let's go back to the NAVTEX update. What alternatives did you weigh, and why did you choose to keep the original route? Participant: The alternate channel was the obvious other option, and slowing down to get an updated survey confirmation was theoretically on the table too. But re-filing the route means coordinating again with the pilot station and probably losing the slot anyway, so functionally it felt like the same outcome as just taking the delay. The original plan was already approved and everyone downstream was expecting it. I didn't really re-run the numbers on the new depth against our draft and the tide — it felt like something that would've been flagged harder by the agency if it were serious. Interviewer: During the channel transit, what cues were you attending to, and is there anything you think you might have missed? Participant: Honestly, the gate countdown was dominating my attention, and the berth call. The fishing boat cluster registered as background traffic — normal for that stretch. The one ambiguous contact, I noted it, told the OOW to watch it, but I didn't personally re-plot it or push VTS for a read on it myself. In hindsight there was a window there where I could've asked more directly what that contact actually was instead of just filing it as 'probably fine, keep an eye on it.' Interviewer: When the Chief Engineer raised the temperature reading, what gave you confidence in your call to hold speed? Participant: Mostly just having seen that specific alarm pattern before, multiple times, without it turning into anything. It's a judgment built on a lot of runs on similar plant. I didn't ask him to pull fresh diagnostics before deciding — I made the call fairly quickly based on that history. Interviewer: When VTS issued the traffic advisory, what options did you weigh before acting? Participant: Abort the gate attempt entirely and anchor to reassess, take a smaller late adjustment to clear both the contact and the shoal, or call for pilot and tug assistance immediately and slow right down. I went with the smaller adjustment — full abort felt disproportionate given how close we already were, and I judged we had enough margin to thread it. Interviewer: What information, if it had arrived earlier, would have changed your decision at the route stage? Participant: If the NAVTEX update had come through before we'd filed and departed, I think I'd have just taken the deeper channel without a second thought — there'd have been no schedule cost attached to it yet. Timing of when it landed relative to our commitment really shaped how I weighed it. Interviewer: Looking back now, how clear were the warning signs about the shoal at the time you made that routing call? Participant: Looking back, it was pretty clear that the alternate channel was the sounder option — the depth reduction plus squat plus the tide state, once you line it all up, points obviously to being cautious there. It's hard now not to see it as something I should have caught immediately. Interviewer: What would you do differently if you faced the same engine-temperature situation again? Participant: Probably ask for a fresh reading or a short trend check before deciding, rather than leaning purely on what I remembered from past incidents. Interviewer: Last one — if the fishing vessel hadn't been drifting without power, just moving normally, do you think the outcome would have played out differently given how the attention was allocated during the transit? Participant: Probably would've passed without anyone thinking twice about it, which is part of why it didn't feel urgent in the moment. The margin for error was just a lot thinner than any of us realized while it was actually happening."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

