# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this conversation is being recorded for a review of decision-making processes during watch operations, not for any disciplinary purpose. Is that okay with you? Participant: Yeah, that's fine. Happy to walk through it. Interviewer: Great. Can you start by telling me a bit about your role and what you were responsible for monitoring that evening? Participant: Sure. I was on console for the approach channel, so my job was traffic separation through the narrows — sequencing inbound and outbound vessels, keeping an eye on anything that didn't fit the normal pattern, and coordinating with pilots on larger transits. That evening we had a crude tanker inbound under pilotage, and it was right around dusk, so visibility was starting to get patchy with some fog banks rolling through. My main objective was just making sure the tanker had a clean run through the bend within its tidal window, since that channel doesn't give you much room to maneuver once you're committed. Interviewer: Okay. Walk me through what happened, from when things started to become unusual. Participant: About forty minutes before the tanker was due at the bend, I picked up a small contact near there — slow track, kind of wandering. AIS class B tagged it as a local fishing vessel, one that's licensed to work that area, so my first read was that it was probably setting or hauling gear. That's a pretty common sight in that spot, especially in the evening. The radar was showing some inconsistent course data on it, near-zero speed at some points, but with the sea state kicking up a bit of clutter, small-target tracking isn't always clean, so I didn't put much weight on that at first. No distress call, nothing on the radio suggesting trouble, so I logged it as routine and kept my main attention on the tanker's progress. Interviewer: What happened after that? Participant: About ten minutes later I noticed the track had drifted a bit further toward the centerline than I'd expect from a boat working gear in that area, and there was a short burst on the radio from around that frequency, but it was garbled — couldn't make out any content. Around then my shift supervisor came on for handover and looked at the display with me. He'd worked that stretch for years and said straight off that this looked typical for that vessel, that he'd seen this exact drift pattern before with boats working that bend. My colleague on the next console glanced over and mentioned the track looked a little off to her, but didn't push it further, and we moved on with finishing the handover log. Then, as the tanker got closer to the tidal cutoff, the supervisor turned to me and framed it as, essentially, are we going to lose the tide window over this or not. I proceeded with the transit as scheduled. Afterward, once the tanker had cleared and things settled, we found the fishing vessel was completely stationary and not answering hails, so I put out a general advisory. Turned out later it had a fouled propeller and needed a tow. Interviewer: Let's reconstruct that a bit more carefully. Starting with your very first read on the contact — what specific cues led you to call it routine fishing activity? Participant: Mainly the AIS tag. It came up as a class B unit registered to a fishing vessel we see in that area fairly often, so that matched what I'd expect to see there at that hour. I did notice the COG data wasn't fully consistent with active maneuvering, but I chalked that up to the clutter — that channel gets noisy on radar with any chop, and small targets bounce around in the plot all the time. Interviewer: Did you go back and check the COG pattern again once you'd made that initial call? Participant: Not specifically, no. Once I had a plausible explanation for it, my attention went back to the tanker's progress, since that was the higher-priority track at that point. Interviewer: What alternatives did you consider at that moment? Participant: I could have hailed the vessel directly on VHF to check status, or just flagged it for tighter radar tracking without contacting them. I didn't do either right away — with no distress call and the AIS type matching, it didn't seem urgent enough to prioritize over the tanker sequencing. Interviewer: Moving to the handover — tell me more about that conversation with your supervisor and colleague. Participant: He came on, looked at the plot, and said it looked like the same pattern he'd seen from that boat before — kind of a lazy drift while gear's out. He said it with a lot of confidence, and honestly that matched my own initial read too, so it didn't feel like there was much to question. My colleague said something like 'that track looks a little odd' but didn't really elaborate, and nobody asked her to say more. We closed out the handover log with a 'no action required' note on that contact. Interviewer: Did anyone suggest getting an independent re-plot or double-checking the radar data before finalizing that note? Participant: No, not really. It felt like a fairly settled read at that point, given his experience with that specific vessel. Interviewer: When the tanker was about fifteen minutes from the bend, how did the decision to proceed take shape? Participant: That's when my supervisor turned it into a scheduling question — asked whether holding for this would cost us the tide window. Once he framed it that way, the conversation was mostly about whether the delay was worth it, since missing that window would push the tanker's transit back a full cycle. Holding to confirm the fishing vessel's status would almost certainly have meant losing the window. Interviewer: Was there a point where you weighed the safety margin on its own, separate from the schedule question? Participant: I think I mostly folded it into the same conversation — the tide window was the thing driving the urgency, so that's the lens I was looking at it through. In hindsight I can see how that shaped which options felt realistic. Interviewer: What alternatives were on the table there? Participant: Holding the tanker outside the channel, advising the pilot to slow down and open up the CPA a bit while still proceeding, or just going ahead as scheduled. I went with proceeding as scheduled, given the tide constraint. Interviewer: And the final decision, after the tanker had cleared and the fishing vessel was found stationary and not responding — how did you land on issuing the advisory? Participant: At that point the immediate encounter was already resolved, but there was another inbound vessel due within the hour, so I weighed that residual risk against the fact that the current situation had cleared without incident. I decided the advisory was worth it given the upcoming traffic, even though nothing bad had actually happened yet. Interviewer: How much time pressure did you feel across these decisions? Participant: The tide window created real pressure during that middle stretch. The final advisory call felt calmer, more like a standard judgment call with time to think it through. Interviewer: If you'd gotten a clean, confirmed COG reading right at the start, would anything have changed? Participant: Probably — if it had clearly shown no active movement at all, I likely would've tried to raise them on the radio much earlier instead of letting it ride. Interviewer: Looking back, if your colleague had pushed harder on that 'looks odd' comment, do you think it would have changed the outcome? Participant: Possibly. If she'd said more specifically what she was seeing, it might have prompted another look at the plot before we closed the handover. Interviewer: And if the tide-window question had been framed differently — say, purely as a safety check rather than a scheduling one — do you think you'd have weighed the options differently? Participant: That's a fair point. I might have leaned more toward slowing the pilot down or holding briefly, if the conversation had started from the risk side rather than the schedule side. Interviewer: Anything you'd want to do differently if this came up again? Participant: I'd probably push for a direct radio check earlier, before letting an initial read sit unchallenged for too long."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

