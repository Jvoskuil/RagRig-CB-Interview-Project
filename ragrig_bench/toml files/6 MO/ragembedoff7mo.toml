# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. As explained, this is a confidential debrief to understand the reasoning behind decisions during the cargo transfer alongside the platform last month — not a disciplinary review. Anything you share helps refine our procedures. Are you comfortable proceeding? Participant: Yes, that's fine. Happy to walk through it. Interviewer: Great. Can you start by describing your role on that job? Participant: I was the DPO on watch, running station-keeping in DP2 mode while we did a scheduled cargo transfer — deck cargo and some bulk — to the platform. Normally that's a fairly routine job. We hold position off the leg, crane operator on the platform takes the lifts off our deck, and we just maintain the watch circle until it's done. Interviewer: And what made this particular job different, if anything? Participant: Weather was closing in faster than the forecast suggested first thing that morning. We had maybe a four-hour window before significant wave height would push past the platform crane's operating limit. So there was a bit more time pressure than usual, but nothing outside normal parameters when we started. Interviewer: Take me through what happened, from approach onward. Participant: On final approach, I noticed a discrepancy between the HPR and one of the DGPS units — about 1.8 meters. DGPS1 and DGPS2 were agreeing closely with each other, and the system had auto-weighted those two into the primary solution, showing green across the board. HPR didn't have any maintenance flag against it, but given the other two were lined up, I read the HPR number as the odd one out and carried on with the approach. We got alongside, started the transfer, cargo went smoothly for the first several lifts. About halfway through — call it 55% of the load transferred — Thruster 3 threw a yellow caution, reduced power availability. Consequence analysis still showed adequate capability, so I kept going in the same configuration. Superintendent called in around then too, just a reminder about the transit schedule afterward. Later, on the second-to-last lift, there was a wind shift that changed the footprint plot recommendation. I was heads-down on the crane boom position at that point, watching the load come across, and I didn't clock the footprint change until the Master mentioned the vessel's attitude had shifted. Checked afterward — the indicator had been sitting there on the secondary screen the whole time. Then for the last lift, OIM asked if we could finish or wanted to stand off. I told him we were maybe eight to ten minutes out, so we pushed on. Partway through that final lift our separation from the leg closed up more than I expected, and we ended up suspending early and backing off to a safer distance. No contact, no loss of position beyond the watch circle, but closer than I'd have liked. Interviewer: Let's reconstruct that in order. What were you actually monitoring at each stage? Participant: Early on, reference systems and the DP status page — standard for closing distance. Once we were alongside and lifting, my attention split between the crane display, thruster status, and periodic checks of the environmental trend. As the job went on, honestly, more of my attention shifted toward the crane display than the DP overview, especially in that last third. Interviewer: Let's go back to the reference discrepancy. Walk me through your decision process there. Participant: DGPS1 and DGPS2 agreed within normal tolerance, HPR was off by 1.8 meters, no fault logged on it. Two out of three lined up, and once I'd settled on the DGPS pair as the good solution, I didn't see much point going back into the HPR trace since it was just going to keep disagreeing with a picture I'd already accepted. So I proceeded on that basis. Interviewer: Did you do anything to independently check which reference was actually correct, beyond the system's selection? Participant: Not really — the pairing agreed and the status was green, so I didn't dig into the raw HPR trace further at that point. In hindsight the offset was a multipath effect from being close to the structure, so HPR wasn't actually wrong, but at the time the two-out-of-three read as good enough. Interviewer: What would have made you look harder at that discrepancy? Participant: If the DGPS units had disagreed with each other too, I'd have stopped and manually cross-checked before closing in. It was really the agreement between the two that settled it for me. Interviewer: Now the thruster caution at the halfway point — what went into staying in the same mode? Participant: The consequence analysis still showed us within capability, so procedurally there wasn't a hard requirement to change anything. We'd already gotten through a bit more than half the cargo, and the weather window was closing, so stopping to reassess felt like it would cost us more than it bought us at that stage. Interviewer: Did you consider switching to a more conservative setup — tightening the watch circle, adjusting reference weighting — rather than continuing exactly as before? Participant: Not actively, no. It wasn't red, so it didn't really register as something requiring a change in how we were running things. We'd been in that configuration all shift and it had been fine. Interviewer: Move to the final lift and the footprint change. What was pulling your attention at that point? Participant: The crane boom, almost entirely. That's the highest-consequence thing to watch during an active lift — if the load swings or the boom's position goes wrong, that's an immediate hazard. Checking the footprint plot is normally part of the scan during a lift like that, and the co-operator was on the bridge and could have picked it up, but with only one lift left I figured it was quick enough that it didn't need pulling him off what he was doing to specifically watch environmental trends. The footprint indicator itself is a visual cue only, no audible alarm tied to it, so it's easy for it to sit there unnoticed if you're not specifically glancing over. Interviewer: What would have changed that — would delegating the environmental watch to your co-operator have helped? Participant: Probably, yes. We didn't explicitly split that responsibility during the lift. In hindsight that would have been the more robust setup. Interviewer: Last one — the OIM's question about finishing the final lift. What did you weigh in your answer? Participant: Mainly the time — eight to ten minutes to complete it, and the equipment status hadn't escalated past caution level. So I told him we were good to finish rather than framing it around how much margin we actually had left, which by that point had narrowed more than I'd tracked. Interviewer: At that moment, did you actually have the separation and capability numbers available to answer in terms of margin instead of time, or was that information harder to pull together? Participant: It was there if I'd called it up — separation, remaining thrust reserve, all on the DP overview. But the eight-to-ten-minute figure was just quicker and more concrete to give the OIM, and once I'd framed it that way in my head, finishing felt like the obvious answer. If I'd led with the margin number instead, I think it would have looked like a less comfortable call. Interviewer: Looking back at that sequence overall, do you think there were earlier indications of how close things got at the end? Participant: Looking back, yes — the reference offset and the thruster caution together were quietly eating into our margin the whole time, and honestly it feels like it should have been fairly obvious that was building toward something. In the moment, though, neither one individually crossed a threshold that flagged it. Interviewer: If you were advising a newer DPO going into a similar job, what would you tell them to watch for? Participant: Don't let a green status or a majority agreement between references close the door on checking the outlier. And separate out who's watching the environmental picture versus the load, especially late in a job when you're tired and task-focused. Interviewer: Anything you'd do differently if this came up again? Participant: I'd probably reassess capability actively at the first caution rather than just confirming it was still within limits, and frame those late-stage go/no-go calls around remaining margin rather than remaining minutes. Otherwise the job itself was manageable — we just let a few small things ride longer than we should have. Interviewer: That's really helpful detail. Thank you for walking through it so thoroughly."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

