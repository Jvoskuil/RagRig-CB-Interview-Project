# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making the time. This is a confidential debrief on the cargo transfer job alongside the platform, purely to understand the reasoning behind decisions on the day — not a disciplinary review. Comfortable proceeding? Participant: Yes, go ahead. Interviewer: Can you start with your role that day? Participant: I was DPO on watch, running DP2 station-keeping during a scheduled cargo transfer — deck cargo and some bulk — to the platform. Normal job in most respects. Hold position off the leg, crane operator takes the lifts, we maintain the watch circle. Interviewer: What made this one non-routine? Participant: The forecast weather was closing in a bit faster than the morning brief suggested. Roughly a four-hour window before sea state would exceed the platform crane's limit. So there was schedule pressure, but nothing outside what we train for. Interviewer: Walk me through what happened, start to finish. Participant: On final approach I picked up a 1.7-meter discrepancy between HPR and the two DGPS units, which were agreeing with each other closely. The system had auto-weighted the DGPS pair and was showing green. I also remembered that HPR had an intermittent fault logged from a previous voyage — cleared, but never formally re-certified after that. Given that history, I treated the DGPS pair as the more trustworthy read and logged the discrepancy as unresolved rather than fully explained, and continued the approach. We got alongside, transfer went smoothly through the first several lifts. About halfway — 55% of cargo across — Thruster 3 raised a yellow caution, reduced power available. Consequence analysis still showed adequate capability, but with less margin than we'd started with. I also knew that switching to a more conservative configuration at that point would cost us something like twenty to twenty-five minutes we didn't have much room for against the weather window, so I weighed that against the capability numbers and kept going at the same pace. On the second-to-last lift, there was a wind shift that changed the footprint recommendation on the DP plot. I was on the crane boom display at that point, which is standard procedure during an active lift, and my co-operator was mid-exchange on the radio confirming rigging for the next lift, so neither of us picked up the footprint change immediately. The Master noticed the vessel's attitude shift a short time after and flagged it. For the final lift, OIM asked whether we could finish or should stand off. I checked both the time estimate — eight to ten minutes — and the separation and capability readout, which still looked adequate for that duration, and told him we could finish. Partway through, our separation closed faster than either figure had suggested it would, and we suspended early and backed off. No contact, stayed inside the watch circle, but it was closer than planned. Interviewer: Let's go back through that in order. What were you tracking at each stage? Participant: Early on, reference systems and DP status, which is standard for closing distance. Once we were alongside, it split across the crane display, thruster status, and periodic environmental checks. During the final lift specifically, the crane display gets priority per procedure, and whoever's free on the bridge picks up secondary monitoring — that shifted around a bit depending on what else was happening at the time. Interviewer: On the reference discrepancy — talk me through the reasoning there. Participant: DGPS1 and DGPS2 agreed tightly. HPR was off by 1.7 meters, and it had that fault history from a prior voyage — nothing currently logged against it, but nothing re-certifying it as fully sound either. Given a choice between two fresh, agreeing units and one with an open question mark over it, I leaned toward the DGPS pair. I didn't call it settled — I noted it as something to keep an eye on rather than a solved problem. Interviewer: Did you consider pausing to pull HPR's diagnostic log before continuing? Participant: I thought about it. It would have meant holding the approach for a few minutes with no clear guarantee it would tell us anything conclusive, since the fault history was intermittent by nature. I judged the DGPS agreement plus HPR's own track record gave enough basis to proceed, but I'll be honest, it wasn't a fully closed question either way. Interviewer: Now the thruster caution — what went into continuing there? Participant: The consequence analysis still cleared us, just with a smaller cushion than before. I also had a rough number for what a mode change would cost us time-wise against a window that was already tight. It came down to margin against time cost, and the margin figure won out. I can see an argument either way on that one. Interviewer: Did the amount of cargo already moved factor into it? Participant: No — the cargo already across was just where we happened to be in the sequence, not something I weighed. The actual comparison was the consequence-analysis margin against the projected delay from reconfiguring, and the margin held up well enough to justify continuing at that point. Interviewer: Move to the final lift and the footprint change. What was happening with attention at that point? Participant: Standard procedure has the crane display as priority during an active lift. My co-operator was tied up confirming rigging on the radio for the next lift, which is a legitimate concurrent task, not something either of us could have dropped without creating a different problem. So the footprint change sat for a short while before either of us caught it. Interviewer: Would reassigning that monitoring in the moment have been realistic? Participant: Possibly, but it would have meant interrupting a rigging confirmation that also affects safety on the next lift. It's a genuine trade-off, not an obvious call either way. Interviewer: Last one — the OIM's question about the final lift. Participant: I looked at both numbers I had — time to finish and the current separation and capability readout — and both supported finishing at that moment. The margin just closed faster than either had indicated it would once we were actually maneuvering. Interviewer: If the margin readout had shown a tighter number at that moment, would that have changed your answer? Participant: Probably, yes — if the readout itself had been less favorable I'd have told him to stand off. The issue wasn't which number I used, it's that the number moved faster than expected. Interviewer: Looking back at the whole sequence, does it seem like there were earlier signs of how close things got, or does it read that way mainly because of how it ended? Participant: Honestly, I go back and forth on that. Individually, none of those things — the discrepancy, the caution, the workload split — crossed a line that demanded a different call. Whether they add up to something predictable in hindsight, or whether it just came together unluckily at the end, I'm genuinely not sure. Interviewer: What would you tell a newer DPO facing something similar? Participant: Don't treat any single reading in isolation, and keep checking whether your trade-offs still hold as conditions shift, not just at the point you first made them. Interviewer: Anything you'd do differently? Participant: Maybe build in a fixed re-check of the margin figures rather than relying on the initial assessment holding steady. Otherwise I think the calls were reasonable given what was in front of me at each point. Interviewer: Appreciate you walking through this in detail."
]

[[agents]]
label = "Gemini Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
#deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_gemini.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
[agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
seed = 42

