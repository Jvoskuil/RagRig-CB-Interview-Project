# Ranker comparison: the default hybrid RRF ranker vs. pure cosine ranking
# (WeightedFusionRanker alpha = 1.0), on the ragrig default chat backend
# (Ollama, qwen3.5:9b), varying the context budget (4096 and 8192 tokens).
# Corpus = the embedded HTML fixture book, default pipeline (full parser
# registry + MarkdownChunker).

corpus_dirs = ["papers=/mnt/c/Users/Joost/Documents/papers"]

queries = [
    "Interviewer: Thanks for making time for this. Just to confirm, this conversation is being recorded for internal process review, and you're comfortable speaking openly about how the decisions unfolded? Participant: Yes, that's fine. I've done these debriefs before after audits. Interviewer: Great. Can you start by telling me your role and a bit about the situation we're discussing? Participant: I'm the Continuing Airworthiness Manager for our turboprop fleet. This one involved a lease-return aircraft — we had five days to get it back to the lessor in contract condition, and during the pre-return borescope inspection, the hangar crew flagged hydraulic seepage at a fitting that had already come up twice in the prior eight months. Interviewer: What was going through your mind when that finding came in? Participant: Honestly, my first reaction was 'there it is again.' We'd seen this fitting seep before, logged it, and it never went anywhere. The reliability trend data showed the seepage rate was within MEL tolerance historically, so nothing about the number itself was alarming. But we were also five days from a contractual deadline with financial penalties attached, so I wanted to move quickly. Interviewer: Walk me through what happened next, chronologically. Participant: Sure. Day one, the borescope finding comes in. I pull up the maintenance history, see the two prior logs, and my line engineer — Tomas, he's been with us over twenty years — takes a look and says it's the same seepage pattern we've always seen. Day two, we're deciding how to formally classify it. Tomas is confident it's cosmetic, says this fitting type 'just seeps, it doesn't fail badly.' Day three, I pull the reliability dashboard for a broader read before writing the disposition memo. Day four and five, we're finalizing release paperwork against the clock, because MRO's engineering support was only contracted through day three. Interviewer: Let's go back to that first day. What exactly made you comfortable classifying it as routine rather than escalating for expanded inspection? Participant: The recurrence itself, honestly. Two prior instances, same location, same profile — it fit the pattern we'd already established for this aircraft. Once I saw the third one lined up with the first two, it read to me as confirmation that this was just how this particular fitting behaves, not something new developing. So I deferred it under MEL rather than pulling it into an unscheduled inspection. Interviewer: Did you consider that three data points over eight months might not be enough to establish a real pattern? Participant: I mean — in hindsight, sure, three isn't a huge number. But in the moment it felt consistent enough. It wasn't like the readings were random or inconsistent with each other. Interviewer: What alternative did you weigh at that point? Participant: The other option was escalating to Quality immediately for an expanded inspection. I set that aside because nothing in the numbers themselves crossed a threshold — it was really the shape of the recurrence that drove my read, not the raw values. Interviewer: Moving to day two — Tomas's assessment. What was your process for validating what he told you? Participant: Tomas has been doing this longer than almost anyone on my team. When he said this fitting type doesn't fail catastrophically, just seeps, that carries weight. We didn't commission a fault-tree analysis at that point — partly hangar time, partly that his read seemed like sufficient technical grounds on its own. Interviewer: Was there a dissenting view from anyone else? Participant: There was, actually. One of our junior engineers suggested we pull the torque and seal specs to check whether something in the installation had drifted. I didn't follow up on that. It felt like duplicating effort when Tomas had already given a clear read. Interviewer: What would it have taken for you to pursue the junior engineer's suggestion instead? Participant: Probably if Tomas himself had seemed less certain, or if the seepage rate had ticked up rather than stayed flat. Even setting his read aside, the earlier occurrences had stayed level and hadn't progressed into anything worse across those eight months, so a new failure mode showing up now just didn't seem likely to me. That's really what made the spec check feel unnecessary at that point. Interviewer: Let's talk about day three, the reliability dashboard. What did that show you? Participant: Green status for that defect category, fleet-wide. That was reassuring — I referenced it directly in the disposition memo as supporting evidence for continued airworthiness. Interviewer: Did you check whether that green rating accounted for this tail number's specific recurrence history, or whether it was a fleet-average figure? Participant: I didn't dig into the calculation, no. It's an approved tool, it's what we use for these calls day to day. Between the dashboard and Tomas's read, everything was pointing the same direction, so that consistency across sources gave me a fair amount of confidence in the memo's conclusion. Interviewer: When you say 'everything pointing the same direction' — did you consider that the dashboard and Tomas's assessment might share the same blind spot rather than genuinely corroborating each other? Participant: That's a fair question. I didn't frame it that way at the time. It felt like two independent checks agreeing, which is usually a good sign. Interviewer: Let's move to the final decision — releasing the aircraft. What was the state of play by day four? Participant: MRO's engineering support had already left, deadline was two days out, and the seepage was still within tolerance with no new defect. I authorized release to service and we returned the aircraft on schedule. I did flag a borescope recheck for the next inspection interval, but didn't make it mandatory before dispatch. Interviewer: How much did the two-day deadline weigh on that call? Participant: Some, sure — everyone in this industry feels the schedule. But I want to be clear, my release decision itself was based on the tolerance readings and history, not the clock. Other managers might let a deadline push them into a call they're not comfortable with. I don't think that happened here. Interviewer: You mentioned earlier that hangar pressure and the departing MRO support were very much on your mind through days two and three. How does that square with the release decision being unaffected by timing? Participant: I see what you're asking. I suppose the schedule was in the background the whole way through — I just don't experience it as something that colors my technical judgment specifically at the end. Interviewer: What gave you confidence specifically in this aircraft, as opposed to the fitting type generally? Participant: Fifteen years at this airline, and I've never seen this exact fitting fail badly on any tail. That history made me comfortable that this one would be fine, even with the root cause investigation still technically open. Interviewer: If a completed fault-tree analysis had already been finished and available before you finalized the disposition memo, with the same five-day return window in place, would anything have gone differently? Participant: Possibly. If the analysis had come back clean, I'd have felt more settled citing it directly instead of leaning as much on Tomas's read and the dashboard together. If it had flagged something, obviously that changes the whole memo. Either way, I think I'd have leaned less on the two of those lining up and more on an actual finding. Interviewer: And if a less senior engineer had given you the same 'it just seeps' assessment — would you have weighed it the same way? Participant: Probably not as heavily. Tomas's tenure is a big part of why that carried the weight it did. Interviewer: Looking back, what would you do differently if this situation happened again tomorrow? Participant: I'd probably push harder for that fault-tree analysis before finalizing the disposition, and maybe not treat the recurrence pattern alone as settling the question so early. The return itself went smoothly, but I know that on its own doesn't really tell us whether the process behind it was solid — it just means nothing surfaced in that window. Interviewer: That's helpful context. Thank you for walking through it in this much detail."
]

[[agents]]
label = "Sonar Prompt 8192"
[agents.chat]
provider = "deepseek"            # "ollama" | "deepseek"
#model = "qwen2.5:1.5b"         # ignored for deepseek
context_tokens = 8192          # context budget for retrieved chunks
deepseek_model = "deepseek-v4-pro"   # deepseek only
deepseek_api_key = DEEPSEEK_API_KEY # deepseek only (or DEEPSEEK_API_KEY env)
# context_size_mode = "Auto"          # "Auto" | "Forced"
system_prompt_path = "prompt_sonar.md"    # custom system prompt ({context} placeholder)
# request_timeout_secs = 300          # per-request timeout, None = no timeout
 [agents.chat.params]                # generation overrides (all optional)
# temperature = 0.7
# top_p = 0.9
# max_tokens = 1024
 seed = 42


